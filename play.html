.orange,glow:"255,107,53"},tiburon:{name:"Tibur\xF3n",role:"THE LOAN SHARK",color:s.green,glow:"0,201,167"},cass:{name:"Cass Delgado",role:"THE LAUNDERER",color:s.gold,glow:"255,215,0"}},uf={brick_call:{speaker:"maria",portrait:"amused",priority:99,conditions:{flagNot:"brick_deal_done",moveLte:0},lines:[{text:"A payphone outside the Greyhound station rings. It rings for you. You know it rings for you because the man leaning on it says, \u201CIt\u2019s for you.\u201D",portrait:"neutral"},{text:"\u201CC\xE9sar\u2019s friend. The idiot on the bus with a kilo in his gym bag.\u201D A woman\u2019s voice. Amused. Expensive. \u201CRelax \u2014 if I were police you\u2019d already be in a van.\u201D",portrait:"amused"},{text:"\u201CI\u2019m Maria. C\xE9sar owed me money, which makes that brick partly mine. Bring it to Little Havana. I have a buyer tonight. I take 40, you take 60. Or argue with me \u2014 that\u2019s also fun.\u201D",portrait:"flirty"}],choices:[{text:"Take the deal \u2014 $4,800",reaction:"The buyer arrives in a white Countach. He doesn\u2019t get out. An envelope comes through the window: $4,800 cash. \u201CPleasure doing business,\u201D Maria says down the line. \u201CNow you have money. Go make more. I\u2019ll be in touch.\u201D",effects:{cashDelta:4800,"npc.maria.trust":2,"npc.maria.met":!0,flags:["brick_deal_done","maria_friendly_intro","maria_brick_debt"],montage:"Flipped C\xE9sar\u2019s brick for $4,800."}},{text:"Push for 50/50 \u2014 $6,000",reaction:"Silence on the line. Then: \u201COkay, cowboy. Fifty-fifty.\u201D She sounds amused. That\u2019s either good or dangerous. $6,000 cash. You feel like you won something. You\u2019ll find out later what it cost.",effects:{cashDelta:6e3,"npc.maria.trust":1,"npc.maria.met":!0,flags:["brick_deal_done","maria_friendly_intro","maria_negotiated"],montage:"Squeezed Maria for 50/50 on the brick. $6,000."}}]},act2_maria:{speaker:"maria",portrait:"knowing",priority:13,conditions:{totalProfitGte:12e3,"npc.maria.met":{eq:!0},flagNot:"act2_done",dealsSinceGte:2},lines:[{text:"Maria finds you at a window table in a Cuban diner. She doesn\u2019t order. She never orders. \u201CTwelve thousand in profit. The street is starting to say your name without laughing.\u201D",portrait:"amused"},{text:"\u201CEvery man I\u2019ve watched make money in this town believed the money was the game. The money is the ANTE.\u201D She taps the window. Outside, a DEA sedan idles. \u201CThe game is leaving the table while you still can.\u201D",portrait:"knowing"}],choices:[{text:"So how do I get out?",reaction:"\u201CForty thousand, clean or close to it, buys a passport and a charter from a forger I trust.\u201D She finally smiles. \u201CStack it. I\u2019ll be watching. I\u2019m always watching.\u201D",effects:{"npc.maria.trust":1,flags:["act2_done"],montage:"Maria laid out the exit: $50K and a forger."}},{text:"I'm not leaving. I'm winning.",reaction:"Something flickers behind her eyes \u2014 amusement, or a memory. \u201CThat\u2019s what C\xE9sar said. And the one before C\xE9sar.\u201D She drops a hundred on a table with no bill. \u201CThen win BIG, cowboy. Eighty cred, four districts, half a million moved. Miami only kneels to numbers like that.\u201D",effects:{cred:3,flags:["act2_done","kingpin_path"],montage:"Told Maria you're here to win, not run."}}]},act3_maria:{speaker:"maria",portrait:"flirty",priority:13,conditions:{totalProfitGte:45e3,flag:"act2_done",flagNot:"act3_done",dealsSinceGte:1,"npc.maria.trust":{gte:1}},lines:[{text:"A postcard arrives at your motel. No return address. A flamingo on the front. On the back, in expensive handwriting: \u2018Homestead. Tuesday. Bring a toothbrush.\u2019",portrait:"neutral"},{text:"You call her from a payphone. \u201CThere\u2019s an airstrip near Homestead,\u201D Maria says. \u201CA man with a plane owes me a favor the size of a felony. Two seats. I\u2019m offering you one \u2014 twenty thousand covers the fuel and his silence.\u201D",portrait:"flirty"}],choices:[{text:"Hold the seat for me",reaction:"\u201CDone. The offer doesn\u2019t expire, but Miami\u2019s patience does.\u201D A pause, almost soft. \u201CDon\u2019t make me read about you in the Herald.\u201D Click. The dial tone sounds like a countdown.",effects:{"npc.maria.trust":1,flags:["act3_done","maria_exit_plan"],montage:"Maria is holding a seat on a plane out."}},{text:"Sell the seat. I need capital.",reaction:"A long silence. \u201CYou\u2019re either the smartest man I\u2019ve met or the next John Doe in the Dade County cooler.\u201D She wires you eight thousand for the favor returned. The plane leaves Tuesday. Without you.",effects:{cashDelta:8e3,"npc.maria.trust":-1,flags:["act3_done","sold_the_seat"],montage:"Sold your seat on Maria's plane for $8,000."}}]},act3_forger:{speaker:"tiburon",portrait:"neutral",priority:13,conditions:{totalProfitGte:45e3,flag:"act2_done",flagNot:"act3_done","npc.maria.trust":{lte:0}},lines:[{text:"Tibur\xF3n waves you over at the fish market like an old debt come to say hello. \u201CYou look like a man counting backwards from a number. Everybody gets there. Even me, once.\u201D",portrait:"neutral"},{text:"\u201CThere is a man in the Keys who makes paper people. Passports. Histories. He owes me a fish dinner and his life, roughly in that order. Forty thousand, and you become somebody who was never here.\u201D The gold tooth flashes. \u201CConsider it a loyalty program.\u201D",portrait:"neutral"}],choices:[{text:"Tell me where to find him",reaction:"He writes an address on butcher paper that smells like the sea. \u201CWhen you go, go QUIET. The city notices leaving more than arriving. It\u2019s vain like that.\u201D",effects:{"npc.tiburon.met":!0,"npc.tiburon.trust":1,flags:["act3_done","forger_contact"],montage:"Tibur\xF3n pointed the way out: a forger in the Keys."}}]},ramirez_endgame:{speaker:"ramirez",portrait:"wry",priority:14,conditions:{evidenceGte:14,"npc.ramirez.met":{eq:!0},flagNot:"endgame_warned"},lines:[{text:"Your phone rings at 4 AM. You didn\u2019t give anyone this number. \u201CI want you to hear something,\u201D Ramirez says. Paper rustles. \u201CThat\u2019s your file. Four hundred pages. It makes a sound now when I drop it on the State Attorney\u2019s desk.\u201D",portrait:"tired"},{text:"\u201CI\u2019m not calling to gloat. In fifteen years I\u2019ve arrested two hundred of you, and exactly three ever got this warning: it\u2019s days now. Not weeks. Days.\u201D",portrait:"wry"}],choices:[{text:"Then I'd better hurry",reaction:"\u201CYeah,\u201D he says, and you can hear the shrug. \u201CThey always say that too.\u201D The line goes dead. Somewhere across the city, a man with a four-hundred-page file goes back to work.",effects:{flags:["endgame_warned"]}},{text:"What's the deal, detective?",reaction:"\u201CSame as it ever was. Names. Dates. The Colombian\u2019s supply route.\u201D You give him enough to matter. Pages come out of the file \u2014 you can almost hear them. So can the cartel.",effects:{"npc.ramirez.evidence":-6,"npc.colombiano.trust":-3,cred:-10,flags:["endgame_warned","became_informant"]}}]},col_rival:{speaker:"colombiano",portrait:"pleased",priority:12,conditions:{flag:"col_rival_active",flagNot:"col_rival_met",dealsSinceGte:1},lines:[{text:"A table is waiting for you at a restaurant you\u2019ve never been to. So is El Colombiano. Two glasses of rum are already poured, which means he knew you were coming before you did.",portrait:"neutral"},{text:"\u201CYou\u2019ve seen my crews on the corners. Good. I wanted you to see.\u201D He unfolds a map of Miami like a man unfolding a will. \u201CThis city is a pie, friend. I am proposing we cut it like gentlemen \u2014 before someone cuts it like animals.\u201D",portrait:"pleased"}],choices:[{text:"This city isn't big enough for both of us",reaction:"He nods slowly, almost approving, and folds the map with great care. \u201CC\xE9sar said something similar once. From a payphone in Panama, eventually.\u201D He leaves the rum. He leaves the check. \u201CThen we understand each other perfectly.\u201D",effects:{"npc.colombiano.trust":-2,cred:4,flags:["col_rival_met","col_war"],montage:"Declared war on El Colombiano over rum you didn't drink."}},{text:"To gentlemen, then \u2014 split the city",reaction:"\u201CTo gentlemen.\u201D The glasses touch. \u201CMy blocks are my blocks. Yours are yours. My crews will not undercut you, and the pie stays a pie.\u201D The rum is excellent. The peace will last exactly as long as it profits him.",effects:{"npc.colombiano.trust":2,flags:["col_rival_met","col_peace"],montage:"Split the city with El Colombiano. For now."}}]},col_parley:{speaker:"colombiano",portrait:"cold",priority:12,conditions:{flag:"col_war",credGte:50,flagNot:"col_parley_done",dealsSinceGte:3},lines:[{text:"Three of his men walk you \u2014 politely, which is worse \u2014 to a car with diplomatic plates. El Colombiano sits in the back reading the Herald. \u201CThey wrote about you today. Page nine. You\u2019re moving up.\u201D",portrait:"cold"},{text:"\u201CThis war is costing me money. Worse \u2014 it\u2019s costing me QUIET.\u201D He folds the paper. \u201CFifteen thousand, and my crews stand down. Or we keep going, and one of us ends up on page ONE.\u201D",portrait:"neutral"}],choices:[{text:"Take the $15,000 \u2014 peace",reaction:"The envelope is heavy and the handshake is dry. \u201CYou know what separates businessmen from bodies? Knowing which page of the newspaper to aim for.\u201D The car door opens. Miami looks the same. It isn\u2019t.",effects:{cashDelta:15e3,"npc.colombiano.trust":2,flags:["col_parley_done","col_peace"],montage:"Took $15K from El Colombiano to end the war."}},{text:"I'll see you on page one",reaction:"For one long second, nothing in the car moves. Then he laughs \u2014 a short, surgical sound. \u201CC\xE9sar at least took the money first.\u201D The door opens itself, somehow. The war is no longer business. It is personal, which in Miami is the expensive kind.",effects:{"npc.colombiano.trust":-3,cred:5,flags:["col_parley_done"],montage:"Spat on El Colombiano's peace. Page one it is."}}]},maria_truth:{speaker:"maria",portrait:"vulnerable",priority:10,conditions:{"npc.maria.trust":{gte:5},flagNot:"maria_truth",dealsSinceGte:4},lines:[{text:"Maria drinks tonight, which she never does, at a bar with no sign, which is the only kind she trusts. \u201CYou want to know about C\xE9sar.\u201D It isn\u2019t a question. \u201CEveryone eventually wants to know about C\xE9sar.\u201D",portrait:"vulnerable"},{text:"\u201CHe wasn\u2019t my debtor. He was my brother. The brick you carried off that bus was supposed to buy his way out of Panama.\u201D She turns the glass slowly. \u201CIt bought you in instead. Funny city.\u201D",portrait:"vulnerable"}],choices:[{text:"Then let me buy him out",reaction:"She studies you for a long time \u2014 the way she studied the deposit slip, the map, every man who ever promised her something. \u201CFive thousand reaches Panama by Friday.\u201D She doesn\u2019t say thank you. She squeezes your hand once, hard, which is worth more.",effects:{cashDelta:-5e3,"npc.maria.trust":3,flags:["maria_truth","freed_cesar"],montage:"Sent $5K to Panama. C\xE9sar walks."}},{text:"That's his debt, not mine",reaction:"\u201CNo,\u201D she agrees, finishing the drink. \u201CIt isn\u2019t.\u201D She leaves money on the bar and the warmth somewhere else entirely. \u201CYou\u2019re right, of course. Being right is your whole problem.\u201D",effects:{"npc.maria.trust":-1,flags:["maria_truth"]}}]},maria_guardian:{speaker:"maria",portrait:"knowing",priority:11,conditions:{"npc.maria.trust":{gte:4},fedHeatGte:55,flagNot:"maria_guardian",dealsSinceGte:3},lines:[{text:"Your pager buzzes a code you don\u2019t recognize: 5-0-5-0-5-0. You call. Maria answers before the first ring finishes. \u201CDon\u2019t talk. Listen. Vice is running saturation patrols on your usual routes tonight. ALL of them.\u201D",portrait:"knowing"},{text:"\u201CA friend of a friend types up the duty rosters. She types slowly when I pay her to. Take the causeway. Take it tonight. And burn this number.\u201D",portrait:"neutral"}],choices:[{text:"Take the back way (\u221212 heat)",reaction:"You drive the causeway with the windows down while, across the city, blue lights orbit corners you didn\u2019t stand on. The bay smells like salt and a favor you\u2019ll owe forever.",effects:{heatDelta:-12,"npc.maria.trust":1,flags:["maria_guardian"],montage:"Maria's typist saved your night. \u221212 heat."}},{text:"I don't run from patrols",reaction:"A pause long enough to drive a Countach through. \u201COf course you don\u2019t.\u201D The line clicks. Somewhere, a typist types at normal speed again.",effects:{cred:2,flags:["maria_guardian"]}}]},cass_intro:{speaker:"cass",portrait:"pleased",priority:12,conditions:{cashGte:18e3,flagNot:"cass_met",dealsSinceGte:2},lines:[{text:"The branch manager\u2019s office at Biscayne Fidelity smells like new carpet and old money. Cassandra Delgado reads your deposit slip the way a jeweler reads a diamond. \u201CEighteen thousand. Cash. In a gym bag.\u201D",portrait:"neutral"},{text:"\u201CRelax. Half of Brickell banks gym bags. The Federal Reserve says Miami has six billion more in circulation than it should. SOMEBODY\u2019S counting it.\u201D She closes the blinds with a remote. In 1986, that\u2019s practically witchcraft.",portrait:"pleased"},{text:"\u201CMy service: I run your paper through accounts so boring the IRS falls asleep reading them. Ten percent fee. What comes out is CLEAN \u2014 the kind of money that buys passports instead of indictments.\u201D",portrait:"pleased"}],choices:[{text:"Clean a quarter of my roll \u2014 10% fee",reaction:"She works a calculator with the serenity of a monk. Forms appear. You sign a name that is almost yours. \u201CPleasure doing business. Tell no one. Especially anyone named Ramirez.\u201D",effects:{"npc.cass.met":!0,"npc.cass.trust":1,launderPct:{pct:.25,fee:.1},flags:["cass_met"],montage:"Opened an arrangement with Cass Delgado at Biscayne Fidelity."}},{text:"Too rich for me",reaction:"\u201CSuit yourself.\u201D She reopens the blinds. \u201CBut men who keep it all in cash end up explaining the cash. Usually in a small room. Usually to a man with a thick file.\u201D She slides you a card anyway. Gold lettering.",effects:{"npc.cass.met":!0,flags:["cass_met","cass_declined"]}}]},cass_network:{speaker:"cass",portrait:"pleased",priority:10,conditions:{"npc.cass.trust":{gte:1},cashGte:3e4,flagNot:"cass_network",dealsSinceGte:3},lines:[{text:"Cass calls you to a lunch you didn\u2019t agree to at a club you can\u2019t afford. \u201CI\u2019ve been promoted. Regional. Which means I now supervise the people who would audit me. Miami is a beautiful machine.\u201D",portrait:"pleased"},{text:"\u201CNew offer. I put you in the NETWORK \u2014 shell companies, a marina, two funeral homes. Your money flows clean automatically. Plus I wash forty percent of what\u2019s in your pocket right now. Twelve percent fee. Standing arrangement.\u201D",portrait:"neutral"}],choices:[{text:"Put me in the network",reaction:"\u201CWelcome to the laundromat.\u201D She raises a glass of something French. From now on, money moves clean while you sleep. Somewhere in a funeral home ledger, you are listed as a \u2018consultant.\u2019",effects:{"npc.cass.trust":1,launderPct:{pct:.4,fee:.12},flags:["cass_network"],montage:"Joined Cass's laundering network. The funeral homes know your name."}},{text:"I like my money where I can see it",reaction:"\u201CSpoken like a man who\u2019s never met a forfeiture order.\u201D She finishes her drink and yours. \u201CThe offer stands until it doesn\u2019t.\u201D",effects:{flags:["cass_network_declined"]}}]},cass_squeeze:{speaker:"cass",portrait:"nervous",priority:11,conditions:{"npc.cass.met":{eq:!0},fedHeatGte:45,flagNot:"cass_squeeze_done",dealsSinceGte:3},lines:[{text:"Cass is waiting in your car. You didn\u2019t leave it unlocked. \u201CTwo men from Treasury visited the branch today,\u201D she says. Her hands are steady. Her voice is not. \u201CThey asked about gym bags.\u201D",portrait:"nervous"},{text:"\u201CI can make the paper trail evaporate. But evaporation costs eight thousand, and it costs it TONIGHT. Or I can start remembering things wrong about you. Banker\u2019s memory is a negotiable instrument.\u201D",portrait:"nervous"}],choices:[{text:"Pay the $8,000",reaction:"By morning, three accounts have been renamed, two closed, and one transferred to a dead man in Boca with excellent credit. \u201CWe never had this conversation,\u201D Cass says. \u201CWhich, in fairness, is true of all our conversations.\u201D",effects:{cashDelta:-8e3,"npc.cass.trust":1,flags:["cass_squeeze_done"],montage:"Paid Cass $8K to evaporate the paper trail."}},{text:"Remember whatever you want",reaction:"She nods slowly, the way bankers nod at bad loans. \u201CFor the record, I liked you.\u201D The car door closes with terrible gentleness. Somewhere downtown, a memory begins improving itself.",effects:{"npc.cass.trust":-3,flags:["cass_squeeze_done","cass_burned"]}}]},tiburon_intro:{speaker:"tiburon",portrait:"neutral",priority:11,conditions:{debtGte:6e3,totalDealsGte:2,flagNot:"shark_intro"},lines:[{text:"The fish market on the river, 6 AM. Tibur\xF3n guts a snapper with one hand and waves you over with the knife. \u201CThe new businessman! Sit. Mind the blood \u2014 it\u2019s the fish\u2019s. Today.\u201D",portrait:"neutral"},{text:"\u201CYou owe my book money. This is not a problem \u2014 DEBT is friendship, amigo. Debt means I think about you every day.\u201D The gold tooth catches the dawn. \u201CThe problem is when I stop thinking about you. Then my associates start.\u201D",portrait:"neutral"}],choices:[{text:"Pay $1,000 tribute now",reaction:"He weighs the envelope without opening it \u2014 a parlor trick that has ended arguments all over Miami. \u201CGood faith! I knock eighteen hundred off the book. See? Friendship.\u201D He hands you a snapper wrapped in newspaper. Your picture is not in the newspaper. Yet.",effects:{cashDelta:-1e3,debtDelta:-1800,"npc.tiburon.met":!0,"npc.tiburon.trust":1,flags:["shark_intro"],montage:"Paid tribute to Tibur\xF3n at the fish market."}},{text:"You'll get paid when you get paid",reaction:"The market goes quiet the way water goes quiet around a fin. Then Tibur\xF3n LAUGHS \u2014 huge, delighted. \u201CBrass ones! I respect it. My associates, however, are paid NOT to respect it.\u201D The knife comes down through the snapper\u2019s spine. Punctuation.",effects:{"npc.tiburon.met":!0,"npc.tiburon.trust":-1,cred:3,flags:["shark_intro","shark_grudge"]}}]},tiburon_job:{speaker:"tiburon",portrait:"neutral",priority:9,conditions:{"npc.tiburon.met":{eq:!0},debtLte:0,flagNot:"shark_job",dealsSinceGte:3},lines:[{text:"Tibur\xF3n finds you eating lunch and sits down without asking, which is how kings sit. \u201CYou paid the book. ALL of it. You know how rare that is? I had a banner made. Then I remembered I don\u2019t do banners.\u201D",portrait:"neutral"},{text:"\u201CSo \u2014 a JOB. A bag rides from the Keys to the Gables in your car. You don\u2019t open it. You don\u2019t smell it. Six thousand for an afternoon of not being curious. The cops may notice the car. That\u2019s the six thousand talking.\u201D",portrait:"neutral"}],choices:[{text:"I can not-be-curious for $6,000",reaction:"The bag is heavier than money and lighter than a body, and you spend the whole drive proud of yourself for not narrowing it down further. The envelope at the end is exactly six thousand. Tibur\xF3n counts respect the way he counts cash: out loud.",effects:{cashDelta:6e3,heatDelta:8,"npc.tiburon.trust":1,flags:["shark_job"],montage:"Ran a no-questions bag for Tibur\xF3n. $6,000."}},{text:"I'm out of the favor business",reaction:"\u201CSmart, maybe. Boring, definitely.\u201D He steals a fry. \u201CThe offer floats away like a body at high tide. Which is to say: it may come back.\u201D",effects:{flags:["shark_job"]}}]},maria_tip:{speaker:"maria",portrait:"amused",priority:9,conditions:{totalProfitGte:5e3,"npc.maria.trust":{gte:1},flagNot:"maria_gave_tip",dealsSinceGte:2},lines:[{text:"Your pager buzzes at 2 AM. Maria\u2019s code. You call back from a payphone that smells like bad decisions and worse cologne.",portrait:"neutral"},{text:"\u201CI\u2019ve got a man in Overtown who is dry. Crack and cocaine \u2014 he\u2019ll pay anything. And I mean anything. Desperate men are profitable men.\u201D",portrait:"amused"},{text:"\u201CBuy cheap anywhere else, sell there. And hurry \u2014 I gave this number to two people. You\u2019re the one I like slightly more.\u201D",portrait:"flirty"}],choices:[{text:"Thanks, Maria",reaction:"\u201CDon\u2019t thank me. C\xE9sar would\u2019ve charged you for it. You\u2019re already an improvement.\u201D She hangs up. The payphone smells slightly better now.",effects:{"npc.maria.trust":1,flags:["maria_gave_tip"],demandSpike:{loc:2}}}]},maria_party:{speaker:"maria",portrait:"flirty",priority:10,conditions:{credGte:10,"npc.maria.trust":{gte:2},flagNot:"maria_party_done",dealsSinceGte:3},lines:[{text:"Maria takes you to a private party in a Coral Gables mansion. The pool is shaped like a dollar sign. This is not a joke. The host is a \u201Creal estate developer\u201D whose real estate consists primarily of cocaine warehouses.",portrait:"amused"},{text:"\u201CSee the woman in the red dress? Federal prosecutor. See the man she\u2019s talking to? Her biggest defendant. They\u2019ve been sleeping together since April.\u201D",portrait:"knowing"},{text:"\u201CThis city runs on three things: cocaine, hypocrisy, and pool parties. Try the ceviche \u2014 it\u2019s actually good.\u201D",portrait:"flirty"}],choices:[{text:"Mingle with the guests",reaction:"You spend the night learning that everyone in Coral Gables is either a criminal or married to one. Several are both. Maria introduces you to people whose handshakes feel like contracts. Your name means something now.",effects:{"npc.maria.trust":1,cred:5,flags:["maria_party_done","high_society"]}},{text:"This isn\u2019t my scene",reaction:"\u201CSuit yourself.\u201D She vanishes into a crowd whose net worth exceeds the GDP of several Caribbean nations. You eat the ceviche alone. She was right \u2014 it\u2019s actually good.",effects:{"npc.maria.trust":-1,flags:["maria_party_done"]}}]},maria_launder:{speaker:"maria",portrait:"knowing",priority:9,conditions:{totalProfitGte:3e4,"npc.maria.trust":{gte:2},cashGte:8e3,flagNot:"maria_launder_offered"},lines:[{text:"Maria\u2019s gallery. The paintings are aggressively terrible. A canvas splattered with what looks like ketchup has a $28,000 price tag.",portrait:"amused"},{text:"\u201CDon\u2019t look at me like that. Art is subjective. Money laundering is objective. I can clean $5K for you right now.\u201D",portrait:"knowing"},{text:"She gestures at a painting of a sad horse. \u201CRun it through as a sale of this masterpiece. Nobody questions art. Nobody wants to admit they don\u2019t understand it.\u201D",portrait:"amused"}],choices:[{text:"Launder $5,000",reaction:"She writes a receipt. The sad horse gets a red SOLD sticker. \u201CI\u2019ve sold that horse four times this month. He\u2019s my best performer. Better than the Basquiat.\u201D",effects:{cashDelta:-5e3,cleanDelta:4500,"npc.maria.trust":1,flags:["maria_launder_offered"]}},{text:"Not yet",reaction:"\u201CThe offer stands. The horse isn\u2019t going anywhere \u2014 nobody actually wants to own it. That\u2019s the whole point.\u201D",effects:{flags:["maria_launder_offered"]}}]},maria_personal:{speaker:"maria",portrait:"vulnerable",priority:10,conditions:{credGte:20,"npc.maria.trust":{gte:4},"npc.ramirez.met":{eq:!0},flagNot:"maria_personal_done"},lines:[{text:"3 AM. Maria\u2019s gallery. She\u2019s drinking wine from a coffee mug and her shoes are off. This is the most human you\u2019ve seen her.",portrait:"vulnerable"},{text:"\u201CYou want to know why I do this? My mother cleaned hotel rooms for twenty years. TWENTY. Her back is destroyed. She can\u2019t stand for more than ten minutes.\u201D",portrait:"angry"},{text:"\u201CAnd the woman in the penthouse \u2014 the one whose sheets she changed every day \u2014 made her money the same way I make mine. The only difference is the number of zeros and the quality of the attorney.\u201D",portrait:"vulnerable"},{text:"She looks at you. The strategy is gone for a moment. What\u2019s underneath is more dangerous. \u201CStay alive, okay? I\u2019m running out of people I actually like in this city.\u201D",portrait:"vulnerable"}],choices:[{text:"I\u2019m not going anywhere",reaction:"She doesn\u2019t say anything for a long time. Then: \u201CDon\u2019t make me regret saying that.\u201D She puts her shoes back on. The strategy returns. But something behind it has shifted, and you both know it.",effects:{"npc.maria.trust":2,flags:["maria_personal_done","maria_close"]}},{text:"We\u2019re business. That\u2019s all.",reaction:"\u201CRight. Business.\u201D The coffee mug clinks on the desk. \u201COf course.\u201D You\u2019ve never heard two words carry that much weight. The gallery feels colder when you leave.",effects:{"npc.maria.trust":-2,flags:["maria_personal_done","maria_rejected"]}}]},maria_crack:{speaker:"maria",portrait:"angry",priority:7,conditions:{"npc.maria.met":{eq:!0},soldCrack:!0,flagNot:"maria_hates_crack"},lines:[{text:"Maria finds you at the bar. She\u2019s not smiling. \u201CCrack. You\u2019re selling crack now.\u201D",portrait:"angry"},{text:"\u201CI watched what that did to Overtown. Kids on corners. Mothers who can\u2019t remember their own names. You want to get rich? Fine. But not like that. Not around me.\u201D",portrait:"angry"}],choices:[{text:"It\u2019s just business, Maria",reaction:"\u201CMy mother said the same thing about the hotel. \u2018It\u2019s just work, Maria.\u2019 It\u2019s never just anything.\u201D She leaves her drink untouched. That\u2019s how you know it\u2019s serious.",effects:{"npc.maria.trust":-2,flags:["maria_hates_crack"]}}]},ramirez_intro:{speaker:"ramirez",portrait:"neutral",priority:15,conditions:{fedHeatGte:15,"npc.ramirez.met":{eq:!1}},lines:[{text:"Your barber stops mid-cut. Nods toward the window. Brown sedan. A man in a suit last fashionable during the Carter administration, drinking thermos coffee and reading a very thick file.",portrait:"neutral"},{text:"\u201CThat\u2019s Ramirez. Vice Intelligence. He\u2019s been out there since Tuesday.\u201D You ask if he\u2019s dangerous.",portrait:"neutral"},{text:"\u201CHe\u2019s honest. In this town, that\u2019s the most dangerous thing you can be.\u201D",portrait:"wry"}],choices:[{text:"Noted",reaction:"Your barber finishes the cut in silence. When you leave, Ramirez doesn\u2019t look up from his file. He doesn\u2019t need to. He already has your picture in it.",effects:{"npc.ramirez.met":!0,"npc.ramirez.evidence":2,flags:["ramirez_watching"]}}]},ramirez_coffee:{speaker:"ramirez",portrait:"wry",priority:10,conditions:{"npc.ramirez.met":{eq:!0},evidenceGte:3,flagNot:"ramirez_coffee",dealsSinceGte:3},lines:[{text:"He\u2019s waiting outside the caf\xE9 on Calle Ocho. Doesn\u2019t try to hide. Steps right up like you\u2019re old friends.",portrait:"neutral"},{text:"\u201CNice morning, isn\u2019t it? I love Miami in spring. The weather\u2019s beautiful. The crime rate, less so. Want a coffee? I\u2019m buying. Accepting coffee from an officer is not legally admissible \u2014 I checked.\u201D",portrait:"wry"},{text:"He smiles. It\u2019s the smile of a man who is patient in a way that should terrify you. \u201CI\u2019m not arresting you today. I just wanted you to know that I know. And now you know that I know. Isn\u2019t that nice? Enjoy the coffee.\u201D",portrait:"wry"}],choices:[{text:"Drink the coffee",reaction:"Good coffee. He watches you drink it like a man with all the time in the world. \u201CI make $38,000 a year. The guy I surveilled yesterday tipped a valet more than my mortgage. But sure \u2014 the system works.\u201D",effects:{"npc.ramirez.evidence":1,flags:["ramirez_coffee"]}},{text:"Walk away",reaction:"\u201CThey always walk away.\u201D You hear him sip behind you. \u201CThat\u2019s fine. I\u2019m patient. My captain says I\u2019m turning the tide. I\u2019ve been turning the tide for fifteen years. The tide hasn\u2019t noticed.\u201D",effects:{flags:["ramirez_coffee","ramirez_disrespected"]}}]},ramirez_photos:{speaker:"ramirez",portrait:"neutral",priority:10,conditions:{evidenceGte:6,flag:"ramirez_coffee",flagNot:"ramirez_photos",dealsSinceGte:3},lines:[{text:"An envelope on your windshield. No stamp. Inside: three Polaroids.",portrait:"neutral"},{text:"You, making a deal in Overtown. You, counting cash in Little Havana. You, meeting a lieutenant who works for a man you haven\u2019t met yet.",portrait:"neutral"},{text:"On the back of the third photo, in neat handwriting: \u201CMy daughter wants to be a photographer. I told her I\u2019m already pretty good at it. \u2014 H.R.\u201D The man has a sense of humor. That makes it worse.",portrait:"wry"}],choices:[{text:"Burn the photos",reaction:"You burn them over the stove. The smoke smells like evidence and bad decisions. But you know Ramirez has copies. A man that patient always has copies.",effects:{flags:["ramirez_photos"]}},{text:"He\u2019s bluffing",reaction:"He wasn\u2019t bluffing. Somewhere in Vice Intelligence, Ramirez adds a note to your file: \u201CSubject displays poor judgment under pressure.\u201D He underlines it twice.",effects:{"npc.ramirez.evidence":2,flags:["ramirez_photos"]}}]},ramirez_offer:{speaker:"ramirez",portrait:"tired",priority:12,conditions:{evidenceGte:10,flagNot:"ramirez_deal_offered",dealsSinceGte:3},lines:[{text:"He calls from a payphone. You can hear traffic. He sounds tired.",portrait:"tired"},{text:"\u201CLet\u2019s skip the part where I pretend this is social. I have enough on you for fifteen to twenty. Federal. The Colombians, the laundering, the whole circus. But here\u2019s the thing \u2014 I don\u2019t want you. You\u2019re not the prize. You\u2019re the door.\u201D",portrait:"neutral"},{text:"\u201CGive me the cartel. Real intel \u2014 shipment dates, routes, contacts. In exchange your file goes in a drawer that never opens. You walk away clean. Maybe not morally clean, but legally clean, and in Miami that\u2019s the best anyone gets.\u201D",portrait:"wry"}],choices:[{text:"Become an informant",reaction:"\u201CSmart. Or desperate. Either way, we have a deal.\u201D A pause. Coffee being sipped. \u201CFor what it\u2019s worth? You made the right call. The other option involved a prison in Coleman, Florida. Two hours from Miami. You can almost smell the ocean on humid days.\u201D",effects:{"npc.ramirez.evidence":-6,"npc.colombiano.trust":-3,cred:-10,flags:["ramirez_deal_offered","became_informant"]}},{text:"Go to hell, Ramirez",reaction:"\u201CI figured. They always say that. And six months from now, when the walls are really closing in, you\u2019ll wish you\u2019d taken the deal. My number won\u2019t change.\u201D He hangs up. His car takes three tries to start. Even his car is exhausted.",effects:{"npc.ramirez.evidence":3,flags:["ramirez_deal_offered","refused_ramirez"]}}]},colombiano_intro:{speaker:"colombiano",portrait:"neutral",priority:15,conditions:{"npc.colombiano.met":{eq:!1},orGroup:{totalProfitGte:5e4,credGte:40,turfGte:3}},lines:[{text:"The restaurant clears out. Nobody announces it; it just empties, the way a beach empties before weather. A man in a cream linen suit sits down across from you without asking.",portrait:"neutral"},{text:"\u201CYou\u2019ve been busy. Moving weight, taking corners. Miami notices. I notice.\u201D He orders for both of you, in Spanish, without looking at the menu.",portrait:"pleased"},{text:"\u201CI represent certain interests in Medell\xEDn. We can supply you at volume \u2014 real volume \u2014 or we can consider you competition. I prefer the first option. The second is bad for everyone, but mostly for you.\u201D",portrait:"cold"}],choices:[{text:"Let\u2019s do business",reaction:"He smiles like the deal was never in question. \u201CBueno. Cocaine will cost you less from now on. In exchange, you remember who your friends are.\u201D The food arrives. It\u2019s excellent. Everything about him is excellent. That\u2019s the problem.",effects:{"npc.colombiano.met":!0,"npc.colombiano.trust":3,flags:["cartel_supplier"]}},{text:"I work alone",reaction:"He nods slowly, dabs his mouth, stands. \u201CPride. I respect it.\u201D He buttons his jacket. \u201CI respected it in the last three men who said that too.\u201D He leaves. He pays for your meal anyway. Somehow that\u2019s the threat.",effects:{"npc.colombiano.met":!0,"npc.colombiano.trust":-2,flags:["rejected_cartel"]}}]},colombiano_test:{speaker:"colombiano",portrait:"cold",priority:10,conditions:{flag:"cartel_supplier","npc.colombiano.trust":{gte:2},totalProfitGte:8e4,flagNot:"colombiano_tested",dealsSinceGte:4},lines:[{text:"A car waits outside your place. Tinted glass. Inside: El Colombiano and a briefcase. \u201CA favor,\u201D he says, in a voice that has never once asked a favor.",portrait:"neutral"},{text:"\u201COne of my distributors is skimming. Tomas. You know him \u2014 small man, big watch. I need someone he doesn\u2019t fear to confirm it. Buy from him. Count the weight. Tell me what you find.\u201D",portrait:"cold"}],choices:[{text:"Do it \u2014 report the truth",reaction:"Tomas is skimming. Of course he\u2019s skimming \u2014 the watch alone is two months of skimming. You report it. A week later Tomas\u2019s big watch shows up at a pawn shop, and Tomas doesn\u2019t. El Colombiano sends a case of wine. You don\u2019t drink it.",effects:{"npc.colombiano.trust":2,cred:5,flags:["colombiano_tested"],montage:"Confirmed the skim. Tomas vanished."}},{text:"Warn Tomas instead",reaction:"You tell Tomas to run. He runs. El Colombiano never mentions it \u2014 which is how you know he knows. The wine never arrives. Something colder does: nothing at all.",effects:{"npc.colombiano.trust":-3,flags:["colombiano_tested","warned_tomas"],montage:"Warned Tomas. The cartel noticed."}}]},rep_reveal:{speaker:"maria",portrait:"knowing",priority:11,conditions:{credGte:25,totalDealsGte:10,flagNot:"rep_revealed"},lines:[{text:"Maria slides a newspaper across the bar. There\u2019s no article about you. That\u2019s the point. \u201CPeople are talking,\u201D she says. \u201CThe right people. The corners know your name. The clubs know your face.\u201D",portrait:"knowing"},{text:"\u201CReputation is currency now. Districts where you do business will treat you better. Places you neglect will forget you. Spend it carefully \u2014 it\u2019s harder to earn back than money.\u201D",portrait:"amused"}],choices:[{text:"Good to know",reaction:"\u201CIt wasn\u2019t free, by the way. This conversation. You owe me a drink. Top shelf \u2014 I know what you make now.\u201D",effects:{flags:["rep_revealed"],cred:3}}]}},ih=(e,t)=>{let n=t.npcState?.ramirez?.evidence||0;for(let[o,r]of Object.entries(e))if(o==="totalProfitGte"){if((t.totalProfit||0)<r)return!1}else if(o==="totalDealsGte"){if((t.totalDeals||0)<r)return!1}else if(o==="credGte"){if(t.cred<r)return!1}else if(o==="cashGte"){if(t.cash<r)return!1}else if(o==="fedHeatGte"){if(t.fedHeat<r)return!1}else if(o==="evidenceGte"){if(n<r)return!1}else if(o==="turfGte"){if(t.turf.filter(a=>a>0).length<r)return!1}else if(o==="moveLte"){if(t.move>r)return!1}else if(o==="debtGte"){if(t.debt<r)return!1}else if(o==="debtLte"){if(t.debt>r)return!1}else if(o==="liquidGte"){if(t.cash+t.bank+(t.cleanCash||0)<r)return!1}else if(o==="dealsSinceGte"){if((t.dealsSinceStory||0)<r)return!1}else if(o==="soldCrack"){if(!t.storyFlags?.sold_crack)return!1}else if(o==="flag"){if(!t.storyFlags?.[r])return!1}else if(o==="flagNot"){if(t.storyFlags?.[r])retu
