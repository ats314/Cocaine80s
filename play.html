u201D",effects:{"npc.ramirez.evidence":-1,flags:["r_elena_portrait","r_elena_unphotographed"],montage:"Stepped out of Elena Ramirez\u2019s frame. She said her father does that too."}},{text:"Ask her about her father",reaction:"\u201CHe came home in July and sat in the car for an hour. A whole hour \u2014 I watched him from the window.\u201D She squares two cards that are already square. \u201CThen he came in and asked if I still wanted that lens. He bought it that weekend. He can\u2019t afford it. He did it anyway.\u201D Across the room, Maria stops pretending to do inventory.",effects:{"npc.maria.trust":-1,flags:["r_elena_portrait","r_elena_july"],montage:"Elena said her father sat in the car for an hour in July, then bought her a lens."}}]},r_the_flowers:{speaker:"colombiano",portrait:"neutral",priority:12,conditions:{flagAll:["betrayed_ramirez","r_show_open"],flagNone:["r_flowers_done"],"npc.colombiano.trust":{gte:2},fedHeatGte:35,dealsSinceGte:2},lines:[{text:"He is in the back of the car with the Herald folded open to the arts page, a section you did not know it had. \u201CYour detective\u2019s daughter. The photographs. I sent flowers. Orchids \u2014 they last. Everything else in this city is dead by Sunday.\u201D",portrait:"neutral"},{text:"\u201CIt is a courtesy. When a man\u2019s child does a thing, you send flowers; my mother would come out of the ground.\u201D He refolds the paper along its original creases. \u201CSomeone signed for them. A young woman, the delivery man says. She wrote her name on the line very neatly. He mentioned that. The neatness.\u201D",portrait:"cold"},{text:"He has not threatened anybody. He has told you about flowers, and about a section of the newspaper, and about his mother. That is the entire content of the conversation, and you are sweating through a shirt that cost ninety dollars.",portrait:"pleased"}],choices:[{text:"Take the gallery onto your own books \u2014 $12,000",reaction:"You absorb the lease, the insurance, and a favor in a currency he has not named yet, so that the address stops being interesting to anyone. He agrees pleasantly and does not raise the price, which is how you know that he will. You have shown a careful man exactly where you are soft, and he thanked you for it in the voice people use for weather.",effects:{cashDelta:-12e3,cred:-5,"npc.colombiano.trust":-1,"npc.ramirez.trust":1,flags:["r_flowers_done","protected_ramirez"],montage:"Paid $12,000 to make a gallery boring. He did not raise the price. Yet."}},{text:"Say nothing. Ask about the route.",reaction:"You change the subject and he allows it, which is the transaction completing. Nothing happens to anybody. A car idles outside the gallery for three nights and Elena photographs it twice, because she likes what the streetlight does to the hood. Everyone who loves her finds out separately. Everyone who loves her looks at you.",effects:{flags:["r_flowers_done","elena_endangered"],montage:"Let the orchids stand. A car idled outside the gallery for three nights."}}]},r_act3_witness:{speaker:"ramirez",portrait:"neutral",priority:13,conditions:{flag:"r_confessed",flagNone:["r_witness_asked","ending_witness","ending_inheritor","ending_ghost"],evidenceGte:10,totalProfitGte:4e4,dealsSinceGte:2},lines:[{text:"Room 411, federal building, a table with a scratch in it shaped almost exactly like Florida. AUSA Vance lays two documents side by side and does not sit down. Ramirez sits. Ramirez brought his own thermos, because he does not trust the machine on four.",portrait:"neutral"},{text:"\u201CEverything,\u201D Vance says. \u201CThe route, the wash, the names, and the eleven days in July. In exchange you testify \u2014 and you do not live in this state again. Not Tampa. Not Orlando. Not a beach house under your mother\u2019s maiden name. I have seen all three.\u201D",portrait:"tired"},{text:"Ramirez says nothing at all through this, which you have learned is what he does when he wants a thing so badly he does not trust his own voice to carry it. Then: \u201CYour brother\u2019s file says ACCIDENT. I can make it say something else. It is the only thing I have ever had to offer anybody, and I have offered it twice.\u201D",portrait:"tired"}],choices:[{text:"Sign it. All of it \u2014 including how he ran C\xE9sar.",reaction:"Six hours, a court reporter, and one sentence you have to say twice because the first time it does not come out loud enough: he ran my brother off the books. Vance underlines it. Ramirez looks at the scratch shaped like Florida for the rest of the afternoon. The case is twice as strong, and he will not have a badge when it is tried.",effects:{cred:-14,"npc.ramirez.evidence":-9,"npc.ramirez.trust":-3,"npc.colombiano.trust":-4,flags:["ending_witness","r_witness_asked","betrayed_ramirez"],montage:"Signed. Told them Ramirez ran C\xE9sar off the books. Vance underlined it."}},{text:"Sign it. C\xE9sar was never anybody's informant.",reaction:"You leave one man out of six hours of truth, which is the most expensive editing of your life. Vance asks the question three different ways; you give the same answer three times. In the elevator Ramirez says, \u201CYou shouldn\u2019t have done that,\u201D and then holds the door for you, and then says nothing at all for eleven floors.",effects:{cred:-10,"npc.ramirez.evidence":-6,"npc.ramirez.trust":3,"npc.colombiano.trust":-4,flags:["ending_witness","r_witness_asked","protected_ramirez"],montage:"Signed, and left Ramirez out of it. He held the elevator and said nothing."}},{text:"Not today, counselor",reaction:"Vance caps her pen with the finality of a woman who has just been handed a gift. \u201CGood. Honestly. Half my convictions are men who signed that thing badly.\u201D In the elevator Ramirez says, to nobody in particular, \u201CThat\u2019s the one I\u2019d have picked too,\u201D and then does not speak to you for a month.",effects:{cred:6,"npc.ramirez.evidence":3,flags:["r_witness_asked","r_refused_witness"],montage:"Refused the proffer in room 411. Vance capped her pen and looked relieved."}}]},r_head_start:{speaker:"ramirez",portrait:"tired",priority:11,conditions:{flag:"protected_ramirez",flagNone:["r_head_start","ending_witness"],"npc.ramirez.trust":{gte:3},evidenceGte:9,dealsSinceGte:2},lines:[{text:"A shopping-center parking lot in Kendall, which is where men do the things they cannot do downtown. Ramirez has a cardboard box in the trunk and a lighter he borrowed off somebody, because he quit smoking in 1979 and has mentioned it every year since.",portrait:"neutral"},{text:"\u201CTwo hundred and six pages in this box exist only because I wrote them down. Not evidence \u2014 INTELLIGENCE. The difference is a lawyer. The difference is also me.\u201D He lights the first page off the second. \u201CShe printed a photograph of me last month. I look old in it. I AM old in it.\u201D",portrait:"tired"},{text:"\u201CThis doesn\u2019t make us friends and it doesn\u2019t make you clean. It makes us two men who agreed about one thing, one time.\u201D The box burns in a shopping cart behind a closed Zayre. A security guard watches it for a while and decides it is not his problem.",portrait:"wry"}],choices:[{text:"Thank you, detective",reaction:"\u201CDon\u2019t.\u201D He watches the last page curl. \u201CThank me by being GONE. Genuinely gone \u2014 not Fort Lauderdale gone. If I see you in this city in six months I will rebuild every page, and I will be faster the second time.\u201D",effects:{"npc.ramirez.evidence":-8,"npc.ramirez.trust":1,flags:["r_head_start","ramirez_debt"],montage:"Ramirez burned 206 pages in a shopping cart behind a dead Zayre."}},{text:"Rebuild it. I'll still be here.",reaction:"He laughs \u2014 an actual laugh, rusty from lack of use. \u201CThat is the most honest thing anybody has said to me all year.\u201D He burns the pages anyway. \u201CConsider it a head start. I have never given one before and I do not expect to enjoy the experience.\u201D",effects:{cred:5,"npc.ramirez.evidence":-6,flags:["r_head_start","ramirez_debt"],montage:"Told Ramirez you would stay. He gave you the head start anyway."}}]},r_last_call:{speaker:"ramirez",portrait:"tired",priority:12,conditions:{flag:"knows_ramirez_ran",flagAny:["ending_inheritor","ending_ghost"],flagNone:["r_last_call"]},lines:[{text:"The sedan is outside your building at five in the morning with the engine off, which is new. He does not get out. He rolls the window down four inches, which is as far as it goes, because the crank came off in 1984 and lives in the glovebox.",portrait:"neutral"},{text:"\u201CI\u2019m not going to ask again. Eleven people in fifteen years, and I have learned to hear the answer about two days before anybody says it.\u201D The thermos is on the dash. He does not open it. \u201CI want you to know I\u2019m not angry. I\u2019d like to be. It would be easier to drive home angry.\u201D",portrait:"tired"},{text:"\u201CHis file stays ACCIDENT. In eighteen months a clerk boxes it. In five years the box goes to a warehouse in Doral with forty thousand other boxes, and that\u2019s it, that\u2019s the whole thing, that is what a life gets when nobody says anything.\u201D",portrait:"wry"}],choices:[{text:"Buy back the July paperwork \u2014 $15,000",reaction:"Four informant-fund vouchers with his signature and a blank payee line, and by Thursday they are not in the building any more. It costs fifteen thousand and a favor to a man who now knows something about you. Ramirez never learns why Internal Review stopped calling. He assumes he got lucky. He has never once gotten lucky.",effects:{cashDelta:-15e3,heatDelta:6,"npc.ramirez.trust":2,flags:["r_last_call","protected_ramirez"],montage:"Spent $15,000 pulling four vouchers with a detective\u2019s signature on them."}},{text:"Give him Maria instead",reaction:"You hand a tired man a case he can actually close, and it is not yours and it is not the Colombian\u2019s. He takes it, because he is police at five in the morning and because you knew he would. The gallery\u2019s books go to a forensic accountant in September. Maria calls you once. You let it ring.",effects:{cred:-4,"npc.ramirez.trust":2,"npc.ramirez.evidence":-5,"npc.maria.trust":-6,flags:["r_last_call","betrayed_maria"],montage:"Gave Ramirez the gallery\u2019s books instead of the route. She called once."}},{text:"Let him drive home",reaction:"You say nothing worth writing down and he nods as though it were an answer, because it is. The window goes up in four-inch increments. \u201CTake care of yourself,\u201D he says \u2014 which is what he says to victims \u2014 and drives off toward a house in Westchester where somebody has left a light on for him.",effects:{"npc.ramirez.trust":1,flags:["r_last_call","r_let_him_go"],montage:"Let Ramirez drive home with nothing. He said take care of yourself."}}]}},yd=[null,{n:1,name:"INHERIT",color:l.blue,goal:"Find out what happened to C\xE9sar.",sub:"Take his route. Learn the city. Meet the three people who knew him."},{n:2,name:"BECOME",color:l.gold,goal:"It was not an accident. Somebody decided.",sub:"Find out who C\xE9sar was talking to \u2014 and who found out he was talking."},{n:3,name:"CHOOSE",color:l.pink,goal:"C\xE9sar was informing. You know who ran him.",sub:"All three of them want you to be their version of him. Pick one, then leave."}],Ko=e=>{let t=e&&e.storyFlags||{};return t.act2_done?3:t.act1_done?2:1},k0={betrayed_maria:"maria",betrayed_ramirez:"ramirez",betrayed_col:"colombiano"},b0={protected_maria:"maria",protected_ramirez:"ramirez"},Vi=e=>{let t=e&&e.storyFlags||{};return Object.keys(k0).filter(n=>t[n]).map(n=>k0[n])},Bn=e=>{let t=e&&e.storyFlags||{};return Object.keys(b0).filter(n=>t[n]).map(n=>b0[n])},Qi=[{id:"witness",flag:"ending_witness",icon:"\u2696\uFE0F",name:"THE WITNESS",color:l.blue,who:"ramirez",blurb:"Give Ramirez the network. C\xE9sar stops being a drowning and becomes a source, and you stop being a person and become a number in a filing."},{id:"inheritor",flag:" ITNESS",color:l.blue,lines:["The gallery closes at seven. At half past nine there are still three cars on Ponce and three people standing apart in a white room with a horse in it, and nobody has turned the track lighting off, because turning it off would mean the evening was over.","You give Ramirez the routes, the schedules, the two warehouses in Doral and the name of the customs broker, and he writes it all down in a notebook he has been carrying since April. He does not say thank you. He says \u201COkay\u201D eleven times, and then he stops writing and looks at the floor and keeps looking at it.","It takes eighteen months. C\xE9sar Vargas is reclassified in a paragraph on page 6B \u2014 HOMICIDE, UNSOLVED \u2014 which is the closest thing to a resurrection the Herald offers. You testify four times. You do not come back to Florida. Not for the verdict. Not for anything."]},inheritor:{who:"colombiano",mood:"pleased",title:"THE INHERITOR",color:l.orange,lines:["The gallery closes at seven. By ten the wine is gone and so is the detective, who left the way men leave when they have finally understood something, and the man in the cream suit is still in the good chair by the window, because it is the only kind of chair he has ever sat in.","\u201CBarranquilla,\u201D he says, as though it were a season. He sets his glass down on somebody else\u2019s desk without a coaster, which is the most disrespectful thing you have ever watched a man do gently. \u201CIt is yours. Say something to me now, so that I can hear how you sound.\u201D","You tell him the route will keep its schedule and that nothing needs to change this year. And you hear the sentence leave your mouth \u2014 the pace of it, the small pause before the last word, the courtesy that is not courtesy \u2014 and you understand that you have been practising this without knowing, and that you are now a man who could order what was ordered on your brother, and that it would not even take anger."]},ghost:{who:"maria",mood:"knowing",title:"THE GHOST",color:l.flamingo,lines:["The gallery closes at seven. By eleven you have shaken two hands you will never shake again and told two lies that cost nothing, and the money is in a boat bag in the trunk of a car already pointed at the causeway.","Ramirez walks you to the door, because he is that kind of man. \u201CIf you ever want to tell me anything,\u201D he says, and then cannot find the end of the sentence, so he pats the doorframe twice like a horse and goes to his car. He will work C\xE9sar Vargas until 1994. It will never move an inch.","Nobody is punished. Not the man in the cream suit, who goes home when he decides to. Not the detective, who keeps his pension and his cardboard box. Not you. C\xE9sar\u2019s file stays closed, and it stays closed because you closed it, and that was the whole transaction, and there was no other bidder."]}},vy={witness:{p:"Maria keeps the gallery. Her name is nowhere in the filings, which cost you a year off the deal you could have had. She sends a card the first Christmas and nothing after that, and when you call the number it rings in a room where somebody is deciding not to pick it up.",b:"Maria gets four years at Marianna and the gallery is auctioned to a dentist who paints. The last thing she ever says to you is at the sentencing, in Spanish, quietly, and the interpreter \u2014 correctly \u2014 declines to translate it.",n:"Maria is named twice in the indictment and neither time as a defendant, which is luck and not mercy, and she knows the difference. She keeps the gallery and she keeps the distance. Somebody has to stay in a city. It was never going to be you."},inheritor:{p:"Maria is gone by February. She sells the gallery to a couple from Atlanta and leaves no number, and you let her, and that is the last expensive thing you ever do for anybody. The horse painting is still on the wall. Nobody has ever bought it.",b:"Maria stays. She comes in Tuesdays with the books and calls you se\xF1or in front of other people, and she is very good at it, and neither of you has ever once mentioned the thing you did. That is the arrangement. It holds for years.",n:"Maria neither leaves nor stays; she simply becomes somebody you do business with. There is a Thursday in the spring when you realise you cannot remember the last time she used your first name. It does not bother you. Later, that bothers you."},ghost:{p:"Maria is on the boat at four in the morning with one suitcase and the ledger she should have burned, complaining about the seats. Somewhere past Bimini she says, \u201CHe would have hated this,\u201D and you both laugh, and then neither of you says his name again for eleven years.",b:"Maria finds out from the Herald, three weeks later, in a paragraph about a gallery she no longer owns. She reads it twice. Then she goes to work, because the alternative is not going to work, and she has never once had that option.",n:"Maria hears about it the way everybody in Coral Gables hears about everything \u2014 from somebody at a party, incorrectly, and then later, correctly, from nobody at all. She keeps the gallery. She stops asking after people who leave."}},wy=(()=>{let e={};for(let t of Object.keys(R0)){let n=R0[t];for(let o of["p","b","n"])e["c_end_"+t+"_"+o]={...n,lines:[...n.lines,vy[t][o]]}}return e})(),H0={...wy,witness:{who:"ramirez",mood:"tired",title:"THE WITNESS",color:l.blue,lines:e=>["Ramirez does not sit down. He stands in front of a canvas that costs more than his car and says, to the canvas, that the U.S. Attorney is going to want it in writing.","You give it to him on the fourth floor of the federal building over four days, in whatever order he asks for. On the second day he stops taking notes and just listens, which is worse. On the fourth he says thank you, and that is the last complete sentence he ever says to you.","The network comes apart over eighteen months the way a sweater does \u2014 one thread, patiently, pulled by a man who has nothing else. C\xE9sar Vargas is entered into the record as a cooperating source, which is the nearest thing to a headstone the federal government issues.",Bn(e).includes("maria")?"Maria keeps the gallery. She also stops answering, and never explains it, and never needs to. Years later somebody mentions, secondhand, that one of Elena's photographs hangs where the horse used to be.":"Maria takes four years, and the gallery is a shoe store by spring. You watch the sentencing from a room in Wichita, under a name you still have to practise before you say it out loud."]},inheritor:{who:"colombiano",mood:"pleased",title:"THE INHERITOR",color:l.gold,lines:e=>["He takes the chair by the window without being offered it, which is how kings sit, and tells you the flight to Barranquilla is Thursday, and that it has always been Thursday.","\u201CYou want me to say that I gave the order,\u201D he says, unhurried, the way a man mentions weather. \u201CI gave the order. It was not anger. Your brother became a maintenance problem and I performed maintenance. You will do it too one day, and you will be surprised how little it weighs.\u201D","Nothing is announced. On Monday the corners are supplied exactly as they were on Friday. In November a man out past the Palmetto asks you for two more weeks, and you hear yourself answer \u2014 courteous, unhurried, in a voice that is not entirely yours \u2014 that two weeks is a long time in this business.",Bn(e).includes("maria")?"Maria leaves Miami in the spring without a forwarding address and without a scene, which is the most Maria thing she ever does.":"Maria stays. She does the books now, and she is extremely good at it, and neither of you has ever once said out loud what that means."]},ghost:{who:"maria",mood:"knowing",title:"THE GHOST",color:l.green,lines:e=>["Nobody makes a speech. Ramirez has a case that is going nowhere and knows it. El Colombiano sent flowers, which is his way of attending. You stand in a white room with a horse in it and understand that you are the only person here who knows what everybody else is doing.","The Eastern flight boards at 6:40 in the morning. Nobody is running. Nobody is following. You keep waiting for the part where somebody stops you, and the part never comes, and that is the part that stays.","C\xE9sar's file stays closed. It is four pages long. Two of them are the same page, photocopied twice by somebody in a hurry in August, and it will sit in a basement on NW 2nd Avenue until the building is sold.",Bn(e).includes("maria")?"Maria is in the seat beside you doing inventory on a clipboard at thirty thousand feet, because she is incapable of waiting like a normal person. Neither of you looks down.":"Maria finds out from the Herald four days later, in a paragraph so small she almost misses it. She keeps the paragraph. She could not tell you why."]},photograph:{who:"ramirez",mood:"tired",title:"THE HEAD START",color:l.blue,lines:["He does not come to see you off, because that would be a thing a friend does and this is not that. He sends a message through a barber on Calle Ocho: nine words, no signature. NORTHBOUND LANES ARE CLEAR UNTIL SIX. GO NOW.","You take US 1 out of Dade County at 4:40 in the morning with the windows down, past the Krome Avenue turnoff, past the last streetlight, past the point where the radio stations start belonging to somebody else.","In a parking lot behind a closed department store, ash from two hundred and six pages is still in a shopping cart, and a man who makes thirty-eight thousand dollars a year is at home, awake, deciding for the rest of his life whether he did the right thing."]},shrimp_boat:{who:"tiburon",mood:"neutral",title:"ELEVEN HUNDRED ISLANDS",color:l.green,lines:["The boat smells like diesel and forty years of ice, and the captain is somebody\u2019s cousin, and Tibur\xF3n stands on the dock in a shirt with parrots on it, waving with a fillet knife like a man seeing off a cruise.","\u201CRemember the geography, amigo!\u201D he shouts across the water. \u201CThere is no smuggler! There is only a fishing guide, and there is THURSDAY!\u201D The gold tooth catches the last of the dock light and then the dock light is gone.","Somewhere south of Marathon the water turns a color that does not exist in Miami. Nobody files a report, because nobody has anything to report: a boat went out, a boat came back, and the manifest said ice."]},second_seat:{who:"maria",mood:"knowing",title:"THE SECOND CHARTER",color:l.flamingo,lines:["The plane is worse this time \u2014 a Cessna with one working landing light and a pilot who apologizes for the seat belt. Maria is already on board, doing inventory on a clipboard at five in the morning, because she is incapable of waiting like a normal person.","\u201CYou bought this seat twice,\u201D she says, without looking up. \u201CThat is either the most expensive lesson in Dade County or the only one that ever took. I have decided not to tell you which.\u201D","At altitude she finally puts the clipboard down and looks out the window at the pink and blue and gold of a city that is no longer a factor in either of your lives. \u201CGod,\u201D she says. \u201CIt really is beautiful from the outside.\u201D"]},medellin:{who:"colombiano",mood:"pleased",title:"THE INVITATION",color:l.orange,lines:["There is no forger, no charter, no numbered account. There is a first-class ticket in your own name and a customs officer in Rionegro who takes your passport, looks at nothing, and says \u201CWelcome home, se\xF1or,\u201D in a country you have never been to.","\u201CYou misunderstand what has happened,\u201D El Colombiano says on the drive up into the valley, where the air gets thin and green. \u201CYou did not escape Miami. Miami was a POSITION, and we have moved you off it. There is a difference, and one day it will matter to you.\u201D","The farm has a telephone that rings only when he decides it should. Some nights the fog comes up the mountain and covers everything, and you stand on the terrace with a drink you did not pour, a wealthy man in exile, listening to a phone that is not ringing yet."]},maria:{who:"maria",mood:"flirty",title:"THE LAST FLIGHT OUT",color:l.flamingo,lines:["The airstrip near Homestead is a scar of cracked tarmac between two tomato fields. The plane is older than you and twice as tired. Maria is leaning against it like it owes her money.","\u201CYou actually came,\u201D she says, and for one second the armor slips \u2014 then it\u2019s back, polished. \u201CMost of them don\u2019t, you know. Most of them love the table too much to leave it.\u201D","Miami shrinks beneath the wing until it\u2019s just light \u2014 pink and blue and gold, all that neon money burning for somebody else now. Maria doesn\u2019t look down. You do. Once."]},route50:{icon:"\u{1F6EB}",title:"THE FORGER'S PACKAGE",color:l.blue,lines:["The forger works out of a bait shop in Islamorada that has never sold bait. Your new passport smells like fresh ink and a clean conscience \u2014 one of those is real.","\u201CYou were never here,\u201D he says, stamping a history you didn\u2019t live. \u201CThat\u2019ll be the hardest part. Not the leaving. The never-having-been.\u201D","The charter lifts off a private strip at dawn with no flight plan and no names on the manifest. Behind you, the city keeps glowing. It doesn\u2019t notice. It never does."]},cass:{who:"cass",mood:"pleased",title:"THE WIRE TRANSFER",color:l.gold,lines:["Cass meets you in the bank's basement vault, which smells like cold steel and other people's secrets. She slides a single page across the table: numbers, a signature line, a future.","\u201CZurich, via Panama, via a funeral home in Hialeah,\u201D she says, almost fondly. \u201CAs of this signature, you are no longer a person. You are a WIRE TRANSFER. Congratulations \u2014 it's the safest thing to be.\u201D","By the time the federal subpoena reaches Biscayne Fidelity, the accounts are folklore. Somewhere over the Atlantic, a number with your fingerprints on it becomes a rumor with a tan."]},kingpin:{icon:"\u{1F451}",title:"THE CITY KNEELS",color:l.gold,lines:["The rooftop in Brickell is yours. The building under it is yours. The skyline past it \u2014 pink, blue, gold, burning \u2014 answers, block by block, corner by corner, to your name.","Somewhere below, a detective drops a four-hundred-page file on a desk and is told, gently, that the case lacks PRIORITY. Somewhere south, a man in a cream suit raises a glass he does not finish.","They will write books about how this ends. Tonight is not about how it ends. Tonight, Miami is a machine of light and appetite \u2014 and every gear of it turns for you."]}},ky=({route:e,g:t,onDone:n,sound:o})=>{let i=H0[e]||H0.ghost||{title:"THE END",color:l.blue,lines:["The city keeps glowing behind you. It does not notice. It never does."]},r=typeof i.lines=="function"?i.lines(t||{}):i.lines,[s,d]=(0,R.useState)(0),[c,u]=(0,R.useState)(!1),[m,y]=(0,R.useState)(!1),k=s>=r.length-1;return(0,a.jsxs)("div",{onClick:()=>{if(!c){y(!0),u(!0);return}k||(d(s+1),u(!1),y(!1))},style:{position:"fixed",inset:0,zIndex:85,background:l.midnight,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:22,animation:"fadeIn .5s ease",cursor:"pointer"},children:[(0,a.jsx)("div",{style:{position:"absolute",inset:0,background:"repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px)"}}),(0,a.jsx)("div",{style:{fontFamily:N,fontSize:9,letterSpacing:4,color:l.dim,marginBottom:14},children:"\u2014 FINALE \u2014"}),i.who?(0,a.jsx)(Pr,{who:i.who,mood:i.mood,w:138}):(0,a.jsx)("div",{style:{fontSize:64,filter:`drop-shadow(0 0 24px ${i.color}88)`,animation:"sunPulse 3s infinite"},children:i.icon}),(0,a.jsx)("div",{style:{marginTop:14,marginBottom:12},children:(0,a.jsx)(Ct,{color:i.color,size:22,children:i.title})}),(0,a.jsx)("div",{style:{maxWidth:330,minHeight:120,fontFamily:J,fontSize:14.5,fontStyle:"italic",lineHeight:1.65,color:l.text,text
