 Santos",role:"THE INSIDER",color:l.flamingo,glow:"255,105,180"},ramirez:{name:"Det. Ramirez",role:"VICE INTELLIGENCE",color:l.blue,glow:"0,229,255"},colombiano:{name:"El Colombiano",role:"THE RIVAL",color:l.orange,glow:"255,107,53"},tiburon:{name:"Tibur\xF3n",role:"THE LOAN SHARK",color:l.green,glow:"0,201,167"},cass:{name:"Cass Delgado",role:"THE LAUNDERER",color:l.gold,glow:"255,215,0"},narrator:{name:"MIAMI",role:"AUGUST 1986",color:l.purple,glow:"123,47,190"},nestor:{name:"N\xE9stor Vargas",role:"THE BROTHER",color:l.gold,glow:"255,215,0"}},em={m_brick_call:{speaker:"maria",portrait:"amused",priority:60,conditions:{flag:"c_opened",flagNot:"m_met"},lines:[{text:"The payphone outside the Greyhound station rings while you are still deciding whether to call the number on the back of the funeral card. The man leaning on it says, \u201CIt\u2019s for you,\u201D and walks off, which is how you learn this city already knows your name.",portrait:"neutral"},{text:"\u201CC\xE9sar\u2019s brother. Ninety dollars, a duffel bag, and a haircut from a town with one barber.\u201D A woman\u2019s voice. Amused, expensive, in no hurry at all. \u201CRelax. If I were police you would be in a van already, and the van would have air conditioning, which is more than that phone booth can say.\u201D",portrait:"amused"},{text:"\u201CThey gave you his things at the funeral home in a paper sack. Look in the sack, under the Dolphins shirt. That is a kilo, and your brother owed me money \u2014 I say that part first, because you will hear it from somebody eventually and I prefer to be the one who chooses the sentence. Which makes it partly mine. Little Havana, tonight. I take forty. Or argue. Arguing is also fine. It is how I learn what people are.\u201D",portrait:"knowing"}],choices:[{text:"Forty is fine. You knew him.",reaction:"The buyer arrives in a white Countach and never gets out of it. An envelope comes through the window: $4,800, banded, still warm from somebody\u2019s dashboard. \u201CIt took C\xE9sar three days to agree to that number,\u201D Maria says down the line. \u201CYou did it in nine seconds. Now you have money, which is the least interesting thing you will ever have. I\u2019ll be in touch.\u201D",effects:{cashDelta:4800,"npc.maria.trust":2,"npc.maria.met":!0,flags:["m_met","m_took_terms"],montage:"Flipped Cesar's last kilo through Maria. $4,800."}},{text:"Fifty-fifty. I never met you.",reaction:"Silence long enough to hear the traffic on her end. Then: \u201CFifty-fifty. Okay, cowboy.\u201D $6,000 through the window of a car that never stops running. \u201CYou have just taught me that our friendship has a rate. I am writing the number down. Not as a threat \u2014 I simply find that I never forget the ones I have to negotiate with, and I would rather you knew that going in.\u201D",effects:{cashDelta:6e3,"npc.maria.trust":1,"npc.maria.met":!0,flags:["m_met","m_priced_her"],montage:"Squeezed Maria for 50/50 on the first kilo. $6,000. She wrote it down."}}]},m_gallery:{speaker:"maria",portrait:"amused",priority:11,conditions:{flag:"m_met",flagNot:"m_gallery_done",totalProfitGte:3e3,cashGte:4e3,dealsSinceGte:2},lines:[{text:"The gallery is between shows, which means it is a white room with a horse in it. The horse is four feet of oil paint, aggressively sad, and priced at twenty-eight thousand dollars.",portrait:"neutral"},{text:"\u201CDon\u2019t make that face. Art is subjective. Laundry is objective.\u201D She writes something on a clipboard, which is the thing she does instead of having feelings. \u201CI have sold that horse four times this year. He outperforms the Basquiat and he has never once asked me about the market.\u201D",portrait:"amused"},{text:"\u201CYour money is loud right now. Cash is loud \u2014 it has a smell, and men who carry it start walking differently, and eventually somebody at a bank remembers a face. Bring it here and it becomes a receipt. A receipt is the quietest object in America.\u201D She caps the pen. \u201CC\xE9sar used the horse. Two years, the most boring man in my books. Then in March he stopped, and I did not ask him why, and here we both are.\u201D",portrait:"knowing"}],choices:[{text:"Sell me the horse \u2014 $4,000",reaction:"The horse gets a red SOLD sticker. She types an invoice on an IBM Selectric that she says she keeps because computers remember things. \u201CCongratulations. You own a horse. You will never see the horse.\u201D Then she signs the bottom, under your name, and turns it so you can watch her do it. \u201CPeople think this business is about money. It is about paper. Both of us are on this one now.\u201D",effects:{cashDelta:-4e3,cleanDelta:3600,"npc.maria.trust":2,"npc.maria.exposure":1,flags:["m_gallery_done","m_launder_yes"],montage:"Bought a sad horse for $4,000. Never saw the horse."}},{text:"Keep it in cash. Your name doesn't need to be on my paper.",reaction:"\u201CHow gallant.\u201D She puts the clipboard down, which is rare enough to notice. \u201CAlso stupid, and I want to be clear that both things are true at once. The offer does not expire \u2014 the horse is not going anywhere. Nobody actually wants to own him. That is the entire point of him.\u201D",effects:{cred:2,"npc.maria.trust":1,flags:["m_gallery_done","m_launder_no"],montage:"Kept it in cash. Left Maria's name off the paper."}}]},m_cesar_ledger:{speaker:"maria",portrait:"knowing",priority:12,conditions:{flag:"m_gallery_done",flagNone:["m_ledger_done","act2_done"],totalProfitGte:6e3,cashGte:3e3,dealsSinceGte:3},lines:[{text:"A lunch counter on Flagler with tables older than either of you. Yours has a scratch in it shaped almost exactly like Florida. She does not order. She never orders \u2014 she eats a third of whatever you order and calls it something else.",portrait:"neutral"},{text:"The ledger comes out of her bag and it is not a ledger, it is a child\u2019s green notebook. \u201CSix thousand four hundred. That is what your brother owed me. You want to see the arithmetic. Everyone wants to see the arithmetic, and in eleven years nobody has ever once disputed it.\u201D",portrait:"knowing"},{text:"\u201CSix of it is money. The rest is a favor I did in March that I would very much like to stop having done.\u201D She turns the notebook so you can read C\xE9sar\u2019s handwriting crawling up the margin: a phone number, and under it, in his terrible capitals, DO NOT CALL FROM HOME.",portrait:"vulnerable"}],choices:[{text:"Put three thousand against it. I'll clear the rest.",reaction:"She writes the payment under his name, in the same column, in the same notebook, and you watch your family become a line item in real time. \u201CYou understand I did not ask you for this,\u201D she says. \u201CI want that on the record, because in about a month you are going to decide I have been managing you, and on this one item you will be wrong.\u201D",effects:{cashDelta:-3e3,"npc.maria.trust":3,flags:["m_ledger_done","m_paid_debt"],montage:"Paid $3,000 against Cesar's book. She wrote it under his name."}},{text:"Whose number is it?",reaction:"\u201CA man who sold him a car,\u201D she says, and closes the notebook with one finger \u2014 the first time you have ever seen her do anything quickly. \u201CC\xE9sar bought a lot of cars.\u201D Then she pays for the food you ordered, which she has never done in her life, and that is how you know.",effects:{"npc.maria.trust":-1,flags:["m_ledger_done","m_saw_the_number"],montage:"Asked Maria whose number was in Cesar's margin. She paid for lunch."}}]},m_not_surprised:{speaker:"maria",portrait:"knowing",priority:13,conditions:{flag:"act1_done",flagNot:"m_not_surprised_done","npc.maria.met":{eq:!0},dealsSinceGte:1},lines:[{text:"You get to the gallery at eleven at night with it still in your mouth. She is hanging a show \u2014 sleeves rolled, a level in one hand, a nail between her lips. She takes the nail out to talk to you. That is the only concession she makes.",portrait:"neutral"},{text:"\u201CNot an accident.\u201D She repeats it flat, the way you repeat an address back to somebody. Then she goes back to the level. The bubble takes a long time to settle and neither of you says anything while it does.",portrait:"knowing"},{text:"\u201CHe went into the water with his shoes on, cowboy. I have known that for eleven days.\u201D The frame is already straight. She marks the wall anyway. \u201CI did not tell you because there was a version of this where you got back on a bus on Tuesday and grew old somewhere with a lawn.\u201D",portrait:"vulnerable"}],choices:[{text:"What else have you decided not to tell me?",reaction:"\u201CThat is the right question and I hate it.\u201D She gives you one true thing, because she has decided one is the correct dose: in April your brother paid a criminal lawyer eleven hundred dollars for a case that did not exist. \u201CHe was buying something. I did not ask what.\u201D The room is colder for the rest of the night and she hangs the last four frames without help.",effects:{"npc.maria.trust":-1,flags:["m_not_surprised_done","m_pressed_her"],montage:"Pressed Maria. Cesar paid a lawyer in April for a case that did not exist."}},{text:"Then help me find out who.",reaction:"\u201COkay.\u201D She hangs the next frame. \u201CThen we do it my way, which is slowly, and you are going to hate it.\u201D Two days later a man who used to call you three times a week stops calling. It will be a month before you find out she is the reason, and by then you will have stopped counting the things she handled.",effects:{"npc.maria.trust":2,flags:["m_not_surprised_done","m_enlisted"],montage:"Maria agreed to help. Slowly. Her way."}}]},m_elena_show:{speaker:"maria",portrait:"amused",priority:12,conditions:{flag:"m_not_surprised_done",flagNot:"m_show_hung",moveGte:18,dealsSinceGte:2},lines:[{text:"\u201CI am giving the back room to a twenty-two-year-old,\u201D Maria announces, in the tone other women use for a diagnosis. \u201CThirty prints. Overtown at dusk, mostly, and a series of the Miami River at four in the morning that I would not have had the nerve to take at her age.\u201D",portrait:"amused"},{text:"She slides the mailer across the desk. E. RAMIREZ. \u201CShe is good, which is the inconvenient part \u2014 if she were bad I could simply be kind and be done. The frames are two thousand dollars. The wine is four hundred. The invitations went out Monday to every collector I have, and every collector I have is somebody you have shaken hands with at a pool party.\u201D",portrait:"knowing"},{text:"\u201CHer father will stand in that room. So will a man in a cream suit, because he sends orchids to openings, because he enjoys rooms where everyone is behaving.\u201D She squares the mailer to the edge of the desk. \u201CI wanted you to hear the guest list from me instead of from the door. That is the whole favor. There is no second part.\u201D",portrait:"neutral"}],choices:[{text:"The gallery shouldn't carry it. I'll cover the show \u2014 $5,000",reaction:"The receipt says ACQUISITIONS, which is a word that has never meant what it says in this building. The girl gets frames she could not afford and a wall she did not have to beg for, and she will believe for the rest of her life that a gallery in Coral Gables simply believed in her. \u201CShe will never know,\u201D Maria says. \u201CWe just agreed to that. It took us four seconds and neither of us said it out loud.\u201D",effects:{cashDelta:-5e3,"npc.maria.trust":2,"npc.maria.exposure":1,flags:["m_show_hung","m_funded_show"],montage:"Paid $5,000 for Elena Ramirez's frames. The receipt said ACQUISITIONS."}},{text:"Keep my money out of it. All of it.",reaction:"\u201CThen I pay for the frames out of a gallery that is not having a good year, and I do it happily, which should frighten you.\u201D She covers it by taking three canvases on consignment from a man she has spent two years politely not owing anything to \u2014 cream suit, orchids, no hurry. \u201CDo not look at me like that. I have made worse trades before lunch.\u201D",effects:{"npc.maria.trust":3,flags:["m_show_hung","m_kept_out","m_maria_owes_col"],montage:"Kept your money out of Elena's show. Maria took consignment from the cream suit instead."}}]},m_back_office:{speaker:"maria",portrait:"knowing",priority:12,conditions:{flag:"m_show_hung",flagNot:"m_back_office_done",dealsSinceGte:2},lines:[{text:"Opening night. Ninety people, four hundred dollars of wine gone in an hour, and a spray of white orchids by the door with a card that says only CONGRATULATIONS in a hand nobody claims. Elena is photographing her own opening, which Maria says is the most hopeful thing she has seen all year.",portrait:"neutral"},{text:"Maria takes your elbow and walks you into the back office like a woman showing a serious buyer a serious canvas. She closes the door with her hip. Through the wall you can hear a detective laughing at something his daughter said.",portrait:"knowing"},{text:"\u201CThe man in the cream suit asked me tonight how long you have been buying from him. Not whether. How long.\u201D She is straightening invoices that do not need straightening. \u201CI told him fourteen months. He did not check. Men like that never check the first number \u2014 they only ever check the second one.\u201D",portrait:"vulnerable"}],choices:[{text:"Don't do that again.",reaction:"\u201COkay.\u201D She says it much too easily and you both hear it happen. Then she opens the door onto ninety people and a girl with a camera, and hands you a glass of wine you did not ask for, and for the rest of the night she is the most charming person in Coral Gables.",effects:{"npc.maria.trust":-1,flags:["m_back_office_done","m_told_her_no"],montage:"Told Maria to stop covering for you. She said okay far too easily."}},{text:"Fourteen months. Got it.",reaction:"You say it yourself an hour later, by the orchids, to a man who does not blink, and it works. That is the part you will think about at three in the morning: not that she lied, but how well it worked, and how quickly you picked it up, and that you did not have to practice.",effects:{"npc.maria.trust":1,"npc.maria.exposure":1,cred:3,flags:["m_back_office_done","m_took_the_lie"],montage:"Fourteen months. You said it out loud by the orchids and it worked."}},{text:"Why fourteen?",reaction:"\u201CBecause it is a number I have used before and nobody died of it,\u201D she says, and before you can hold that sentence up to the light somebody needs a check written and she is gone through the door with her hand already out. You stand in a back office full of invoices doing arithmetic you do not want the answer to.",effects:{flags:["m_back_office_done","m_asked_fourteen"],montage:"Asked Maria why fourteen months. She said nobody had died of that number."}}]},m_causeway_lie:{speaker:"maria",portrait:"vulnerable",priority:11,conditions:{flag:"act1_done",flagNone:["m_lie_done"],moveGte:24,dealsSinceGte:3},lines:[{text:"She makes you pull over halfway across the MacArthur at three in the morning and shut the engine off. The water is flat and black and the skyline does the thing it does, which is pretend to be a promise.",portrait:"neutral"},{text:"\u201CNine thousand dollars left the gallery on Tuesday, under frames and freight.\u201D She is sitting on the hood with her shoes in her hand. \u201CA man on Twelfth Avenue was four days from saying your name to somebody who writes things down. Now he is going to say a different name, and he will be in Tampa by Sunday, and you were never going to hear about any of it.\u201D",portrait:"knowing"},{text:"\u201CI did this for C\xE9sar too. March. And it worked, cowboy \u2014 that is the part nobody warns you about. It worked for four months and I got to walk around feeling like a woman who was handling it.\u201D She keeps her eyes on the water instead of on you. \u201CAnd then it was July.\u201D",portrait:"vulnerable"}],choices:[{text:"Do it again if you have to.",reaction:"\u201CI will.\u201D She puts her shoes back on, one hand on the windshield for balance. \u201CAnd you will not know when. That is the arrangement you just made, and I would like you to notice that you made it on a bridge, in the dark, at three in the morning, exactly like everybody else who ever made it.\u201D",effects:{heatDelta:-8,"npc.maria.trust":2,"npc.maria.exposure":2,flags:["m_lie_done","m_let_her_lie"],montage:"Told Maria to keep handling it. She said you would not know when."}},{text:"Never again. Not for me.",reaction:"\u201CThat is a beautiful thing to say on a bridge.\u201D She gets back in the car and does not slam the door, which somehow is worse. Two weeks later a detective knows the name of the corner you use on Wednesdays, and there is nobody standing between those two facts, and you chose that.",effects:{"npc.ramirez.evidence":2,"npc.maria.trust":-1,flags:["m_lie_done","m_no_more_lies"],montage:"Told Maria never to lie for you. Two weeks later Vice knew about Wednesdays."}},{text:"Who did you tell in March?",reaction:"She does not answer. She flicks a cigarette into Biscayne Bay \u2014 a felony for which nobody in the history of Florida has ever been charged \u2014 and says, \u201CDrive.\u201D You drive. Neither of you speaks again until Alton Road, and then only about parking.",effects:{"npc.maria.trust":-2,flags:["m_lie_done","m_asked_march"],montage:"Asked Maria who she told in March. She said: drive."}}]},m_maria_knew:{speaker:"maria",portrait:"vulnerable",priority:14,conditions:{flag:"act2_done",flagNot:"maria_knew","npc.maria.met":{eq:!0},dealsSinceGte:1},lines:[{text:"You come in through the back at one in the morning. She has not turned the lights on \u2014 after ten the streetlight does all the work in here, which she calls the only free lighting designer in Florida. She is sitting on the floor with her back against the horse.",portrait:"neutral"},{text:"\u201CAsk it,\u201D she says. \u201CYou have been carrying it since Thursday and it is making you walk funny.\u201D",portrait:"knowing"},{text:"\u201CYes. I knew. Since about February.\u201D She says it the way you read a number off a receipt. \u201CHe told me himself, in this room, standing roughly where you are standing. And I did not turn him in, and I did not stop him. I have had a long time to work out which of those two is the crime and I have decided they are the same one.\u201D",portrait:"vulnerable"}],choices:[{text:"You could have stopped him.",reaction:"\u201CI could have.\u201D She does not argue \u2014 she has never in her life argued with a true sentence. \u201CI thought that if I did not look at it directly it would stay small. That is what I do. You have watched me do it to you for a month.\u201D Then she stands and turns the lights on, which from Maria Santos is slamming a door.",effects:{"npc.maria.trust":-2,flags:["maria_knew","m_blamed_her"],montage:"Told Maria she could have stopped him. She turned the lights on."}},{text:"So did I. Since Thursday. And I haven't done anything either.",reaction:"For a second she looks at you like you have handed her something heavy that she now has to hold. \u201CThat is not the same thing,\u201D she says. \u201CI appreciate it enormously. It is not the same thing.\u201D Then: \u201CStay for one drink. I will even order one, which you have never seen me do.\u201D She does. It is terrible. Neither of you finishes it.",effects:{"npc.maria.trust":3,flags:["maria_knew","m_shared_guilt"],montage:"Sat on the gallery floor with Maria. She ordered a drink. Nobody finished it."}},{text:"You knew it was Ramirez.",reaction:"\u201CI have hung his daughter\u2019s photographs. I have poured him wine. Eleven times, cowboy \u2014 I counted, because counting is what I do instead of sleeping.\u201D She rolls the glass between her palms. \u201CYou are allowed to think about what that makes me. I have thought about very little else since July.\u201D",effects:{"npc.maria.trust":-1,flags:["maria_knew","m_knew_it_was_ray"],montage:"Maria has poured Ramirez wine eleven times since July. She counted."}}]},m_subpoena:{speaker:"maria",portrait:"knowing",priority:13,conditions:{flag:"maria_knew",flagNone:["m_subpoena_done","betrayed_maria","protected_maria"],dealsSinceGte:2},lines:[{text:"A kid in a bad blazer serves the gallery at ten on a Tuesday morning and apologizes twice, which is the most Miami part of the whole thing. Subpoena duces tecum. Three years of consignment records, sales invoices and wire instructions, to the grand jury, in twelve days.",portrait:"neutral"},{text:"Maria reads it standing up, all the way through, twice. \u201CTwelve days is a courtesy. Somebody downtown decided to be polite to me, and people are polite to you when they want you to call them.\u201D She sets it on the desk very precisely, squared to the edge.",portrait:"knowing"},{text:"\u201CThere is a version of that drawer where I am a fool who sold a horse forty times to a charming young man. There is a version where I signed things. Both versions are in there, cowboy. The only difference between them is whose name is on the wire instructions.\u201D",portrait:"vulnerable"}],choices:[{text:"Put my name on all of it. Every wire. \u2014 $12,000",reaction:"Two days and twelve thousand dollars with a lawyer named Broche who bills by the sentence, and at the end of it the gallery is simply a place where a young man with more money than taste bought a great deal of art. \u201CThis is stupid,\u201D Maria says, reading the new paper. \u201CThank you. It is still stupid.\u201D It is the only time she has ever thanked you for anything.",effects:{cashDelta:-12e3,heatDelta:8,"npc.ramirez.evidence":3,"npc.maria.trust":3,flags:["m_subpoena_done","protected_maria"],montage:"Put your name on every wire in Maria's books. $12,000 and a lawyer named Broche."}},{text:"Let the paper stand.",reaction:"She files what exists, because what exists is what exists. She does not ask you for anything, and you notice that she does not, and then on the drive home you notice that you were relieved, and you have to sit at a light on Coral Way with that for a while.",effects:{"npc.maria.trust":-1,flags:["m_subpoena_done","m_let_paper_stand"],montage:"Let the gallery's paper stand as written. She did not ask you for anything."}},{text:"Give Ramirez the gallery. Buy yourself the twelve days.",reaction:"You meet him in the lot of a Farm Store on Bird Road and you say the word CONSIGNMENT and he stops chewing. It buys you a month, which is real, and you should be honest with yourself about how good the month feels. It costs her a decade in installments, beginning with a phone call she gets on Thursday and ending somewhere you will not be.",effects:{"npc.ramirez.evidence":-5,"npc.maria.trust":-6,cred:-4,flags:["m_subpoena_done","betrayed_maria"],montage:"Gave Ramirez the gallery for a month of daylight."}}]},m_last_ask:{speaker:"maria",portrait:"vulnerable",priority:12,conditions:{flag:"maria_knew",flagNone:["m_last_ask_done"],moveGte:36,dealsSinceGte:4},lines:[{text:"The show comes down on a Sunday. Thirty prints into thirty sleeves, and the back room goes back to being a back room. Maria works the wall with a putty knife and does not offer you one, which is how you know you are being talked to.",portrait:"neutral"},{text:"\u201CThis city has taken four people I liked. Two went to Raiford. One went in the water. One is in Kendall selling boats and will not return a call, which I maintain is the worst of the four outcomes.\u201D Putty. Sand. Putty. \u201CI am not doing a fifth.\u201D",portrait:"knowing"},{text:"\u201CSo here is the only thing I have ever asked you for, and I am going to say it once, standing up, holding a putty knife, because if I sit down I will say it badly.\u201D She does not turn around. \u201CNestor. Be the one who leaves.\u201D",portrait:"vulnerable"}],choices:[{text:"Come with me.",reaction:"\u201CAh.\u201D She goes back to the wall. \u201CThat is a beautiful answer to a different question.\u201D She does not say yes. She also does not say no, and she does not throw you out, and at two in the morning she is still filling holes in a wall with a man standing behind her holding the light, which for Maria Santos is practically a wedding.",effects:{"npc.maria.trust":2,flags:["m_last_ask_done","m_offered_seat","m_asked_her_to_come"],montage:"Asked Maria to come with you. She held the putty knife and did not say no."}},{text:"I can't. Not yet.",reaction:"\u201CNot yet.\u201D She tests the phrase like a bad oyster. \u201CC\xE9sar said \u2018after the summer.\u2019 Yours is shorter. I suppose that is progress.\u201D She finishes the wall alone. The next time you come by, the door is locked at an hour it has never once been locked.",effects:{"npc.maria.trust":-2,flags:["m_last_ask_done","m_offered_seat","m_refused_seat"],montage:"Told Maria not yet. Cesar said after the summer."}},{text:"Sell the gallery. Go yourself \u2014 I'll cover the difference. $20,000",reaction:"She looks at the twenty thousand for a long time, the way she looked at your first deposit slip. \u201CYou have just tried to buy me a life. It is the rudest thing anybody has done for me in years.\u201D She takes it. There is a buyer for the building by Friday, because of course there is, and the horse goes into the back of a station wagon like a piece of furniture.",effects:{cashDelta:-2e4,"npc.maria.trust":4,flags:["m_last_ask_done","m_offered_seat","m_bought_her_out","protected_maria"],montage:"Put $20,000 on the desk to get Maria out of Miami. She called it rude."}}]},m_after_betrayal:{speaker:"maria",portrait:"vulnerable",priority:11,conditions:{flag:"betrayed_maria",flagNone:["m_epilogue_done"],dealsSinceGte:3},lines:[{text:"The gallery is closed on a Wednesday, which it has never been. The horse is gone from the window. Through the glass the white room is only a white room, with banker\u2019s boxes stacked by the desk, taped and labeled in her handwriting.",portrait:"neutral"},{text:"She is at the coffee window on Ponce with a cortadito she is not drinking. She sees you, and does not stand up, and does not leave, which is worse than either.",portrait:"knowing"},{text:"\u201CThey came Thursday at seven in the morning, which is an hour chosen by a man who wants you in a robe.\u201D She turns the cup a quarter turn on the saucer. \u201CThe lawyer says four years, probably three. He also says I should not be seen with you, and here I am being seen with you, so you can measure exactly how much I am able to help myself.\u201D",portrait:"vulnerable"}],choices:[{text:"Take the money. Whatever you need. \u2014 $15,000",reaction:"She takes it, because she has never once been sentimental about money. \u201CThis buys a better lawyer and a worse feeling. The better lawyer is real, so I am going to accept it.\u201D She still does not stand up. \u201CGo on. You are late for whatever it is. You always were, actually \u2014 I never mentioned it.\u201D",effects:{cashDelta:-15e3,"npc.maria.trust":1,flags:["m_epilogue_done","m_paid_after"],montage:"Put $15,000 on a coffee counter on Ponce. She did not stand up."}},{text:"I'd do it again.",reaction:"\u201CI believe you.\u201D She finishes the cortadito in one go, which you have never seen her do with anything. \u201CThat is the only compliment I have left in the drawer: I believe absolutely every word you say now. You have become extremely easy to understand.\u201D Then she walks back toward a building she no longer has the keys to.",effects:{cred:4,"npc.maria.trust":-3,flags:["m_epilogue_done","m_no_regret"],montage:"Told Maria you would do it again. She said you had become easy to understand."}},{text:"I'm sorry.",reaction:"\u201CDon\u2019t.\u201D She says it kindly, which is unbearable. \u201CSorry is what men say instead of money, and I have sat across from forty of them while they said it. You were not the worst of them.\u201D She looks at the empty window where the horse used to be. \u201CYou were only the fastest.\u201D",effects:{"npc.maria.trust":-1,flags:["m_epilogue_done","m_apologized"],montage:"Apologized to Maria on Ponce. She said you were only the fastest."}}]},m_after_protection:{speaker:"maria",portrait:"amused",priority:11,conditions:{flag:"protected_maria",flagNone:["m_epilogue_done","betrayed_maria"],dealsSinceGte:3},lines:[{text:"The gallery survives, which in this city qualifies as a plot twist. There is a new show up \u2014 boats, obviously, because rich people adore boats \u2014 and the horse has been moved into the back office where he can be sad in private.",portrait:"neutral"},{text:"\u201CThe grand jury received four hundred pages about a young man with more money than taste,\u201D Maria says. \u201CThen they subpoenaed my accountant, who is seventy-one and answers every question with a story about Havana. I am told they gave up on a Tuesday, which is the correct day to give up.\u201D",portrait:"amused"},{text:"She pours two glasses of something and hands you one without being asked, which has not happened before. \u201CI have spent a week looking for a way to say thank you that does not sound like the beginning of an obligation, and there isn\u2019t one. So: thank you. You are owed. I hate it, and I am not going to do anything about it.\u201D",portrait:"vulnerable"}],choices:[{text:"Then we're even.",reaction:"\u201CWe are not,\u201D she says, \u201Cbut I accept the accounting.\u201D The glasses touch. Outside, a man in a bad Corvette attempts to parallel park for the fourth time, and the two of you watch him fail from inside a white room with a boat in it, and neither of you says anything for a while, and it is the best hour of the month.",effects:{"npc.maria.trust":2,flags:["m_epilogue_done","m_even"],montage:"Watched a man fail to parallel park from inside a white room with a boat in it."}},{text:"Then use it. Get out of Miami.",reaction:"\u201CAnd go where \u2014 Atlanta? I have SEEN Atlanta.\u201D But she does not laugh at the end of it, and later, on your way out, with her back to you and her hand already on the light switch, she says, \u201CIf you go first, I will consider it.\u201D From her that is a signed document.",effects:{"npc.maria.trust":1,flags:["m_epilogue_done","m_told_her_go"],montage:"Told Maria to use the favor and leave. She said: if you go first."}}]},c_open_station:{speaker:"narrator",portrait:"neutral",priority:100,conditions:{moveLte:0,flagNot:"c_opened"},lines:[{text:"The Greyhound gets in at 6:40 in the morning and the station smells like floor wax and other people\u2019s cigarettes. Eleven days ago your brother went into the water off Virginia Key. The county mailed you a card with a phone number on the back of it, in handwriting that is not his.",portrait:"neutral"},{text:"You have a duffel bag, ninety dollars, and a return ticket you already know you are not going to use. Outside, the heat comes off the sidewalk like something with an opinion. There is a payphone by the men\u2019s room and a Coral Gables number on the card and, above the number, one word: MARIA.",portrait:"neutral"},{text:"Behind you the driver is hauling bags out of the belly of the bus and calling MIAMI, MIAMI, as if anybody still on board could be in doubt about that.",portrait:"neutral"}],choices:[{text:"Call the number now",reaction:"It rings four times. A woman picks up and does not say hello. You get out two words \u2014 your brother\u2019s name \u2014 and she says, \u201CNot on a telephone,\u201D in the voice of somebody who has said it before, and gives you a street in Coral Gables. Then the line is just a line again. You are across the causeway before you have slept, or eaten, or put the bag down.",effects:{hpDelta:-6,flags:["c_opened","c_called_first_night"],montage:"Called the number on the funeral card from a station payphone."}},{text:"Find a room. Call when you\u2019ve slept",reaction:"A room on Biscayne with a fan bolted to the ceiling and a Bible in the drawer with forty dollars in it, which you leave, because you are not that yet. In the morning the card is on the nightstand where you put it and the handwriting is still not his and the city has already been awake for hours.",effects:{cashDelta:-60,flags:["c_opened","c_waited"],montage:"Slept one night before you called. It was the last easy night."}}]},c_the_duffel_man:{speaker:"narrator",portrait:"neutral",priority:11,conditions:{flag:"c_opened",flagNot:"c_duffel_man",totalDealsGte:2,dealsSinceGte:2},lines:[{text:"You have seen this kid before. He was working the benches at the Greyhound station your first morning \u2014 sixteen, maybe, a Members Only jacket in August, moving through the waiting room like a man reading a menu. You were the only thing in the building worth reading.",portrait:"neutral"},{text:"He is on a corner in Overtown now with a beeper on his belt and a roll in his sock, and when he sees you he does not run, which means somebody has already told him who you are. \u201CYou C\xE9sar brother,\u201D he says. It is not a question. \u201CEverybody know that.\u201D",portrait:"neutral"},{text:"\u201CYou want to meet the man, I get you to the man. He don\u2019t come to corners. He got a house.\u201D He never once says a name, the way you would never say a name for weather.",portrait:"neutral"}],choices:[{text:"Send word up. I\u2019ll take the meeting",reaction:"Two days later a car you did not order is outside your motel at four in the afternoon with the engine off and the windows down, and the driver reads a paperback until you are ready. Nobody in this city has ever waited for you before.",effects:{"npc.colombiano.met":!0,flags:["c_duffel_man","c_sent_for"],montage:"Sent word up the ladder. A car came back down and waited."}},{text:"Not yet. Buy what\u2019s in his sock",reaction:"Three hundred dollars for a sock roll, and he counts it twice the way somebody taught him to, and you walk off with product and without an introduction. Somewhere a man is told that C\xE9sar\u2019s brother is buying off corners, which is either humility or an insult, and he will decide which at his leisure.",effects:{cashDelta:-300,invGift:{idx:4,qty:8},"npc.colombiano.trust":-1,flags:["c_duffel_man","c_bought_the_corner"],montage:"Bought a kid\u2019s sock roll instead of taking the meeting."}}]},c_col_intro:{speaker:"colombiano",portrait:"neutral",priority:13,conditions:{totalDealsGte:3,flagNot:"c_col_met",dealsSinceGte:2},lines:[{text:"The house is in Coral Gables and the driveway is longer than the street you grew up on. There is a birdcage in the front room with nothing in it. He is in a chair by the window that is plainly the good chair, and he does not stand, and he does not offer a name, and it will be four months before you understand that this is not rudeness. It is hygiene.",portrait:"neutral"},{text:"\u201CYour brother came to me on a Tuesday in 1983 with eleven hundred dollars and a plan that was not good.\u201D He turns his glass a quarter turn on the table. \u201CI gave him back the eleven hundred and a kilo on paper. The plan improved. This is what I do. I do not sell to men. I put men in a position where it is worth selling to them.\u201D",portrait:"neutral"},{text:"\u201CYou are here because the position is empty, and the position does not enjoy being empty. His terms are available to you. His terms were not generous. He never once asked me for better, which I always thought was the only stupid thing about him.\u201D",portrait:"pleased"}],choices:[{text:"The same terms are fine",reaction:"\u201CGood.\u201D He does not smile; his face simply stops doing the other thing. \u201CA man who takes the first number is humble or he is planning. I have known both and I prefer neither, but the paperwork is identical.\u201D The package is in the trunk of your car before you reach the car.",effects:{"npc.colombiano.met":!0,"npc.colombiano.trust":2,invGift:{idx:5,qty:6},flags:["c_col_met","c_took_his_terms"],montage:"Took C\xE9sar\u2019s old terms from the man in the cream suit."}},{text:"Then I\u2019m asking for better",reaction:"The pause is not long. It is exactly as long as it needs to be. \u201CEight points,\u201D he says. \u201CYou will find that eight points is a great deal of money and no protection at all. One day you will want to trade it back, and on that day it will cost more than eight points.\u201D He is looking out the window before you reach the door.",effects:{"npc.colombiano.met":!0,"npc.colombiano.trust":-1,cred:4,invGift:{idx:5,qty:4},flags:["c_col_met","c_asked_for_better"],montage:"Asked the supplier for eight points. Got them. Noted."}}]},c_col_weather:{speaker:"colombiano",portrait:"neutral",priority:11,conditions:{flag:"c_col_met",flagNot:"c_col_weather",totalDealsGte:6,dealsSinceGte:3},lines:[{text:"He calls you to a marina in Coconut Grove to look at a boat he is not going to buy. \u201CIn Barranquilla the rain comes at four o\u2019clock,\u201D he says. \u201CEvery day, four o\u2019clock, you can set a watch by it. Here it comes when it wants. Everybody here believes that is freedom. It is only bad scheduling.\u201D",portrait:"neutral"},{text:"A pelican lands on the piling beside him and he watches it with real interest for eleven seconds. \u201CYour brother became difficult to schedule. In the last months. He would be late \u2014 and then he would be very early, which is worse, because early is a man who has already been somewhere.\u201D",portrait:"cold"}],choices:[{text:"Where was he going first?",reaction:"He looks at you the way a man looks at a bill he has already decided to pay. \u201CTo breakfast, I assumed. He liked a place on Coral Way with the pressed sandwich and the terrible coffee.\u201D He is telling the truth about the sandwich. He is telling you something else about everything around the sandwich, and you both know it, and neither of you says so.",effects:{"npc.colombiano.trust":-1,flags:["c_col_weather","c_col_pressed"],montage:"Asked where C\xE9sar went in the mornings. He described a sandwich."}},{text:"Let it go. Talk about the boat",reaction:"So you talk about the boat, which is forty-two feet and Italian and will be sold to a dentist, and he relaxes by one degree, which on him is a party. On the drive back you understand that he told you something and then let you decide not to hear it, and that he will remember which you chose.",effects:{"npc.colombiano.trust":2,flags:["c_col_weather","c_col_let_it_go"],montage:"Let the supplier change the subject. He noticed that, too."}}]},c_col_debt:{speaker:"colombiano",portrait:"neutral",priority:12,conditions:{flag:"c_col_met",flagNot:"c_col_debt_done",totalProfitGte:9e3,dealsSinceGte:2},lines:[{text:"A man in a barbershop on Calle Ocho hands you a folded sheet of graph paper while you are still in the chair. A column of numbers in pencil. The last one is circled twice. It is nine thousand four hundred dollars.",portrait:"neutral"},{text:"That evening the telephone in your motel rings at the exact minute you walk in. \u201CYou have seen the paper. I want to be clear that this is not a demand, it is an inventory. Your brother\u2019s balance did not die with him, because the product did not die with him. Somebody smoked it. Somebody enjoyed it. Here we are.\u201D",portrait:"neutral"},{text:"\u201CYou may pay it or you may carry it. Carrying is not a punishment. It is only that a carried number is a different kind of relationship than a paid one \u2014 and both of them are relationships.\u201D",portrait:"cold"}],choices:[{text:"Pay it. Today \u2014 $9,400",reaction:"You count it out on a coffee table in front of a man who does not count it after you. \u201CNow you are a customer,\u201D he says, and there is something underneath it that might be regret. \u201CA customer may leave. Remember that I told you this on the day you paid, and not later, when it would be a kindness.\u201D",effects:{cashDelta:-9400,"npc.colombiano.trust":3,flags:["c_col_debt_done","c_paid_cesars_balance"],montage:"Paid C\xE9sar\u2019s balance in cash. $9,400, counted once."}},{text:"Carry it",reaction:"\u201COf course.\u201D Nothing in his voice moves at all, which is the entire message. The number goes onto a page in a book you have never seen, in a house you have been inside once, and it will grow at a rate that nobody is ever going to state out loud to you.",effects:{debtDelta:11e3,"npc.colombiano.trust":1,flags:["c_col_debt_done","c_carried_the_balance"],montage:"Carried C\xE9sar\u2019s balance. It went into a book you\u2019ve never seen."}}]},c_col_successor:{speaker:"colombiano",portrait:"pleased",priority:12,conditions:{flag:"act1_done",flagNot:"c_col_successor",totalProfitGte:3e4,"npc.colombiano.trust":{gte:1},dealsSinceGte:2},lines:[{text:"This time you are not received in the front room. You are taken through it, past the empty birdcage, into a kitchen where a woman is making lunch for eleven people and nobody is coming for lunch. He is at the table with a ledger and reading glasses, which is the first evidence you have ever had that he is a person who ages.",portrait:"neutral"},{text:"\u201CSit. Eat something, she will be insulted.\u201D He turns the ledger around so that you can read it, which is either the greatest compliment of your life or the beginning of a problem. Four columns. Six months. A number at the bottom that makes everything you have done so far look like a hobby.",portrait:"neutral"},{text:"\u201CSixty kilos a month move through this city on my paper and I touch none of it. That is not a boast, it is an instruction. The man who touches it goes to prison. The man who schedules it goes to Barranquilla in November for his mother\u2019s birthday.\u201D He closes the book. \u201CI am going to give you weight on consignment. Not because I trust you. Because you are the only person in this arrangement who is not yet tired.\u201D",portrait:"pleased"}],choices:[{text:"Take the consignment",reaction:"Weight on paper and no money changes hands, which is the most frightening transaction of your life. \u201CNow you understand the difference,\u201D he says, walking you out. \u201CBefore today, if you had disappeared it would have been unfortunate. Today it would be arithmetic.\u201D",effects:{invGift:{idx:5,qty:24},debtDelta:9e3,"npc.colombiano.trust":3,flags:["c_col_successor","col_heir_path"],montage:"Took weight on consignment. You are arithmetic now."}},{text:"I\u2019d rather buy what I can pay for",reaction:"He accepts this without argument, which is worse than an argument. \u201CA careful man. Your brother was also careful, in his own way, about his own things.\u201D Then he walks you out anyway \u2014 all the way to the car, and stands in the driveway until you are gone, which he has never done before.",effects:{"npc.colombiano.trust":-1,cred:3,flags:["c_col_successor","col_declined_weight"],montage:"Turned down the consignment. He walked you to the car himself."}}]},c_col_flowers:{speaker:"colombiano",portrait:"pleased",priority:12,conditions:{flag:"act1_done",flagNot:"c_col_flowers",totalProfitGte:22e3,dealsSinceGte:3},lines:[{text:"There is an exhibition at the gallery in Coral Gables. A young photographer, first show, her name on a card by the door in a typeface somebody agonised over. He knows about it before you mention it. He knows the date, the hours, and the name of the caterer.",portrait:"neutral"},{text:"\u201CI am sending flowers. Birds of paradise \u2014 vulgar, but they last.\u201D He is writing on a small card as he says it. \u201CYou will carry the card. A card from me arriving by van is a different sentence than a card from me arriving in a friend\u2019s hand.\u201D He writes four words and does not show you which four.",portrait:"pleased"},{text:"Then, while he is capping the pen: \u201CThe girl\u2019s father attends these things, I imagine. A working man. Detectives have Thursdays like everybody else.\u201D He says it in exactly the voice he used for the rain at four o\u2019clock.",portrait:"cold"}],choices:[{text:"Tell him the detective will be there",reaction:"\u201CThank you.\u201D He puts the pen in his pocket. \u201CThen I will not go. I have no interest in standing in a room with a man who is paid to remember faces. You see \u2014 you have done him a favour and he will never know it, and that is the only kind that is safe to do.\u201D The flowers arrive at eleven. They are, in fact, vulgar. They last three weeks.",effects:{"npc.colombiano.trust":2,flags:["c_col_flowers","col_told_of_ramirez"],montage:"Told the supplier which night the detective would be at the gallery."}},{text:"Say nothing about who comes",reaction:"You carry the card and say nothing, and the evening happens the way evenings happen: wine in plastic cups, a father standing a little too close to a photograph of a parking lot at dawn. Two weeks later, apropos of a shipment, he mentions that he understands the show was well attended \u2014 and then lets the sentence sit there until you are certain he is not going to finish it.",effects:{"npc.colombiano.trust":-1,flags:["c_col_flowers","col_edited"],montage:"Kept the guest list to yourself. He noticed the gap in it."}}]},c_col_ledger:{speaker:"colombiano",portrait:"cold",priority:12,conditions:{flag:"act2_done",flagNot:"c_col_ledger",dealsSinceGte:2},lines:[{text:"He is repairing a chair when you arrive. Actually repairing it \u2014 glue, a clamp, newspaper spread on the floor. \u201CThe joint has been loose a year and I sat in it anyway. This is a thing men do. They sit in the loose chair and they say: next month.\u201D",portrait:"neutral"},{text:"\u201CYou have learned something recently and you are carrying it badly. So \u2014 a lesson, since we are both here and the glue must dry.\u201D He wipes his hands. \u201CA man who talks to the police is not a traitor. Traitor is a word for families. He is a leak. You do not punish a leak. You do not raise your voice at a leak. You repair it, and then you sit in the chair again.\u201D",portrait:"cold"}],choices:[{text:"Who repaired C\xE9sar?",reaction:"He tightens the clamp one full turn and tests it with his thumb. \u201CNot today,\u201D he says. \u201CToday the glue is wet and you are angry, and neither of those improves an answer.\u201D It is the first time he has ever declined to lie to you.",effects:{"npc.colombiano.trust":1,flags:["c_col_ledger","c_col_almost"],montage:"Asked who repaired C\xE9sar. He said: not today."}},{text:"Understood",reaction:"\u201CI don\u2019t think it is, yet,\u201D he says, almost kindly. \u201CBut you said it in the right order, which is most of it.\u201D He hands you the newspaper off the floor to put in the bin. It is eleven days old. You check the date twice on the way out.",effects:{"npc.colombiano.trust":3,flags:["c_col_ledger","c_col_swallowed_it"],montage:"Said Understood to a man gluing a chair. He corrected you gently."}}]},c_col_punctual:{speaker:"colombiano",portrait:"cold",priority:13,conditions:{flagAny:["ending_witness","betrayed_col"],flagNot:"c_col_punctual","npc.colombiano.met":{eq:!0},dealsSinceGte:2},lines:[{text:"He remarks, in passing, on your punctuality. \u201CYou have become punctual. Three weeks now \u2014 exactly on the hour, every time, and you never stay for the second drink.\u201D He is not accusing you of anything. He is describing the weather.",portrait:"neutral"},{text:"\u201CI will tell you what I have decided, so that there is no misunderstanding later, which is when misunderstandings become expensive. I have decided to do nothing. For now. Because I am leaving anyway \u2014 and because a man who is careful about the hour is a man who still believes he is choosing.\u201D",portrait:"cold"}],choices:[{text:"Buy the doubt \u2014 wire $25,000 tonight",reaction:"The money moves through a marina account in Coconut Grove and buys, by any honest accounting, about six weeks. He never acknowledges receiving it, which is how you know that he received it. Six weeks is not nothing. Six weeks is a trial date.",effects:{cashDelta:-25e3,"npc.colombiano.trust":2,flags:["c_col_punctual","col_bought_silence"],montage:"Wired $25,000 through a marina account to buy six weeks."}},{text:"Be late. Stay for the second drink",reaction:"So you are late, and you stay, and the second drink is rum you do not want at a table you cannot leave, and for ninety minutes you are the most relaxed man in Dade County. Later, in the car, your hands start, and it takes both of them on the wheel to stop it.",effects:{heatDelta:4,hpDelta:-8,"npc.colombiano.trust":1,flags:["c_col_punctual","col_played_it_out"],montage:"Stayed for the second drink. Your hands started afterward."}}]},c_col_offer:{speaker:"colombiano",portrait:"pleased",priority:14,conditions:{flagAll:["act2_done","c_col_ledger"],flagNot:"c_col_offer",flagNone:["ending_witness","ending_ghost"],totalProfitGte:6e4,"npc.colombiano.trust":{gte:3},dealsSinceGte:2},lines:[{text:"November. There is a suitcase in the front room \u2014 a real one, leather, packed. The birdcage is gone. \u201CMy mother is eighty-one on the fourteenth. I have not sat at her table since 1979. She is not sentimental about this. She is Colombian. She is simply keeping score.\u201D",portrait:"neutral"},{text:"\u201CSo. The route.\u201D He says it the way a man says the name of a dog he is rehoming. \u201CIt has a schedule, and the schedule does not care who is holding it. Whoever holds it in December holds it in April, and by April it is very difficult to put down.\u201D",portrait:"neutral"},{text:"\u201CI am not asking you to be me. That would be flattering and stupid. I am asking whether the schedule will be kept. It is the only question I have ever asked anybody.\u201D",portrait:"pleased"}],choices:[{text:"The schedule will be kept",reaction:"\u201CGood.\u201D He carries his glass to the sink and washes it himself, which you have never seen him do, and dries it, and puts it back in the cupboard where it lives. \u201CThe chair by the window is a good chair. It is also the only chair in the room that can see the driveway. In a year you will have stopped noticing that you sit in it.\u201D",effects:{"npc.colombiano.trust":3,cred:8,flags:["c_col_offer","ending_inheritor","col_chair_taken"],montage:"Told him the schedule would be kept. The chair by the window is yours."}},{text:"Give it to somebody else",reaction:"\u201CSomebody else.\u201D He tries the phrase out and finds it acceptable, and that is the worst part \u2014 it costs him nothing. \u201CThen I give it to a man from Cali whom I do not like, and in nine months something will happen to him, and neither of us will be surprised, and you will read about it in the newspaper and feel nothing. That is the part I would like you to be ready for.\u201D",effects:{"npc.colombiano.trust":-2,flags:["c_col_offer","col_refused_chair"],montage:"Refused the route. He gave it to a man from Cali."}}]},c_col_admission:{speaker:"colombiano",portrait:"cold",priority:15,conditions:{flagAll:["act2_done","c_col_ledger"],flagNot:"c_col_admission",moveGte:32,dealsSinceGte:2},lines:[{text:"Last time. He is standing in an empty room \u2014 the furniture went ahead of him in a truck this morning \u2014 and the light through the window is the wrong colour without curtains. \u201CAsk,\u201D he says, before you have said anything at all. \u201CYou have carried the question through two rooms. Set it down.\u201D",portrait:"neutral"},{text:"So you ask. And he answers immediately, without ceremony, the way a man confirms a delivery. \u201CYes. In July. He had been in a brown car eleven times, and the eleventh time he stayed forty minutes, and forty minutes is not a conversation, it is a statement.\u201D A pause, only for accuracy: \u201CIt was done in the water because the water is quiet, and because his mother is alive.\u201D",portrait:"cold"}],choices:[{text:"Why tell me at all?",reaction:"\u201CBecause you would have found it, and found it badly, and made it into a story about yourself.\u201D He looks around the empty room for something to do with his hands and finds nothing. \u201CI did not hate your brother. I have never hated anybody in this business \u2014 it is an expensive emotion and it does not scale. He was a good earner, he became a leak, and I repaired him. If you require me to be sorry you will be standing here a long time, and the truck is already on I-95.\u201D",effects:{"npc.colombiano.trust":1,flags:["c_col_admission","knows_col_ordered","c_col_asked_why"],montage:"He said yes. In March. Because of a brown car and forty minutes."}},{text:"Say it in plain words",reaction:"\u201CI had your brother killed.\u201D He says it exactly once, at conversational volume, in an empty room with no curtains \u2014 and then waits. Not defensively. The way a man waits after reading something aloud, to see whether you would like him to continue. That is the part you will still be hearing in five years.",effects:{"npc.colombiano.trust":-1,flags:["c_col_admission","knows_col_ordered","c_col_made_him_say_it"],montage:"Made him say it in plain words. Conversational volume. Once."}}]},c_act1_close:{speaker:"narrator",portrait:"neutral",priority:15,conditions:{flag:"c_opened",flagNot:"act1_done",totalDealsGte:6,totalProfitGte:8e3,moveGte:8,dealsSinceGte:2},lines:[{text:"The Medical Examiner\u2019s office on NW 10th Avenue releases personal effects on weekdays between nine and eleven-thirty. The clerk is a large, calm man named Fitzgerald who has done this several thousand times and has never once got used to it, which you can tell because he says your brother\u2019s whole name every time instead of shortening it.",portrait:"neutral"},{text:"One manila envelope. A wallet with sixty-one dollars in it. A key to a car that was never found. A wristwatch \u2014 steel, not expensive \u2014 stopped at 11:40. The report says he entered the water some time after two in the morning.",portrait:"neutral"},{text:"You sit in the parking lot with the envelope on your knees for a while. A watch that stops at 11:40 was on a wrist that stopped at 11:40. There is a version of this where the water came second, and it is the only version, and it took you nine minutes in a parking lot to see it, and it took a county employee an entire afternoon not to.",portrait:"neutral"}],choices:[{text:"Keep the watch. Say nothing to anybody",reaction:"You put it on. It is a little loose and you do not have it adjusted, because having it adjusted would be a decision and this is not that yet. It stays at 11:40 for the rest of the summer. You look at it far more often than a stopped watch deserves.",effects:{flags:["act1_done","c_kept_watch"],montage:"The watch stopped at 11:40. He went into the water after two."}},{text:"Ask who signed for the body",reaction:"Fitzgerald turns the log book around without being asked twice. A detective\u2019s signature, Metro-Dade, dated the following morning at 6:15 \u2014 which is early, even for a man doing paperwork. He also signed the line for personal effects, and then took none, which the form has no box for. Fitzgerald mentions that you are the second person this month to ask, and does not say who the first was.",effects:{heatDelta:4,flags:["act1_done","c_saw_signature"],montage:"A detective signed for the body at 6:15 the next morning. Took nothing."}}]},c_act2_close:{speaker:"colombiano",portrait:"neutral",priority:15,conditions:{flag:"act1_done",flagNot:"act2_done",totalProfitGte:26e3,moveGte:18,dealsSinceGte:2},lines:[{text:"A man you have never met is sitting in the passenger seat of your car outside a Farm Store on Bird Road, eating a sandwich, with a manila envelope on his lap. He apologises for the sandwich. He does not apologise for the seat.",portrait:"neutral"},{text:"Photographs. Eleven of them, dated in grease pencil across five months. A brown Plymouth in a supermarket lot before dawn. Your brother getting in on the passenger side. Your brother getting out. Your brother laughing at something, once, in frame seven \u2014 which is the one you will not be able to stop looking at.",portrait:"neutral"},{text:"\u201CHe says you should have these,\u201D the man says, folding the wax paper. \u201CHe says you should have them from a friend and not from a lawyer.\u201D On the back of frame eleven somebody has written the tag number of the brown car in the same pencil. You have seen that car. You have seen that car this week.",portrait:"cold"}],choices:[{text:"Take the envelope",reaction:"You take it. He gets out, shakes your hand through the window with sandwich still in it, and walks off toward a bus stop like a man with a job, which he has. That night you lay eleven photographs out on a motel bed in date order and understand that your brother talked to a detective for five months, and that most of this city knew before you did, and that all of them let you find out on a Tuesday, from a stranger, in a parking lot.",effects:{"npc.colombiano.met":!0,"npc.colombiano.trust":1,flags:["act2_done","knows_ramirez_ran","c_photos_taken"],montage:"Eleven photographs. Five months. A brown Plymouth and C\xE9sar laughing."}},{text:"Refuse it. Get out of the car",reaction:"\u201CAs you like.\u201D He does not put the envelope away. He describes them to you instead \u2014 in order, in a mild voice, standing on the sidewalk with the sun going: the lot, the car, the passenger door, the five months, the tag number. When he is finished he says it was nice to meet you and goes to catch his bus. You never had to look at anything. You will never be able to stop.",effects:{"npc.colombiano.met":!0,"npc.colombiano.trust":-1,hpDelta:-6,flags:["act2_done","knows_ramirez_ran","c_photos_described"],montage:"Refused the envelope. He described all eleven from memory instead."}}]},c_act3_commit:{speaker:"narrator",portrait:"neutral",priority:14,conditions:{flag:"act2_done",flagNone:["ending_witness","ending_inheritor","ending_ghost"],moveGte:34,dealsSinceGte:2},lines:[{text:"You are supposed to be on a plane in four days. You have known this for two weeks and you have not bought the ticket, which is its own kind of answer.",portrait:"neutral"},{text:"Three people want the same thing from you in three different sets of words. The detective wants somebody who will sit in a chair and say a date out loud. The man in the cream suit wants a schedule kept after he is gone \u2014 he made that offer once and has never withdrawn it, because withdrawing things is not something he does. Maria has never asked you for anything at all, which is how you know what she wants: for one of you to get out of this city, so that it isn\u2019t a hundred percent.",portrait:"neutral"},{text:"The gallery closes at seven on Friday. Whatever you decide, that is where it happens, because that is where everybody already knows to go.",portrait:"neutral"}],choices:[{text:"Give the detective the whole thing",reaction:"You call the number he wrote on a napkin in April and you say one sentence and he does not ask you to repeat it. \u201CFriday,\u201D he says. \u201COkay. Friday.\u201D Then, after a silence you can hear him deciding about: \u201CYou know this doesn\u2019t end with anybody being glad.\u201D You say you know. Neither of you says goodbye. You both just stop.",effects:{flags:["ending_witness"],montage:"Called the detective. Friday, at the gallery, after closing."}},{text:"Keep the schedule",reaction:"You do not call anybody. You take your suit to be cleaned, and on the way back you catch yourself checking the driveway of a house you do not own yet, and the man at the dry cleaner calls you sir in a way that he did not in June.",effects:{cred:5,flags:["ending_inheritor"],montage:"Got the suit cleaned. Nobody needed to be called."}},{text:"Take the money and go",reaction:"You buy the ticket at a travel agent on Ponce with cash, one way, and then you sit in the car in the lot for a while with the envelope on the passenger seat. It is a good decision. It has been a good decision for eleven days. That is exactly how long it has been available.",effects:{flags:["ending_ghost"],montage:"Bought a one-way ticket with cash and sat in the lot holding it."}}]},r_sedan:{speaker:"ramirez",portrait:"neutral",priority:14,conditions:{"npc.ramirez.met":{eq:!1},moveGte:3,dealsSinceGte:2},lines:[{text:"The brown sedan was outside the funeral home on Flagler. Then outside your motel. Then outside the bot\xE1nica where you buy coffee, which is either surveillance or the worst coincidence in Dade County.",portrait:"neutral"},{text:"\u201CRay Ramirez, Metro-Dade.\u201D Cuban sandwich in wax paper, and the suit of a man who stopped shopping under Carter. \u201CI\u2019d show you the badge, but you already read my plates. Twice. On Tuesday you read them from the bus bench, which I respected.\u201D",portrait:"wry"},{text:"\u201CI worked your brother. Not a case \u2014 a DROWNING. Eleven days old, closed in an afternoon.\u201D He folds the wax paper into a square, then into a smaller square. \u201CI have signed off on maybe four hundred of those. I have lost sleep over one. Coffee? I\u2019m buying. Accepting coffee from a police officer is not admissible. I checked.\u201D",portrait:"tired"}],choices:[{text:"Take the coffee",reaction:"He waits until you have both hands on the cup. \u201CDid he swim?\u201D You say yes \u2014 everyone in your family swims, C\xE9sar went a mile out at Crandon and came back bored. Ramirez nods the way a man nods when you confirm the thing he was hoping to be wrong about, and writes nothing down at all. \u201COkay,\u201D he says. \u201COkay.\u201D He pays with exact change he had already counted out in the car.",effects:{"npc.ramirez.met":!0,"npc.ramirez.trust":1,flags:["r_met"],montage:"Drank a cop\u2019s coffee on Flagler. He asked whether C\xE9sar could swim."}},{text:"I came to bury him, not to talk to you",reaction:"\u201CSure.\u201D He steps aside and lets you past, which costs him nothing and somehow costs you something. \u201CFor the record \u2014 I came to the service. Back row. You shook my hand, you thanked me for coming, and you thought I was from the union.\u201D The sedan takes three tries to start. Even his car is exhausted.",effects:{"npc.ramirez.met":!0,"npc.ramirez.evidence":1,flags:["r_met","r_cold_open"],montage:"Walked past Ramirez on Flagler. He had been at the funeral. Back row."}}]},r_frame_nineteen:{speaker:"ramirez",portrait:"tired",priority:11,conditions:{flag:"r_met",flagNot:"r_elena_known",evidenceGte:3,dealsSinceGte:3},lines:[{text:"Ramirez is on the hood of the sedan with a manila envelope on one knee and a sandwich on the other, eating with the concentration of a man who missed lunch on Tuesday and is aware that it is now Thursday.",portrait:"neutral"},{text:"\u201CMy kid takes pictures. Twenty-two. Night classes at Miami-Dade. Thinks this city is a SUBJECT instead of a place.\u201D He slides a contact sheet across the hood. Thirty-six frames of Overtown at dusk. \u201CNineteen.\u201D",portrait:"tired"},{text:"Frame nineteen is you. Half-turned, hand out, on a corner nobody has ever photographed for the architecture. \u201CShe doesn\u2019t know what she got. She thinks it\u2019s a picture about the light. It IS a picture about the light. That\u2019s the part that keeps me up.\u201D",portrait:"wry"}],choices:[{text:"She won't see me on that corner again",reaction:"\u201CThat\u2019s the correct answer. It is also the answer everybody gives me.\u201D He folds the sheet back into the envelope like a man putting a bird back in a cage. \u201CElena. Her name is Elena. Now you know it, which means now it costs you something.\u201D",effects:{"npc.ramirez.trust":1,flags:["r_elena_known","r_elena_promise"],montage:"Ramirez showed you frame nineteen. Her name is Elena."}},{text:"Name a price for the negative",reaction:"\u201CIt\u2019s a contact sheet, kid. A dollar forty of paper and a chemistry set.\u201D He does not get angry, which is the problem. \u201CYou just tried to buy a photograph of yourself off a police officer in a parking lot. Write today\u2019s date down somewhere. You\u2019ll want it later, for the part where you wonder when it started.\u201D",effects:{cred:2,"npc.ramirez.evidence":1,flags:["r_elena_known","r_offered_money"],montage:"Tried to buy frame nineteen off a cop. He told you to note the date."}},{text:"Keep your family out of my business",reaction:"\u201CShe walked into YOUR business. With a camera her grandmother paid for.\u201D He gets off the hood and brushes crumbs from a tie that stopped being fashionable during a different presidency. \u201CFifteen years I have done this job without hating anybody. Don\u2019t be the one who ruins the record.\u201D",effects:{"npc.ramirez.trust":-1,"npc.ramirez.evidence":1,flags:["r_elena_known","r_warned_off"],montage:"Told Ramirez to keep his daughter out of it. He remembered that."}}]},r_the_water:{speaker:"ramirez",portrait:"tired",priority:13,conditions:{flag:"r_met",flagNone:["r_file_seen"],totalProfitGte:9e3,moveGte:8,dealsSinceGte:2},lines:[{text:"He does not call ahead. He is in the booth across from you with a folder he should not have photocopied, and he turns it around so it faces you, which detectives are trained never to do.",portrait:"neutral"},{text:"\u201CTwo teaspoons. That is how much water was in your brother. A man who drowns is FULL \u2014 foam in the airway, they call it a foam cone, it is the least poetic thing in medicine.\u201D He turns a page with one finger. \u201CYour brother was dry. He went into that ocean already finished.\u201D",portrait:"tired"},{text:"\u201CAlso his shoes were on. Tied. I have pulled eleven men out of that water and every one came up barefoot \u2014 the ocean takes shoes, it\u2019s the first thing it does.\u201D He closes the folder. \u201CManner: accident. Signed 4:40 on a Friday. I have seen faster. I have never seen tidier.\u201D",portrait:"wry"}],choices:[{text:"Then open it again",reaction:"\u201CI asked. Then I asked a second time, which in my building is once too many. A captain told me the family had been through enough, and used my first name, which he had never done before and has not done since.\u201D He leaves the photocopies on the table. He does not say keep them. He does not take them. On his way out he writes the date in a notebook.",effects:{"npc.ramirez.trust":1,"npc.ramirez.evidence":1,flags:["act1_done","r_file_seen"],montage:"Two teaspoons of water, and his shoes still tied. It was not an accident."}},{text:"You showed me this because you want something",reaction:"\u201CObviously. I\u2019m police. I don\u2019t have friends, I have a caseload.\u201D It is his usual joke and it lands about a foot short of where he threw it. He puts money on the table for a coffee he did not drink. \u201CTake the pages anyway. When you get tired of being the only person who knows, you have my number, and I have nothing else going on.\u201D",effects:{cred:2,"npc.ramirez.evidence":2,flags:["act1_done","r_file_seen","r_kept_distance"],montage:"Asked Ramirez what the file cost. He left the pages on the table anyway."}}]},r_hanging_the_show:{speaker:"ramirez",portrait:"wry",priority:10,conditions:{flagAll:["act1_done","r_elena_known"],flagNone:["r_show_open"],totalProfitGte:25e3,dealsSinceGte:3},lines:[{text:"Maria\u2019s gallery, Tuesday, three days out. A young woman is up a stepladder with a spirit level in her teeth. Her father is holding the ladder. In a suit. At four in the afternoon on a workday, which tells you his priorities and roughly what his captain thinks of them.",portrait:"neutral"},{text:"\u201CThirty prints, thirty frames.\u201D He says it the way other men say a sentence length. \u201CMuseum glass. Forty dollars a frame. I priced it. Then I priced it again in a Pearle Vision parking lot, on a pad, like an idiot, in case the first place was robbing me.\u201D",portrait:"tired"},{text:"\u201CMaria told her there\u2019s a grant. There is no grant. Fifteen years of listening to people lie, and a grant does not sound like a woman changing the subject twice.\u201D He looks at the wall instead of at you. \u201CSo here I am. Holding a ladder. In a room I would need a warrant to search.\u201D",portrait:"wry"}],choices:[{text:"Tell her",reaction:"\u201CAnd say what? Sweetheart, the frames are dirty, hang it on nails?\u201D The ladder does not move an inch while he says it. \u201CShe got ONE thing this year. She\u2019s twenty-two and she got one thing. I am not the man who takes it \u2014 and now neither are you, because I just made you a witness to me not being him.\u201D",effects:{"npc.ramirez.trust":1,flags:["r_show_open","r_grant_known"],montage:"Ramirez knows there is no grant. He is holding the ladder anyway."}},{text:"Pay for the opening. Through Maria. \u2014 $4,000",reaction:"Wine, cards, a listing in the Herald\u2019s Friday section, and a printer in Hialeah who suddenly discounts everything. Nobody tells anybody. Two weeks later Ramirez buys your coffee, which from a man who has never once bought your coffee is a full paragraph, and neither of you mentions it, ever.",effects:{cashDelta:-4e3,"npc.maria.trust":1,"npc.ramirez.trust":1,flags:["r_show_open","r_funded_show"],montage:"Paid for the opening through Maria. $4,000. Nobody said anything."}},{text:"Take the ladder. Let him go back to work.",reaction:"He looks at his own hands on the rail for a second before he lets go. Then he sits in the sedan across the street for six hours with a thermos and a notebook, working on you \u2014 which is his way of saying thank you and also his way of saying nothing has changed.",effects:{"npc.ramirez.trust":2,"npc.ramirez.evidence":1,flags:["r_show_open","r_held_ladder"],montage:"Held the ladder so a detective could get back to working your case."}}]},r_the_turn:{speaker:"ramirez",portrait:"tired",priority:12,conditions:{flag:"r_show_open",flagNone:["r_turn_done"],evidenceGte:7,dealsSinceGte:3},lines:[{text:"Four in the morning at a Denny\u2019s on Biscayne. Ramirez has the corner booth and the look of a man who rehearsed in the car. There is no file on the table. That is how you know this is not police work.",portrait:"tired"},{text:"\u201CI\u2019m going to do this badly, so I\u2019ll do it fast. I have had this conversation with eleven people. Nine of them I had something on. Two of them I liked.\u201D He turns his coffee cup a quarter turn. \u201CTonight I have nothing on you I would carry upstairs to Vance. I\u2019m asking anyway.\u201D",portrait:"tired"},{text:"\u201CSomebody I was responsible for went into that water. Not a case. A guy. He called me from a payphone every other Thursday for nine months and I bought his groceries out of my own pocket, and I have never told anybody that, including my wife, who thinks I am bad with the checkbook.\u201D His hand does something that fails to become a word. \u201CHelp me. Not as a \u2014 just help me.\u201D",portrait:"wry"}],choices:[{text:"What do you need?",reaction:"A name, a district, and a Thursday. You give him one of the three and it is true, which surprises you considerably more than it surprises him. He writes it on a napkin. Then \u2014 because he is police and cannot help it \u2014 he writes the date, the time, and the words SUBJECT VOLUNTEERED underneath.",effects:{"npc.ramirez.trust":2,"npc.ramirez.evidence":1,flags:["r_turn_done","r_helping"],montage:"Gave Ramirez one true thing at 4 AM. He wrote SUBJECT VOLUNTEERED on a napkin."}},{text:"Who was he?",reaction:"\u201CAsk me again when you can afford the answer.\u201D He puts three dollars on a four-dollar check and goes. For nine days the sedan is not behind you, and you notice, and you find that you miss it, which is a thing you are going to have to sit with later.",effects:{"npc.ramirez.trust":1,"npc.ramirez.evidence":2,flags:["r_turn_done","r_pressed_name"],montage:"Asked Ramirez who he lost. He said you couldn\u2019t afford the answer yet."}},{text:"You're recruiting me",reaction:"\u201CYes.\u201D He says it instantly, which is the worst part of the entire evening. \u201CThat is exactly what this is. I was good at it in 1979 and I am better now, and I would like you to know that I know precisely what I am doing to you while I do it.\u201D He drinks his coffee. \u201CDoes knowing help? It never helps.\u201D",effects:{cred:3,"npc.ramirez.trust":-1,"npc.ramirez.evidence":1,flags:["r_turn_done","r_named_it"],montage:"Told Ramirez you knew a recruitment when you saw one. He agreed immediately."}}]},r_confession:{speaker:"ramirez",portrait:"tired",priority:13,conditions:{flagAll:["r_turn_done","knows_ramirez_ran"],flagNone:["r_confessed"],evidenceGte:10,totalProfitGte:3e4,dealsSinceGte:2},lines:[{text:"He picks you up himself, six in the morning, and drives to a Farm Store on Bird Road and parks facing a payphone with a cracked hood. \u201CThis one,\u201D he says. \u201CNot the one by the door. This one.\u201D",portrait:"neutral"},{text:"\u201CEvery other Thursday. Nine months. He\u2019d let it ring twice and hang up so I would know to call the booth back \u2014 he got that out of a paperback and he was very proud of it.\u201D The engine ticks as it cools. \u201CC\xE9sar Vargas. He was mine. I ran him.\u201D",portrait:"tired"},{text:"\u201CI put him next to the Colombian in March because I wanted a route and a date. In July he told me he thought somebody had made him. I said give me two more weeks.\u201D He watches the payphone as though it might ring. \u201CHe gave me eleven days. Then the tide.\u201D",portrait:"wry"}],choices:[{text:"You got him killed",reaction:"\u201CYes.\u201D No hedge, no pause, nothing rehearsed. \u201CThe department\u2019s position is that he drowned. My position is that I drowned him from a Buick, eleven miles away, with a telephone.\u201D The sun comes up over a Farm Store. A man buys a lottery ticket and a banana and drives off, and the world declines to stop.",effects:{"npc.ramirez.trust":1,flags:["knows_ramirez_ran","act2_done","r_confessed"],montage:"Ramirez ran C\xE9sar. He said it in a parking lot at 6 AM and did not look away."}},{text:"Who made him?",reaction:"\u201CIf I knew that, I\u2019d have arrested a man in July and you\u2019d have a brother.\u201D He knows the shape of it \u2014 a neighborhood kept tidy, a courtesy call, a man who would think of it as MAINTENANCE \u2014 and he will not say a name he cannot spell inside a warrant. \u201CI have killed one Vargas with a guess. I am not spending another one.\u201D",effects:{"npc.ramirez.trust":1,"npc.ramirez.evidence":1,flags:["knows_ramirez_ran","act2_done","r_confessed","r_asked_who"],montage:"Asked who made C\xE9sar. Ramirez refused to guess out loud a second time."}},{text:"Let me out of the car",reaction:"He unlocks the door and does not follow. You walk two miles in dress shoes past a Zayre, a church, and a lot full of boats on trailers, and by the time you arrive anywhere you have decided nothing whatsoever. The sedan is behind you again on Wednesday. Neither of you mentions the parking lot.",effects:{cred:2,"npc.ramirez.trust":-2,"npc.ramirez.evidence":2,flags:["knows_ramirez_ran","act2_done","r_confessed","r_walked_out"],montage:"Got out of Ramirez\u2019s car on Bird Road and walked two miles in dress shoes."}}]},r_the_same_thing:{speaker:"ramirez",portrait:"neutral",priority:12,conditions:{flag:"knows_ramirez_ran",flagNone:["r_wire_done"],evidenceGte:11,dealsSinceGte:3},lines:[{text:"A one-bedroom on Northwest 12th that Metro-Dade rents by the month and furnishes with whatever the last tenant abandoned. On the table: a Nagra in a shoebox, a roll of surgical tape, and a paper plate of pastelitos, because he is not a monster.",portrait:"neutral"},{text:"\u201CI know what I\u2019m asking. I know what happened the last time I asked it. I wrote a version of this where I don\u2019t ask \u2014 I performed it for myself in the car, out loud, and it is a hell of a speech, and I did not believe one word of it.\u201D",portrait:"tired"},{text:"\u201COne meeting. He talks about a route, I have a case, and your brother stops being a DROWNING and becomes a HOMICIDE. Different file. Different building. Different clock.\u201D He taps the roll of tape. \u201CIt itches. Everybody says it itches. Nobody warns you first. So: it itches.\u201D",portrait:"wry"}],choices:[{text:"Tape it on",reaction:"Ninety minutes of a man discussing shipping schedules and his mother\u2019s hip, and one sentence in the middle worth all of it. Afterward you sit in a Burger King bathroom peeling tape off your ribs and your hands will not hold still. Ramirez waits in the lot. When you come out he says, \u201CYour brother threw up the first time,\u201D and it is the kindest thing anyone has said to you in Miami.",effects:{cred:-4,"npc.ramirez.trust":3,"npc.ramirez.evidence":-4,"npc.colombiano.trust":-2,flags:["r_wire_done","r_wore_wire"],montage:"Wore the wire for ninety minutes. Peeled it off in a Burger King bathroom."}},{text:"No. You already know how this ends.",reaction:"\u201CYeah.\u201D He doesn\u2019t argue, which is worse than arguing. He puts the Nagra in the shoebox and the shoebox on the floor and eats a pastelito standing at the counter like a man at a wake. \u201COkay. Then we do it the slow way. The slow way is me. Alone. For another eleven years.\u201D",effects:{"npc.ramirez.trust":1,flags:["r_wire_done","r_refused_wire"],montage:"Refused the wire. Ramirez put it back in the shoebox and ate a pastelito."}},{text:"Sell the ask \u2014 tell the Colombian a cop wants a wire on him",reaction:"You say it once, quietly, and it travels the way only that kind of sentence travels. By Friday a lieutenant you have never met is calling you by your first name. By Monday, Internal Review has an anonymous letter about a detective who ran an unregistered informant in July. Ramirez does not call. Ramirez does not need to.",effects:{cred:5,"npc.colombiano.trust":2,"npc.ramirez.trust":-5,"npc.ramirez.evidence":2,flags:["r_wire_done","betrayed_ramirez"],montage:"Sold Ramirez to the Colombian. Internal Review got a letter about July."}}]},r_elena_asks:{speaker:"narrator",portrait:"neutral",priority:9,conditions:{flag:"r_show_open",flagNone:["r_elena_portrait","elena_endangered"],totalProfitGte:35e3,dealsSinceGte:4},lines:[{text:"The gallery, Thursday, an hour before anybody arrives. A young woman in a paint-stained Hurricanes sweatshirt sits on the floor with thirty index cards, arranging them in an order only she can see. She does not look up. \u201CIf you\u2019re the wine guy, it\u2019s in the back. If you\u2019re not the wine guy \u2014 do you know anything about wine?\u201D",portrait:"neutral"},{text:"Elena Ramirez has a Nikon with gaffer tape on the strap lug and her father\u2019s habit of asking a question sideways. Eight months on the Overtown series. \u201CEverybody thinks it\u2019s about danger. It\u2019s about the six minutes after sunset when everybody\u2019s face is the same color as the buildings.\u201D",portrait:"neutral"},{text:"\u201CHold still. No \u2014 don\u2019t POSE, that is the entire problem with men.\u201D The shutter goes. It is a small, cheap, final sound. \u201CYou\u2019ve got a face like you\u2019re doing arithmetic. What is it you do?\u201D",portrait:"wry"}],choices:[{text:"\u201CImport\u201D",reaction:"\u201CEverybody in this city is in import.\u201D She laughs, writes IMPORT GUY on the back of an index card and clips it to a print she hasn\u2019t hung yet. That card is still clipped there in November. A federal paralegal photographs it in March.",effects:{cred:1,"npc.ramirez.evidence":1,flags:["r_elena_portrait","r_elena_lied"],montage:"Elena Ramirez photographed you and wrote IMPORT GUY on an index card."}},{text:"Step out of the frame",reaction:"You move before the second frame. She lowers the camera and looks at you the way her father looks at a witness who has just corrected a small detail. \u201COkay,\u201D she says. \u201CSorry. My dad does that too. He has been in four photographs since 1979 and he\u2019s blurry in three of them.\
