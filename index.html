ercial refrigerator blocks the sidewalk. He doesn\u2019t introduce himself. He doesn\u2019t need to.",hpLoss:[5,15],cashLoss:[100,500],chance:.12},{type:"tip",text:'Your barber puts down the scissors. "The new girl at the laundromat? She\u2019s a fed. She\u2019s been writing down plates. Yours was on the list." He picks the scissors back up. "Same as usual?"',chance:.12},{type:"tip",text:'A street kid whispers: "{d} is dirt cheap in {l} right now. Don\u2019t ask how I know."',chance:.18},{type:"bribe_offer",text:'Officer Delgado has a menu. $500 blind eye. $1,500 lost report. He does NOT accept checks. "What am I, a dentist?"',cost:[500,2e3],heatReduce:15,chance:.1},{type:"gamble",text:'A dice game behind the bodega. Three guys, a milk crate, and enough cash to buy a used Honda. "You in or you out?"',chance:.08},{type:"healer",text:"A back-alley doc who smells like rubbing alcohol and poor decisions offers to patch you up. His diploma is from a country that no longer exists.",cost:300,hpGain:30,chance:.08},{type:"snitch_warning",text:'A man on a milk crate on NW 7th is screaming about the end times. He makes eye contact. "THE WAGES OF SIN ARE DEATH!" he bellows. "BUT THE HOURLY RATE IS EXCELLENT!"',heatGain:5,chance:.07},{type:"tip",text:'A sunburned tourist in a Hawaiian shirt corners you. "Hey buddy, you know where I can get some\u2026" He does the nose-touch gesture with all the subtlety of a man wearing a Hawaiian shirt in a drug neighborhood.',chance:.1},{type:"find",text:"Someone hands you a black card with a gold address. No name. Just: TONIGHT. MIDNIGHT. BRING PRODUCT AND A SWIMSUIT. The address is a penthouse on Fisher Island.",amount:[2,8],chance:.06},{type:"snitch_warning",text:"You\u2019re cutting through the alley and there\u2019s a body. Not fresh, but not old. The suit is nice \u2014 nicer than yours. The pockets are empty except for a pager. You walk. Faster than usual.",heatGain:8,chance:.05},{type:"tip",text:"A realtor with physics-defying hair hands you a card. \u201CI have a property in Coconut Grove. The previous owner is\u2026 no longer available. There may be items in the basement you\u2019d find professionally interesting.\u201D",chance:.06},{type:"witness_defuse",text:"A kid from the block pulls you aside. \u201CThat lady from your last big deal? She\u2019s been talking to a detective. I know where she lives. Two grand and she forgets everything.\u201D",cost:2e3,chance:1},{type:"dea_defuse",text:"A courthouse clerk you know pulls you aside. \u201CThere\u2019s a wiretap warrant with your name on it. My lawyer buddy can get it killed \u2014 five grand, cash.\u201D",cost:5e3,chance:1}],G=(e,t)=>Math.floor(Math.random()*(t-e+1))+e,Wf=(e,t)=>e+Math.random()*(t-e),O=e=>(e<0?"-$":"$")+Math.abs(Math.round(e)).toLocaleString(),Ao=(e,t,n)=>Math.max(t,Math.min(n,e)),Mo=()=>{let e=1-Math.random(),t=Math.random();return Math.sqrt(-2*Math.log(e))*Math.cos(2*Math.PI*t)},h0=()=>K.map(e=>e.mean+Math.floor(Mo()*e.mean*.15)),m0=()=>K.map(()=>(Math.random()-.5)*.4),g0=(e,t,n,r,o)=>e.map((i,a)=>{let u=K[a],c=u.theta*(u.mean-i),h=u.sigma*i*Mo()*.3,k=t[a]*i*.08,y=i+c+h+k;if(n===u.name&&o){let m=o[0]+Math.random()*(o[1]-o[0]);y*=m}return Math.max(u.min*.5,Math.min(u.max*2.5,Math.round(y)))}),y0=e=>e.map(t=>Math.random()<.15?-t+Mo()*.2:Ao(t*.85+Mo()*.15,-1,1)),ep=(e,t,n,r)=>{let o=q[t];return e.map((i,a)=>{let u=K[a],c=o.priceMod[u.tier],h=1+Mo()*.05,k=n?n[a]:1,y=r?r[a]:1;return Math.max(u.min,Math.round(i*c*k*y*h))})},tp=(e,t,n)=>{if(e<=3)return 0;let i=Math.pow(Math.max(0,e-8)/40,2);return Math.min(.85,t*.5*(1+i)*n)},np=(e,t)=>Math.floor(e*.2*t)+G(200,800),No=e=>zo[e.currentEra||0],v0=(e,t)=>{let n=e%2===1,r=Ao(t/100,0,1);if(n){let o=Math.round(10+r*60),i=Math.round(15+r*5),a=Math.round(40-r*20);return`linear-gradient(180deg, rgb(${o},${i},${a}) 0%, ${l.midnight} 60%, ${l.dark} 100%)`}return r<.3?`linear-gradient(180deg, #1a1040 0%, #4a1942 20%, #c94b4b 45%, #f09819 70%, ${l.dark} 100%)`:r<.6?`linear-gradient(180deg, #1a0a20 0%, #6b2040 25%, #d44040 50%, #a04010 75%, ${l.dark} 100%)`:`linear-gradient(180deg, #200808 0%, #801515 25%, #cc2020 50%, #601010 75%, ${l.dark} 100%)`};var k0={maria_intro:{speaker:"maria",portrait:"amused",priority:15,conditions:{totalDealsGte:2,"npc.maria.met":{eq:!1},notFlag:"brick_deal_done"},lines:[{text:"The bouncer at The Flamingo waves you through like he was told to. Inside: bass so deep you feel it in your teeth. Neon. Smoke. Bodies.",portrait:"neutral"},{text:"A woman in white finds you at the bar like she\u2019s been waiting. Gold earrings. A smile that\u2019s ninety percent strategy.",portrait:"amused"},{text:'"You\u2019re the new one. C\xE9sar\u2019s friend from Panama. Everyone\u2019s talking about the idiot who rode a Greyhound into Miami with a kilo in his bag."',portrait:"amused"},{text:'"Don\u2019t worry \u2014 I like idiots. They\u2019re unpredictable. I\u2019m Maria. Buy me a drink and I\u2019ll tell you something useful."',portrait:"flirty"}],choices:[{text:"Buy her a drink",reaction:'"Smart. I knew you weren\u2019t completely stupid." She leans in. "There\u2019s a shipment coming through the Keys tomorrow. Prices are going to drop. Buy cheap there, sell in the Gables. The rich housewives pay double and never ask questions."',effects:{"npc.maria.trust":2,"npc.maria.met":!0,flags:["maria_friendly_intro"]}},{text:"I don\u2019t take drinks with strangers",reaction:'"Your loss, honey." She doesn\u2019t look offended. She looks amused, which is worse. "I don\u2019t offer twice. But you look like the kind of mistake I enjoy watching unfold. I\u2019ll be around."',effects:{"npc.maria.trust":-1,"npc.maria.met":!0,flags:["maria_cold_intro"]}}]},maria_second_chance:{speaker:"maria",portrait:"knowing",priority:10,conditions:{totalProfitGte:1e4,flag:"maria_cold_intro","npc.maria.trust":{lte:0},notFlag:"maria_recovered"},lines:[{text:"You\u2019re counting bills at a back table when someone slides into the booth opposite. Maria. No drink this time. No smile.",portrait:"neutral"},{text:'"I\u2019m going to do something I never do, which is give you a second chance. Not because I like you \u2014 because you\u2019re useful."',portrait:"knowing"},{text:'"You\u2019re buying retail like a tourist. Paying corner prices for product you could get wholesale through me. I have contacts at the port. I know which neighborhoods are buying and which are dry."',portrait:"knowing"},{text:'"So. Do you want to keep playing small, or do you want to make real money?"',portrait:"flirty"}],choices:[{text:"I\u2019m listening",reaction:'"Good. First thing \u2014 stop holding product too long. Prices change every time you move. Check what you paid versus what it\u2019s worth here. That spread is your whole life now."',effects:{"npc.maria.trust":2,flags:["maria_recovered","maria_friendly_intro"]}},{text:"I told you. I work alone.",reaction:'"Then die alone. Same difference in this town." She\u2019s gone before you can respond. The bartender looks at you like you just turned down a winning lottery ticket.',effects:{"npc.maria.trust":-1,flags:["maria_recovered"]}}]},maria_tip:{speaker:"maria",portrait:"amused",priority:9,conditions:{totalProfitGte:5e3,"npc.maria.trust":{gte:1},flag:"maria_friendly_intro",notFlag:"maria_gave_tip",dealsSinceGte:2},lines:[{text:"Your pager buzzes at 2 AM. Maria\u2019s code. You call back from a payphone that smells like bad decisions and worse cologne.",portrait:"neutral"},{text:'"I got a guy in Overtown who\u2019s dry. Crack and cocaine \u2014 he\u2019ll pay anything. And I mean anything. The man is desperate and desperate men are profitable."',portrait:"amused"},{text:'"Buy cheap anywhere else, sell there. And do it before someone else figures it out \u2014 I gave this number to two people. You\u2019re the one I like slightly more."',portrait:"flirty"}],choices:[{text:"Thanks, Maria",reaction:'"Don\u2019t thank me. C\xE9sar would\u2019ve done the same thing. Actually, C\xE9sar would\u2019ve charged me. You\u2019re already an improvement." She hangs up. The payphone smells slightly better now.',effects:{"npc.maria.trust":1,flags:["maria_gave_tip"]}}]},maria_party:{speaker:"maria",portrait:"flirty",priority:10,conditions:{credGte:10,"npc.maria.trust":{gte:2},notFlag:"maria_party_done",dealsSinceGte:3},lines:[{text:'Maria takes you to a private party in a Coral Gables mansion. The pool is shaped like a dollar sign. This is not a joke. The host is a "real estate developer" whose real estate consists primarily of cocaine warehouses.',portrait:"amused"},{text:'"See the woman in the red dress? She\u2019s a federal prosecutor. See the man she\u2019s talking to? He\u2019s her biggest defendant. They\u2019ve been sleeping together since April."',portrait:"knowing"},{text:'"This city runs on three things: cocaine, hypocrisy, and pool parties. Try the ceviche \u2014 it\u2019s actually good."',portrait:"flirty"}],choices:[{text:"Mingle with the guests",reaction:"You spend the night learning that everyone in Coral Gables is either a criminal or married to one. Several are both. Maria introduces you to people whose handshakes feel like contracts. Your cred just went up.",effects:{"npc.maria.trust":1,cred:5,flags:["maria_party_done","high_society"]}},{text:"This isn\u2019t my scene",reaction:'"Suit yourself." Maria shrugs and disappears into a crowd of people whose net worth exceeds the GDP of several Caribbean nations. You eat the ceviche alone. She was right \u2014 it\u2019s actually good.',effects:{"npc.maria.trust":-1,flags:["maria_party_done"]}}]},maria_launder:{speaker:"maria",portrait:"knowing",priority:9,conditions:{totalProfitGte:3e4,"npc.maria.trust":{gte:2},cashGte:8e3,notFlag:"maria_launder_offered"},lines:[{text:"Maria is waiting at her gallery. The paintings are aggressively terrible. A canvas splattered with what looks like ketchup has a $28,000 price tag.",portrait:"amused"},{text:'"Don\u2019t look at me like that. Art is subjective. Money laundering is objective. I can clean $5K for you right now."',portrait:"knowing"},{text:'She gestures at a painting of a sad horse. "Run it through as a sale of\u2026 this masterpiece. The IRS will never question it. Nobody wants to admit they don\u2019t understand art."',portrait:"amused"}],choices:[{text:"Launder $5,000",reaction:'"Pleasure doing business." She writes a receipt. The painting of the sad horse now has a red "SOLD" sticker. "I sold that horse four times this month. He\u2019s my best performer. Better than the Basquiat."',effects:{cashDelta:-5e3,cleanCashDelta:4500,"npc.maria.trust":1,flags:["maria_launder_offered","used_launder"]}},{text:"Not yet",reaction:'"The offer stands. The horse isn\u2019t going anywhere \u2014 nobody actually wants to own it. That\u2019s the whole point."',effects:{flags:["maria_launder_offered"]}}]},maria_personal:{speaker:"maria",portrait:"vulnerable",priority:10,conditions:{credGte:20,"npc.maria.trust":{gte:4},"npc.ramirez.met":{eq:!0},notFlag:"maria_personal_done"},lines:[{text:"3 AM. Maria\u2019s gallery. She\u2019s drinking wine from a coffee mug and her shoes are off. This is the most human you\u2019ve seen her.",portrait:"vulnerable"},{text:'"You want to know why I do this? My mother cleaned hotel rooms for twenty years. TWENTY. Her back is destroyed. She can\u2019t stand for more than ten minutes."',portrait:"angry"},{text:'"And the woman in the penthouse suite \u2014 the one whose sheets she changed every day \u2014 made her money the same way I make mine. The only difference is the number of zeros and the quality of the attorney."',portrait:"vulnerable"},{text:"She looks at you. The strategy is gone for a moment. What\u2019s underneath is more dangerous.",portrait:"vulnerable"},{text:'"Stay alive, okay? I\u2019m running out of people I actually like in this city."',portrait:"flirty"}],choices:[{text:"I\u2019m not going anywhere",reaction:'She doesn\u2019t say anything for a long time. Then: "Don\u2019t make me regret saying that." She puts her shoes back on. The strategy returns. But something behind it has shifted, and you both know it.',effects:{"npc.maria.trust":2,flags:["maria_personal_done","maria_close"]}},{text:"We\u2019re business. That\u2019s all.",reaction:'"Right. Business." She finishes the wine. The coffee mug clinks on the desk. "Of course." You\u2019ve never heard two words carry that much weight. The gallery feels colder when you leave.',effects:{"npc.maria.trust":-2,flags:["maria_personal_done","maria_rejected"]}}]},maria_react_crack:{speaker:"maria",portrait:"angry",priority:7,conditions:{"npc.maria.met":{eq:!0},"npc.maria.trust":{gte:0},productIs:"crack",notFlag:"maria_hates_crack"},lines:[{text:'Maria finds you at the bar. She\u2019s not smiling. "Crack. You\u2019re selling crack now."',portrait:"angry"},{text:'"I watched what that did to Overtown. Kids on corners. Mothers who can\u2019t remember their own names. You want to get rich? Fine. But not like that. Not around me."',portrait:"angry"}],choices:[{text:"It\u2019s just business, Maria",reaction:"\u201DMy mother said the same thing about the hotel. \u2018It\u2019s just work, Maria.\u2019 It\u2019s never just anything.\u201D She leaves her drink untouched. That\u2019s how you know it\u2019s serious.",effects:{"npc.maria.trust":-2,flags:["maria_hates_crack"]}},{text:"You\u2019re right. I\u2019ll stop.",reaction:"You\u2014\u201C She stops. Studies your face like she\u2019s looking for the lie. Doesn\u2019t find one. \u201COkay. Okay.\u201D She picks up her drink. Takes a sip. \u201CYou know, C\xE9sar would never have said that. He would\u2019ve laughed at me. You\u2019re not him. I keep forgetting that\u2019s a good thing.",effects:{"npc.maria.trust":1,flags:["maria_hates_crack","quit_crack_for_maria"]}}]},ramirez_intro:{speaker:"ramirez",portrait:"neutral",priority:15,conditions:{fedHeatGte:15,"npc.ramirez.met":{eq:!1}},lines:[{text:"Your barber stops mid-cut. Nods toward the window. Brown sedan. A man in a suit that was last fashionable during the Carter administration, drinking coffee from a thermos and reading a very thick file.",portrait:"neutral"},{text:'"That\u2019s Ramirez. Vice Intelligence. He\u2019s been out there since Tuesday."',portrait:"neutral"},{text:"You ask if he\u2019s dangerous.",portrait:"neutral"},{text:'"He\u2019s honest. In this town, that\u2019s the most dangerous thing you can be."',portrait:"neutral"}],choices:[{text:"Noted",reaction:"Your barber finishes the cut in silence. When you leave, Ramirez doesn\u2019t look up from his file. He doesn\u2019t need to. He already has your picture in it.",effects:{"npc.ramirez.met":!0,"npc.ramirez.evidence":2,flags:["ramirez_watching"]}}]},ramirez_coffee:{speaker:"ramirez",portrait:"wry",priority:10,conditions:{"npc.ramirez.met":{eq:!0},evidenceGte:3,bustsGte:1,notFlag:"ramirez_coffee",dealsSinceGte:3},lines:[{text:"He\u2019s waiting outside the caf\xE9 on Calle Ocho. Doesn\u2019t try to hide. Steps right up like you\u2019re old friends.",portrait:"neutral"},{text:'"Nice morning, isn\u2019t it? I love Miami in the spring. The weather\u2019s beautiful. The crime rate, less so. You want a coffee? I\u2019m buying."',portrait:"wry"},{text:'"Don\u2019t worry \u2014 accepting coffee from a police officer is not legally admissible. I checked."',portrait:"wry"},{text:"He smiles. It\u2019s the smile of a man who\u2019s patient in a way that should terrify you.",portrait:"neutral"},{text:'"I\u2019m not going to arrest you today. I just wanted you to know that I know. And now you know that I know. So we both know. Isn\u2019t that nice? Enjoy your coffee."',portrait:"wry"}],choices:[{text:"Drink the coffee",reaction:'Good coffee. He watches you drink it with the expression of a man who has all the time in the world. "I make $38,000 a year," he says. "The guy I was surveilling yesterday tipped a valet more than my monthly mortgage. But sure, the system works."',effects:{"npc.ramirez.evidence":1,flags:["ramirez_coffee"]}},{text:"Walk away",reaction:'"They always walk away." You hear him take a sip behind you. "That\u2019s fine. I\u2019m patient. My captain says I\u2019m \u2018turning the tide.\u2019 I\u2019ve been turning the tide for fifteen years. The tide doesn\u2019t seem to notice."',effects:{flags:["ramirez_coffee","ramirez_disrespected"]}}]},ramirez_photos:{speaker:"ramirez",portrait:"neutral",priority:10,conditions:{evidenceGte:6,flag:"ramirez_coffee",notFlag:"ramirez_photos",dealsSinceGte:3},lines:[{text:"An envelope on your windshield. No stamp. Inside: three Polaroids.",portrait:"neutral"},{text:"You, making a deal in Overtown. You, counting cash in Little Havana. You, meeting El Colombiano\u2019s lieutenant.",portrait:"neutral"},{text:'On the back of the third photo, in neat handwriting: "My daughter wants to be a photographer. I told her I\u2019m already pretty good at it. \u2014 H.R."',portrait:"wry"},{text:"The man has a sense of humor. That makes it worse.",portrait:"neutral"}],choices:[{text:"Burn the photos",reaction:"You burn them over the stove. The smoke smells like evidence and bad decisions. But you know Ramirez has copies. A man that patient always has copies.",effects:{flags:["ramirez_photos"]}},{text:"He\u2019s bluffing",reaction:'He wasn\u2019t bluffing. Somewhere in the Vice Intelligence office, Ramirez adds a note to your file: "Subject displays poor judgment under pressure." He underlines it twice.',effects:{"npc.ramirez.evidence":2,flags:["ramirez_photos","ignored_warning"]}}]},ramirez_offer:{speaker:"ramirez",portrait:"tired",priority:12,conditions:{evidenceGte:10,notFlag:"ramirez_deal_offered",dealsSinceGte:3},lines:[{text:"He calls from a payphone. You can hear traffic. He sounds tired.",portrait:"tired"},{text:'"Alright, let\u2019s skip the part where I pretend this is a social call. I have enough on you for fifteen to twenty. Federal. The Colombians, the laundering, the whole circus."',portrait:"neutral"},{text:'"But here\u2019s the thing \u2014 I don\u2019t want you. You\u2019re not the prize. You\u2019re the door."',portrait:"tired"},{text:'"Give me El Colombiano. Real intel. Shipment dates, routes, contacts. In exchange, your file goes in a drawer that doesn\u2019t get opened. You walk away clean. Maybe not morally clean, but legally clean, and in Miami that\u2019s the best anyone can hope for."',portrait:"wry"}],choices:[{text:"Become an informant",reaction:'"Smart. Or desperate. Either way, we have a deal." A pause. Coffee being sipped. "I\u2019ll be in touch. And for what it\u2019s worth? You made the right call. The other option involved handcuffs and a prison in Coleman, Florida. It\u2019s two hours from Miami. You can almost smell the ocean on humid days."',effects:{"npc.ramirez.trust":5,"npc.colombiano.trust":-3,flags:["ramirez_deal_offered","became_informant"]}},{text:"Go to hell, Ramirez",reaction:'"I figured you\u2019d say that. They always say that. And then about six months from now, when the walls are really closing in, you\u2019ll wish you\u2019d taken the deal. My number hasn\u2019t changed. It won\u2019t." He hangs up. You hear him start his car. The engine takes three tries. Even his car is exhausted.',effects:{"npc.ramirez.evidence":3,flags:["ramirez_deal_offered","refused_ramirez"]}}]},ramirez_bribe:{speaker:"ramirez",portrait:"tired",priority:9,conditions:{evidenceGte:8,fedHeatGte:30,notFlag:"ramirez_bribe_done",cashGte:5e3,dealsSinceGte:3},lines:[{text:"A parking garage in Brickell. Ramirez looks like he hasn\u2019t slept in a week.",portrait:"tired"},{text:'"Twenty years. Twenty years of doing this the right way. You know what the right way has gotten me? A pension I can\u2019t retire on, a wife who left, and an apartment in Hialeah with a view of a parking lot."',portrait:"tired"},{text:"He stares at the envelope you\u2019re holding.",portrait:"vulnerable"},{text:'"$5,000 and I lose some paperwork. Not all of it. Some. You buy yourself six months, maybe eight. I buy my daughter another semester at UF."',portrait:"vulnerable"},{text:"His hand is shaking. This is not a man who does this. This is a man who\u2019s breaking in real-time.",portrait:"tired"}],choices:[{text:"Give him the envelope",reaction:'He takes the envelope without counting it. Puts it inside his jacket like it\u2019s radioactive. "We never met. This never happened. And for the record? I hate you for this. Not as much as I hate myself, but you\u2019re a close second."',effects:{cashDelta:-5e3,"npc.ramirez.evidence":-5,flags:["ramirez_bribe_done","bribed_ramirez"]}},{text:"Walk away",reaction:"You leave the envelope in your pocket. Ramirez watches you go. He looks relieved and devastated in equal measure. Three weeks later, you hear he bought his daughter a used Toyota Corolla. She\u2019s the only person in this story who gets a happy ending.",effects:{flags:["ramirez_bribe_done","spared_ramirez"]}}]},colombiano_intro:{speaker:"colombiano",portrait:"neutral",priority:15,conditions:{totalProfitGte:25e3,"npc.colombiano.met":{eq:!1}},lines:[{text:"The caf\xE9 smells like Cuban coffee and destiny. An old man is playing chess in the corner. Two young men in guayaberas stand near the door, not eating, not drinking, just watching.",portrait:"neutral"},{text:"The man at the back table waves you over like he\u2019s been expecting you since you were born.",portrait:"neutral"},{text:'"Sit. Eat something. The croquetas here are excellent \u2014 I should know, I own the building."',portrait:"amused"},{text:"He studies you the way a jeweler studies a stone. Deciding if you\u2019re worth cutting.",portrait:"cold"},{text:'"I know everything about you. What you buy, what you sell, where you sell it, and how much you make doing it. Don\u2019t be offended \u2014 I know this about everyone. It\u2019s how I stay alive."',portrait:"cold"},{text:'"Now. Let\u2019s discuss whether you\u2019re going to work with me, work for me, or become a cautionary anecdote I tell at dinner parties. I\u2019m hoping for option one. Option three means I have to find someone to clean the upholstery in my car, and good detailers are surprisingly hard to find in this city."',portrait:"amused"}],choices:[{text:"Let\u2019s talk business",reaction:'"Good. I prefer option one." He pushes a plate of croquetas toward you. "In Colombia, we have a saying: \u2018The cemeteries are full of indispensable men.\u2019 I find it motivating. You should too. Eat. We have much to discuss."',effects:{"npc.colombiano.trust":2,"npc.colombiano.met":!0,flags:["colombiano_friendly"]}},{text:"I work alone",reaction:'"Everyone works alone. Until they don\u2019t." He takes a bite of a croqueta. He doesn\u2019t look angry. That\u2019s worse than angry. "I offered you partnership. You chose pride. Pride is expensive in this city. I should know \u2014 I sell the thing that makes people feel it."',effects:{"npc.colombiano.trust":-2,"npc.colombiano.met":!0,flags:["colombiano_rejected"]}}]},colombiano_second:{speaker:"colombiano",portrait:"cold",priority:10,conditions:{totalProfitGte:4e4,flag:"colombiano_rejected","npc.colombiano.trust":{lte:0},notFlag:"colombiano_recovered"},lines:[{text:"A man in a guayabera is waiting outside your safe house. He doesn\u2019t speak. He hands you a phone.",portrait:"neutral"},{text:'"I hear you\u2019re independent. I respect that. But independent men in my territory pay a tax. Think of it as\u2026 rent."',portrait:"cold"},{text:'"Or \u2014 and I suggest you consider this carefully \u2014 we can renegotiate. I supply you product at cost. You sell it. We split the profit. Everybody wins. Especially me, but that\u2019s how business works."',portrait:"amused"}],choices:[{text:"Accept the deal",reaction:'"Wise. I\u2019ll send product tomorrow. Don\u2019t disappoint me. The last person who disappointed me is currently explaining himself to God. Or the devil. I\u2019m not sure which one handles middle management."',effects:{"npc.colombiano.trust":2,flags:["colombiano_recovered","colombiano_friendly"]}},{text:"I\u2019ll pay the tax",reaction:'"The tax is 30% of everything you move through my territory. Starting now." A pause. "You Americans. You think \u2018drug lord\u2019 is a job title. It\u2019s not. It\u2019s a temporary medical condition." He hangs up.',effects:{"npc.colombiano.trust":0,flags:["colombiano_recovered","colombiano_taxed"]}}]},colombiano_gift:{speaker:"colombiano",portrait:"amused",priority:10,conditions:{biggestDealGte:1e4,"npc.colombiano.trust":{gte:1},flag:"colombiano_friendly",notFlag:"colombiano_gift",dealsSinceGte:3},lines:[{text:"A man you\u2019ve never seen delivers a briefcase to your safe house. Inside: 10 kilos of uncut cocaine packed in coffee bags.",portrait:"neutral"},{text:"A handwritten note on monogrammed stationery:",portrait:"neutral"},{text:'"A sample. Sell it as you see fit. Return the briefcase \u2014 it\u2019s Italian leather and I\u2019m sentimental. If you\u2019re successful, we\u2019ll talk about volume. If you\u2019re not, I\u2019ll assume you were eaten by an alligator. It happens more often than you\u2019d think."',portrait:"amused"}],choices:[{text:"Sell the product",reaction:'You move the product in two days. The briefcase is returned with a note: "Good. We talk Tuesday." Tuesday arrives. So does more product. This is how empires begin \u2014 not with a bang, but with a briefcase.',effects:{invDelta:{drug:"cocaine",qty:5},"npc.colombiano.trust":1,flags:["colombiano_gift","took_product"]}},{text:"Return it untouched",reaction:"The briefcase comes back full. No note. No phone call. Nothing. In El Colombiano\u2019s world, silence is louder than a gunshot. You\u2019ve made your position clear. So has he.",effects:{"npc.colombiano.trust":-1,flags:["colombiano_gift","returned_product"]}}]},colombiano_zoo:{speaker:"colombiano",portrait:"amused",priority:10,conditions:{credGte:25,"npc.colombiano.trust":{gte:3},notFlag:"colombiano_zoo",dealsSinceGte:3},lines:[{text:'El Colombiano invites you to his compound. It is insane. A waterfall in the foyer. A pool shaped like Colombia. An actual, literal Bengal tiger named "Capitalism" roaming the grounds.',portrait:"neutral"},{text:'"People ask why I keep a tiger. I tell them it\u2019s a metaphor. They nod like they understand. They don\u2019t. There is no metaphor. I just like tigers. A man should have hobbies."',portrait:"amused"},{text:"Over dinner \u2014 lobster, obviously \u2014 he outlines his vision:",portrait:"neutral"},{text:'"Crack is the future. Powder cocaine is a luxury product. Crack is a consumer product. I didn\u2019t go to business school, but I understand the difference between selling Champagne and selling beer. Beer moves faster."',portrait:"cold"}],choices:[{text:"Join the crack business",reaction:'"Welcome to the future." He raises his glass. Capitalism the tiger yawns in the background. "Beer moves faster, my friend. And in this city, speed is everything." The lobster is excellent. Everything about this evening is excellent. That should worry you more than it does.',effects:{"npc.colombiano.trust":3,flags:["colombiano_zoo","crack_partner"]}},{text:"Stay independent",reaction:'"Independence. How American." He cuts his lobster with surgical precision. "I respect it. For now. But the market is changing, and men who don\u2019t change with it become\u2026 what\u2019s the English word? Obsolete. I learned that from a business magazine. In prison."',effects:{"npc.colombiano.trust":-2,flags:["colombiano_zoo","stayed_independent"]}}]},first_big_sale:{speaker:"narrator",priority:4,conditions:{biggestDealGte:5e3,notFlag:"ev_big_sale"},lines:[{text:"Word travels fast on these streets. Corner boys nod when you pass. Barbers know your name. You just became someone worth talking about \u2014 and someone worth watching."}],choices:[{text:"x",effects:{flags:["ev_big_sale"]}}]},ten_k_milestone:{speaker:"maria",portrait:"amused",priority:8,conditions:{cashGte:1e4,"npc.maria.met":{eq:!0},"npc.maria.trust":{gte:0},notFlag:"ev_ten_k"},lines:[{text:"Maria spots you at a back table, counting bills. She slides into the booth.",portrait:"amused"},{text:'"Ten grand. Not bad for someone who showed up from Panama with one brick and a matchbook." She steals one of your french fries.',portrait:"flirty"},{text:'"You know what you should do? Pay off that debt. Tibur\xF3n\u2019s interest is eating you alive. The shark doesn\u2019t stop circling just because you\u2019re swimming faster."',portrait:"knowing"}],choices:[{text:"Solid advice",reaction:'"I\u2019m full of it." She pauses. "The advice, I mean. Well \u2014 both." She steals another fry and disappears back into the neon.',effects:{"npc.maria.trust":1,flags:["ev_ten_k"]}}]},debt_paid:{speaker:"narrator",priority:5,conditions:{debtLte:0,totalDealsGte:3,notFlag:"ev_debt_free"},lines:[{text:'The loan shark\u2019s man nods when you hand over the last payment. "Tibur\xF3n says we\u2019re square. Don\u2019t make him regret it." For the first time since you got off that bus, nobody owns a piece of you.'}],choices:[{text:"x",effects:{flags:["ev_debt_free"]}}]},first_bust_react:{speaker:"ramirez",portrait:"wry",priority:8,conditions:{bustsGte:1,"npc.ramirez.met":{eq:!0},notFlag:"ev_first_bust"},lines:[{text:"A note appears under your door. Ramirez\u2019s handwriting.",portrait:"neutral"},{text:'"Heard you had a run-in with the boys in blue. That\u2019s going in your file \u2014 and mine. Every time you get caught, my case gets easier. You\u2019re doing my job for me. \u2014 H.R."',portrait:"wry"},{text:'"P.S. \u2014 Maybe try smaller deals in quieter neighborhoods. Or don\u2019t. I get overtime either way."',portrait:"wry"}],choices:[{text:"Crumple the note",reaction:"But you read it twice first. He\u2019s not wrong.",effects:{"npc.ramirez.evidence":1,flags:["ev_first_bust"]}}]},colombiano_notices:{speaker:"colombiano",portrait:"amused",priority:7,conditions:{"npc.colombiano.met":{eq:!0},biggestDealGte:3e4,notFlag:"ev_col_notice"},lines:[{text:'Your pager buzzes. Unfamiliar number. The message is three words: "Impressive. \u2014 E.C."',portrait:"amused"},{text:"El Colombiano is paying attention. In this business, that\u2019s either the best thing that can happen to you or the worst. There is no middle ground.",portrait:"neutral"}],choices:[{text:"Let him watch",reaction:'A second message arrives an hour later: "I\u2019m watching. Keep impressing me." You can\u2019t tell if it\u2019s a compliment or a threat. In El Colombiano\u2019s world, they\u2019re the same thing.',effects:{"npc.colombiano.trust":1,flags:["ev_col_notice"]}}]},milestone_week_one:{speaker:"narrator",priority:4,conditions:{totalProfitGte:1e4,notFlag:"ms_week1"},lines:[{text:"Week one. Still alive. The bus terminal feels like a lifetime ago. You\u2019re starting to learn the rhythms \u2014 which corners are safe, which cops are blind, which prices mean money."}],choices:[{text:"x",effects:{flags:["ms_week1"]}}]},milestone_ramirez_knows:{speaker:"narrator",priority:4,conditions:{"npc.ramirez.evidence":{gte:5},notFlag:"ms_ramirez"},lines:[{text:"A surveillance photo slips out of a file folder at the Vice Intelligence office. Your face. Circled in red. Detective Ramirez knows what you look like now."}],choices:[{text:"x",effects:{flags:["ms_ramirez"]}}]},milestone_crossroads:{speaker:"narrator",priority:4,conditions:{credGte:20,fedHeatGte:25,notFlag:"ms_crossroads"},lines:[{text:"Halfway. The city wants to know: are you a businessman or a criminal? The answer used to be obvious. It isn\u2019t anymore."}],choices:[{text:"x",effects:{flags:["ms_crossroads"]}}]},flav_bank:{speaker:"narrator",priority:2,conditions:{totalProfitGte:3e3,notFlag:"f_bank"},lines:[{text:'\u{1F4FB} First National ordered a second vault. "It\u2019s a good problem," says the manager who definitely knows where the cash comes from.'}],choices:[{text:"x",effects:{flags:["f_bank"]}}]},flav_mutiny:{speaker:"narrator",priority:2,conditions:{totalDealsGte:4,locIs:0,notFlag:"f_mutiny"},lines:[{text:"The Mutiny Hotel on Biscayne is the center of everything. Judges dance with dealers. Senators have reserved tables. The bathrooms have seen more crime than most courthouses."}],choices:[{text:"x",effects:{flags:["f_mutiny"]}}]},flav_stirrers:{speaker:"narrator",priority:1,conditions:{totalDealsGte:5,notFlag:"f_stirrers"},lines:[{text:"\u{1F4FB} The McDonald\u2019s on Biscayne keeps running out of coffee stirrers. They\u2019re not being used for coffee. The sign says ONE PER CUSTOMER. It doesn\u2019t help."}],choices:[{text:"x",effects:{flags:["f_stirrers"]}}]},flav_lambos:{speaker:"narrator",priority:1,conditions:{totalProfitGte:4e3,notFlag:"f_lambos"},lines:[{text:'A man bought twelve Lamborghinis this week. Cash. The dealer asked about his family. "The largest," the man said. He wasn\u2019t talking about relatives.'}],choices:[{text:"x",effects:{flags:["f_lambos"]}}]},flav_speedboat:{speaker:"narrator",priority:1,conditions:{totalDealsGte:5,locIs:5,notFlag:"f_speed"},lines:[{text:"A guy in the Keys races cigarette boats by day, runs product by night. Three championships. DEA\u2019s been chasing him four years. Last Tuesday he outran their fastest boat. He waved."}],choices:[{text:"x",effects:{flags:["f_speed"]}}]},flav_godmother:{speaker:"narrator",priority:1,conditions:{totalProfitGte:8e3,notFlag:"f_godmother"},lines:[{text:"\u{1F4FB} Before El Colombiano, there was La Madrina. She ran the pipeline like a Fortune 500 \u2014 org charts, performance reviews, mandatory vacation. Also murder. Lots of murder."}],choices:[{text:"x",effects:{flags:["f_godmother"]}}]},flav_banker:{speaker:"narrator",priority:1,conditions:{totalProfitGte:15e3,notFlag:"f_banker"},lines:[{text:"There\u2019s a banker in Brickell who processes $50 million a week in \u2018international transfers.\u2019 He wears khakis and a polo. Drives a Volvo. Most successful money launderer in American history. The Volvo is a nice touch."}],choices:[{text:"x",effects:{flags:["f_banker"]}}]},flav_burger:{speaker:"narrator",priority:2,conditions:{totalProfitGte:5e4,notFlag:"f_burger"},lines:[{text:'\u{1F4FB} The Dade County ME rented a refrigerated Burger King trailer to store bodies. "We\u2019re running out of room," he told the Herald. "We\u2019re also running out of hope, but room is the more immediate problem."'}],choices:[{text:"x",effects:{flags:["f_burger"]}}]},flav_doctor:{speaker:"narrator",priority:1,conditions:{totalProfitGte:3e4,notFlag:"f_doctor"},lines:[{text:"The ME\u2019s office started abbreviating cause of death. \u2018GSW-DC\u2019 means \u2018gunshot wound, drug-related, Colombian.\u2019 It saves time. There are a lot of forms."}],choices:[{text:"x",effects:{flags:["f_doctor"]}}]},flav_vice:{speaker:"narrator",priority:1,conditions:{totalDealsGte:5,locIs:0,notFlag:"f_vice"},lines:[{text:"Two undercover detectives working the waterfront. One drives a Ferrari. The other wears Armani. Their boss doesn\u2019t ask questions. Their informants don\u2019t last long."}],choices:[{text:"x",effects:{flags:["f_vice"]}}]},faction_dispute:{speaker:"colombiano",portrait:"cold",priority:13,conditions:{"npc.colombiano.met":{eq:!0},credGte:50,eraGte:2,notFlag:"faction_chosen",dealsSinceGte:3},lines:[{text:"El Colombiano is waiting at a different caf\xE9. No croquetas this time. Two men stand behind him \u2014 one in a Medell\xEDn jersey, one in a Cali polo. They don\u2019t look at each other.",portrait:"cold"},{text:'"The pipeline has split. Medell\xEDn and Cali are at war over the routes. Everyone in Miami has to choose a side."',portrait:"neutral"},{text:'"Medell\xEDn: cheap product, reliable volume. But the Cali people will mark you. And Medell\xEDn\u2019s heat is\u2026 significant. They are not subtle men."',portrait:"amused"},{text:'"Cali: better quality, higher margins. But supply is unpredictable, and Medell\xEDn will cut you off overnight. You\u2019ll never buy wholesale from them again."',portrait:"cold"},{text:'"Or choose neither. Keep your independence. Both sides will respect it \u2014 for a while. Eventually, neutrality becomes a position they can\u2019t afford to tolerate."',portrait:"cold"}],choices:[{text:"\u{1F1E8}\u{1F1F4} Medell\xEDn \u2014 volume and loyalty",reaction:'"Medell\xEDn it is. Pablo will be pleased. Volume starts tomorrow \u2014 wholesale, 30% under street." He pauses. "The Cali people will know by sundown. Watch your back. They have long memories and short fuses."',effects:{"npc.colombiano.trust":2,flags:["faction_chosen","faction_medellin"]}},{text:"\u{1F3D4}\uFE0F Cali \u2014 quality and margins",reaction:'"Interesting. The Cali gentlemen are\u2026 more refined. Better product, better lawyers. Medell\xEDn will be furious, but Medell\xEDn is always furious about something." He doesn\u2019t look happy. His loyalty was always Medell\xEDn.',effects:{"npc.colombiano.trust":-1,flags:["faction_chosen","faction_cali"]}},{text:"\u{1F43A} Neither \u2014 I work alone",reaction:'"The lone wolf. Romantic. Impractical. But I respect it." He stands. "You have maybe three months before one side or the other decides neutrality is a luxury they can\u2019t afford. Use the time wisely."',effects:{flags:["faction_chosen","faction_independent"]}}]},faction_medellin_heat:{speaker:"colombiano",portrait:"cold",priority:11,conditions:{flag:"faction_medellin",fedHeatGte:50,totalProfitGte:2e5,notFlag:"faction_downstream",dealsSinceGte:5},lines:[{text:'The call comes at 3 AM. El Colombiano sounds like he\u2019s been running. "Medell\xEDn got hit. DEA coordinated raids across three countries. The pipeline is gone."',portrait:"cold"},{text:'"Your supply chain just evaporated. Everything you were getting wholesale? Gone. You\u2019re buying retail like a tourist now."',portrait:"cold"},{text:'"There\u2019s one way out. Hoffman \u2014 the DEA agent. He\u2019s offering deals to anyone who\u2019ll flip. You could walk away clean. Or you could ride this out and rebuild."',portrait:"neutral"}],choices:[{text:"\u{1F91D} Call Hoffman \u2014 time to cooperate",reaction:'Hoffman answers on the first ring. He was expecting your call. "Welcome to the winning team," he says. It doesn\u2019t feel like winning.',effects:{flags:["faction_downstream","became_informant","hoffman_cooperated","protected_informant"]}},{text:"\u{1F4AA} Ride it out \u2014 I\u2019ll find new supply",reaction:'El Colombiano laughs. It\u2019s not a happy laugh. "You\u2019re either brave or stupid. In Miami, the difference doesn\u2019t matter much. Good luck." The line goes dead.',effects:{flags:["faction_downstream","medellin_collapsed"]}}]},faction_cali_squeeze:{speaker:"colombiano",portrait:"amused",priority:11,conditions:{flag:"faction_cali",totalProfitGte:2e5,notFlag:"faction_downstream",dealsSinceGte:5},lines:[{text:'A man you don\u2019t recognize shows up at your spot. Pressed suit. Briefcase. Cali accent. "The organization has reviewed your performance. It\u2019s been\u2026 adequate."',portrait:"neutral"},{text:'"Going forward, we require 40% of all revenue from product we supply. Non-negotiable. This is the cost of quality."',portrait:"cold"},{text:'"Alternatively, you can return to buying on the street like an amateur. We\u2019ll find someone else. There\u2019s always someone else."',portrait:"cold"}],choices:[{text:"\u{1F4B0} Pay the 40% \u2014 keep the supply",reaction:'"Wise." He opens the briefcase. Inside: paperwork. Actual paperwork. The Cali cartel has accountants. Of course they do. You just became a franchise.',effects:{flags:["faction_downstream","cali_franchise"]}},{text:"\u{1F595} Walk away \u2014 nobody owns me",reaction:'He closes the briefcase with a click that sounds expensive. "A shame. You had potential." By morning, every Cali contact in your phone is disconnected. You\u2019re on your own.',effects:{"npc.colombiano.trust":-2,flags:["faction_downstream","cali_rejected"]}}]},faction_lone_wolf:{speaker:"narrator",priority:8,conditions:{flag:"faction_independent",totalProfitGte:15e4,notFlag:"faction_downstream",dealsSinceGte:5},lines:[{text:'A note under your door: "PICK A SIDE." No signature. The handwriting is Colombian. Both cartels are running out of patience with your neutrality. Prices are rising. Suppliers are nervous. The lone wolf winter is coming.'}],choices:[{text:"x",effects:{flags:["faction_downstream","lone_wolf_pressure"]}}]},informant_first_task:{speaker:"ramirez",portrait:"wry",priority:14,conditions:{flag:"became_informant",notFlag:"informant_task_1",dealsSinceGte:2},lines:[{text:'Ramirez calls from a different payphone. Paranoid now. "First job. I need names. The people you buy from \u2014 locations, times, quantities. Write it down. Leave it in the newspaper box on 4th and Flagler."',portrait:"neutral"},{text:'"And choose carefully what you give me. Give me garbage and I\u2019ll know. Give me gold and your contacts start disappearing. Either way, you\u2019re the one who has to live with the consequences."',portrait:"wry"}],choices:[{text:"\u{1F400} Give him real intel \u2014 burn a supplier",reaction:"You write down the address in Little Havana. Two days later, the building is empty. Ramirez got his raid. Your supplier is gone. So is your cheapest source.",effects:{"npc.ramirez.evidence":{gte:0},flags:["informant_task_1","burned_supplier"],cred:-5}},{text:"\u{1F4DD} Give him garbage \u2014 buy time",reaction:"You write down a fake address. Ramirez will figure it out in a week, maybe two. You bought yourself time. But the clock is still ticking.",effects:{flags:["informant_task_1","gave_garbage"]}}]},informant_second_task:{speaker:"ramirez",portrait:"tired",priority:14,conditions:{flag:"informant_task_1",notFlag:"informant_task_2",totalDealsGte:5},lines:[{text:'Ramirez again. He sounds different this time. Tired. "I need more. My captain wants a name. A real one. Not a corner boy \u2014 someone who matters."',portrait:"tired"},{text:'"El Colombiano. Maria Santos. Pick one. I need to give them somebody or they pull my funding and we both go down."',portrait:"neutral"}],choices:[{text:"\u{1F1E8}\u{1F1F4} Give him El Colombiano",reaction:'"Colombiano." Ramirez writes it down. His hand is steady. Yours isn\u2019t. "That\u2019s a big fish. If this checks out, your file goes in the shredder. If it doesn\u2019t, Coleman Federal Penitentiary has a bed with your name on it."',effects:{"npc.colombiano.trust":-8,flags:["informant_task_2","burned_colombiano"]}},{text:"\u{1F483} Give him Maria",reaction:'The word tastes like ash. "Santos." Ramirez pauses. "The socialite? She\u2019s connected to half the judges in Dade County." A longer pause. "This is either very brave or very stupid. I\u2019ll take it."',effects:{"npc.maria.trust":-10,flags:["informant_task_2","burned_maria"]}},{text:"\u{1F910} Refuse \u2014 I\u2019m not burning anyone",reaction:'"Then we have a problem." Ramirez\u2019s voice goes flat. "You signed up for this. There\u2019s no halfway. Evidence goes back in the active file. You have maybe two weeks before the grand jury sees it."',effects:{"npc.ramirez.evidence":5,flags:["informant_task_2","refused_to_burn"]}}]},informant_discovered:{speaker:"colombiano",portrait:"cold",priority:15,conditions:{flag:"became_informant","npc.colombiano.trust":{lte:-3},"npc.colombiano.met":{eq:!0},notFlag:"informant_exposure",dealsSinceGte:3},lines:[{text:"No phone call this time. A car pulls up beside you. The window rolls down. El Colombiano is in the back seat. He doesn\u2019t look angry. That\u2019s worse.",portrait:"cold"},{text:'"I know what you\u2019ve been doing. Who you\u2019ve been talking to. The newspaper box on 4th and Flagler \u2014 did you think nobody was watching?"',portrait:"cold"},{text:'"In Colombia, we have a word for what you are. But I won\u2019t say it. Words are cheap. Consequences are expensive."',portrait:"cold"},{text:'"You have until tomorrow to leave Miami. After that, the conversation changes. And I won\u2019t be the one having it."',portrait:"cold"}],choices:[{text:"Run \u2014 get out NOW",reaction:"You don\u2019t go home. You don\u2019t pack. You drive straight to the airport with whatever\u2019s in your pockets. The Caymans flight leaves in two hours. If you\u2019re alive when it takes off, you win.",effects:{flags:["informant_exposure","burned_must_flee"]}},{text:"Call Hoffman \u2014 I need protection",reaction:'Hoffman answers. "How bad?" You tell him. A long silence. "Stay in public places. I\u2019ll have a marshal at your location in four hours. Don\u2019t go anywhere alone." The next four hours are the longest of your life.',effects:{flags:["informant_exposure","hoffman_protection"]}}]},maria_betrayal_react:{speaker:"maria",portrait:"angry",priority:14,conditions:{flag:"burned_maria","npc.maria.met":{eq:!0},notFlag:"maria_betrayal_done",dealsSinceGte:2},lines:[{text:"Maria is waiting outside your apartment. She\u2019s not wearing white. She\u2019s wearing black. She looks like a funeral.",portrait:"angry"},{text:'"You gave Ramirez my name." It\u2019s not a question. "I had lawyers lined up in twenty minutes. The charges won\u2019t stick \u2014 I\u2019m not stupid. But my reputation? That takes longer to fix than a federal case."',portrait:"angry"},{text:'"We\u2019re done. Not business-done. Done-done. I hope whatever Ramirez offered you was worth it. Because everything I could have given you \u2014 the contacts, the intel, the laundering, the future we were building \u2014 that\u2019s gone. Permanently."',portrait:"vulnerable"},{text:"She leaves. She doesn\u2019t slam the door. She closes it quietly. That\u2019s how you know it\u2019s real.",portrait:"neutral"}],choices:[{text:"Watch her go",reaction:"The gallery closes the next week. Maria Santos leaves Miami six months later. You hear she\u2019s in Cartagena. She doesn\u2019t leave a forwarding address.",effects:{"npc.maria.trust":-10,"npc.maria.active":!1,flags:["maria_betrayal_done","maria_gone"]}}]},colombiano_betrayal_react:{speaker:"narrator",portrait:"neutral",priority:14,conditions:{flag:"burned_colombiano",notFlag:"colombiano_betrayal_done",dealsSinceGte:2},lines:[{text:"El Colombiano was arrested at dawn. Federal marshals. Three SUVs. The tiger was tranquilized and relocated to a zoo in Tampa. Colombiano\u2019s attorney says it\u2019s a \u201Cmisunderstanding.\u201D The 47 kilos found in the pool house suggest otherwise. The streets know who talked. Your name isn\u2019t safe anymore."}],choices:[{text:"x",effects:{"npc.colombiano.alive":!1,flags:["colombiano_betrayal_done","colombiano_arrested"],cred:-15}}]},colombiano_personal:{speaker:"colombiano",portrait:"amused",priority:10,conditions:{"npc.colombiano.trust":{gte:2},flag:"colombiano_friendly",credGte:35,notFlag:"colombiano_personal_done",dealsSinceGte:3},lines:[{text:"El Colombiano is drunk. You\u2019ve never seen him drunk. He\u2019s sitting by the pool \u2014 the one shaped like Colombia \u2014 staring at the shallow end where Bogot\xE1 would be.",portrait:"neutral"},{text:"My daughter turned seven today. Or maybe eight. I don\u2019t know anymore. Her mother sends photos. I can\u2019t open them.",portrait:"neutral"},{text:"You know why I left? Not the police. Not the cartels. My brother. He was a teacher. A real one \u2014 chalk on his hands, terrible salary, happy. They killed him for his car. A 1979 Toyota. Not even a good car.",portrait:"cold"},{text:"I decided that if the world was going to be cruel, I would be the one holding the knife. Not the other way around.\u201D He finishes his drink. \u201CDon\u2019t feel sorry for me. Feel sorry for the people who made me necessary.",portrait:"cold"}],choices:[{text:"That\u2019s a hell of a reason",reaction:"\u201DEvery reason is a hell of a reason in Colombia.\u201D He stands. Capitalism the tiger pads over and leans against his leg like a housecat. \u201CI named him Capitalism because he eats everything in sight and feels nothing. I find it educational.\u201D He almost smiles. Almost.",effects:{"npc.colombiano.trust":2,flags:["colombiano_personal_done"]}},{text:"You could still call her",reaction:"\u201DAnd say what? \u2018Happy birthday, your father is a narcotics trafficker who lives with a Bengal tiger in Miami\u2019? Some things are kinder left unsaid.\u201D He scratches Capitalism behind the ears. The tiger purrs. It\u2019s the saddest sound you\u2019ve ever heard.",effects:{"npc.colombiano.trust":1,flags:["colombiano_personal_done"]}}]},maria_rising:{speaker:"maria",portrait:"knowing",priority:9,conditions:{"npc.maria.trust":{gte:3},credGte:15,notFlag:"maria_rising_done",dealsSinceGte:3},lines:[{text:"Maria meets you at the marina. She\u2019s watching a yacht pull out \u2014 some banker\u2019s boat, all teak and tax evasion.",portrait:"neutral"},{text:"You\u2019re getting big. That\u2019s good and terrible. Good because money. Terrible because the bigger you get, the more people need you to fall.",portrait:"knowing"},{text:"Ramirez needs a case. The Colombians need a scapegoat. The Cali people need a competitor to disappear. And everybody needs someone to blame when the music stops.",portrait:"knowing"},{text:"I\u2019m telling you this because\u2014\u201C She stops. Watches the yacht. \u201CBecause I\u2019d rather not attend your funeral. The catering is always terrible at those things.",portrait:"amused"}],choices:[{text:"You worried about me?",reaction:"Worried is a strong word. \u2018Strategically concerned\u2019 is more accurate.\u201D She steals your sunglasses, puts them on. \u201CKeep these. You\u2019ll need them. The future is very bright, and very dangerous, and you should look good while it kills you.",effects:{"npc.maria.trust":1,flags:["maria_rising_done"]}},{text:"I can handle it",reaction:"That\u2019s what C\xE9sar said. C\xE9sar is currently decomposing in a cemetery in Hialeah.\u201D A pause. \u201CBut sure. You can handle it.\u201D She takes a sip of your coffee. \u201CI\u2019ll be at the gallery if you need someone to identify the body.",effects:{flags:["maria_rising_done"]}}]},maria_notices_lifestyle:{speaker:"maria",portrait:"amused",priority:7,conditions:{"npc.maria.met":{eq:!0},"npc.maria.trust":{gte:1},lifestyleHas:"car",notFlag:"maria_lifestyle_react"},lines:[{text:"Maria sees the Countach parked outside. She walks around it once. Twice. Runs a finger along the hood.",portrait:"amused"},{text:"A Lamborghini. How wonderfully subtle. You might as well tattoo \u2018DRUG MONEY\u2019 on your forehead. At least the forehead tattoo is free.",portrait:"knowing"},{text:"Every cop in Dade County is going to see this car and think \u2018probable cause on wheels.\u2019 Ramirez is going to love it. He\u2019ll probably take a photo for his file.",portrait:"amused"}],choices:[{text:"You like it though",reaction:"It\u2019s gorgeous. It\u2019s also the dumbest purchase in the history of crime, and I say that as someone who once watched a man buy a gold-plated AK-47.\u201D She opens the passenger door. \u201CTake me to dinner. Somewhere expensive. If you\u2019re going to be stupid, at least be stupid with company.",effects:{"npc.maria.trust":1,flags:["maria_lifestyle_react"]}},{text:"It\u2019s an investment",reaction:"In what? Your own arrest?\u201D She laughs. It\u2019s a real laugh. \u201CFine. Keep your investment. But when Ramirez pulls you over \u2014 and he will \u2014 remember that I told you so. I always tell you so. It\u2019s my most attractive quality.",effects:{flags:["maria_lifestyle_react"]}}]},colombiano_notices_lifestyle:{speaker:"colombiano",portrait:"amused",priority:7,conditions:{"npc.colombiano.met":{eq:!0},"npc.colombiano.trust":{gte:1},totalProfitGte:75e3,notFlag:"col_lifestyle_react",dealsSinceGte:3},lines:[{text:"El Colombiano sends a gift basket. Inside: champagne, cigars, and a framed photo of Pablo Escobar\u2019s bombed-out mansion.",portrait:"amused"},{text:"The card reads: \u201CCongratulations on your success. The champagne is to celebrate. The photo is to remind you how every celebration in this business eventually ends. Enjoy both. \u2014 E.C.\u201D",portrait:"cold"},{text:"P.S. \u2014 I hear you bought some things. Good for you. Material possessions are the cocaine of the middle class. We sell the real thing, which I suppose makes us more honest.",portrait:"amused"}],choices:[{text:"Cheers, Colombiano",reaction:"You drink the champagne. It\u2019s excellent. Of course it is. You look at the photo of the bombed mansion for a long time. Then you put it face-down in a drawer. Some things are better not stared at.",effects:{"npc.colombiano.trust":1,flags:["col_lifestyle_react"]}},{text:"Toss the photo",reaction:"The champagne is excellent. The photo goes in the trash. You\u2019ll think about endings later. Or never. Never works too.",effects:{flags:["col_lifestyle_react"]}}]},flav_coast_guard:{speaker:"narrator",priority:2,conditions:{totalProfitGte:1e5,notFlag:"f_coast"},lines:[{text:"\u{1F4FB} The Coast Guard intercepted a shrimp boat carrying 3 tons of cocaine. The captain claimed he was \u201Cjust fishing.\u201D His fishing rod was made of gold. The Coast Guard was not convinced."}],choices:[{text:"x",effects:{flags:["f_coast"]}}]},flav_congress:{speaker:"narrator",priority:2,conditions:{totalProfitGte:15e4,notFlag:"f_congress"},lines:[{text:"\u{1F4FB} Congress is debating the Anti-Drug Abuse Act. A senator who receives campaign donations from a pharmaceutical company that manufactures synthetic opioids gave an impassioned speech about \u201Cthe scourge of illegal drugs.\u201D Nobody laughed. Somebody should have."}],choices:[{text:"x",effects:{flags:["f_congress"]}}]},flav_dolphins:{speaker:"narrator",priority:1,conditions:{totalProfitGte:12e4,notFlag:"f_dolphins"},lines:[{text:"The Dolphins\u2019 new defensive end drives a different Porsche every day of the week. His salary is $180,000. Nobody at the Herald writes the story. The Herald\u2019s advertising manager drives a Porsche too."}],choices:[{text:"x",effects:{flags:["f_dolphins"]}}]},flav_cemetery:{speaker:"narrator",priority:2,conditions:{t
