onversationally, \u201CAurelio\u2019s sister writes to the consulate every week. Every WEEK. The letters are very well constructed. She was a teacher also.\u201D He eats. \u201CSome families produce nothing but careful people.\u201D",portrait:"neutral"}],choices:[{text:"Say nothing. Finish the fish.",reaction:"You finish the fish. It is excellent. You will eat this exact meal again in your sleep for a long time, and in the dream you never say anything either, and the not-saying is the part that wakes you up at four in the morning.",effects:{hpDelta:-6,"npc.colombiano.trust":1,flags:["chemist_echo"],montage:"Finished the fish. Said nothing at all about the letters."}},{text:"Send the sister money. Anonymously.",reaction:"Two thousand dollars reaches Puntarenas with no name attached, which is exactly as much help as it sounds like. El Colombiano never mentions it and never will \u2014 but a month later he seats you facing the door, which in his language is either respect or a test.",effects:{cashDelta:-2e3,cred:2,"npc.colombiano.trust":-1,flags:["chemist_echo","sent_the_sister_money"],montage:"Sent the chemist's sister money. No name on it."}}]},col_informant_found:{speaker:"colombiano",portrait:"cold",priority:13,conditions:{flag:"became_informant","npc.colombiano.met":{eq:!0},flagNot:"informant_exposed",dealsSinceGte:4},lines:[{text:"The restaurant is empty again, and this time nobody has poured anything. El Colombiano has the Herald folded to page four and a fountain pen, and he is doing the crossword in ink, which tells you everything about his relationship with certainty.",portrait:"neutral"},{text:"\u201CThree of my people were arrested in one week. Different corners, different crews, one COMMON element.\u201D He fills in seven across without pausing. \u201CIn Medell\xEDn we would already be finished talking. Here I am a guest in a country with excellent forensics, so I talk first. Enjoy the innovation.\u201D",portrait:"cold"}],choices:[{text:"Buy the conversation \u2014 $30,000",reaction:"The money crosses the table under the newspaper, which is either tradition or theater. He does not count it. \u201CThis purchases the CONVERSATION, friend. Not forgiveness. Forgiveness is not a product I stock.\u201D He returns to the crossword. You are permitted to leave, which is not nothing.",effects:{cashDelta:-3e4,"npc.colombiano.trust":1,flags:["informant_exposed","bought_the_conversation"],montage:"Paid $30,000 under a newspaper to be allowed to walk out of a restaurant."}},{text:"Prove it was me",reaction:"\u201CProve.\u201D He tastes the word and finds it foreign. \u201CThat is a courtroom verb, friend. You have been spending time in courtrooms \u2014 it shows.\u201D He caps the pen. You are followed home by a car that makes no effort whatsoever to be discreet, and the following continues for eleven days.",effects:{hpDelta:-10,heatDelta:10,"npc.colombiano.trust":-4,flags:["informant_exposed","col_hunting"],montage:"Told the cartel to prove it. A car followed you home for eleven days."}}]},col_war_corner:{speaker:"colombiano",portrait:"cold",priority:11,conditions:{flag:"col_war",credGte:30,flagNot:"col_war_corner",dealsSinceGte:3},lines:[{text:"They took the corner on 62nd at four in the morning with nine men and no shooting, which is worse, because it means they were confident. Two of your people are at Jackson Memorial. One of them will be fine. One of them will walk with a cane at twenty-three.",portrait:"cold"},{text:"El Colombiano telephones you himself, which is its own species of insult. \u201CI want to be very clear that this was BUSINESS,\u201D he says. \u201CThe boy with the leg was not instructed. My man exceeded his brief. He has been corrected.\u201D",portrait:"neutral"}],choices:[{text:"Take it back tonight",reaction:"You take it back with fourteen men and a great deal of noise, and by dawn the corner is yours and everyone in three districts has heard about it. Vice hears about it too, obviously. The Herald runs it on page seven under a photograph of an overturned shopping cart.",effects:{cred:8,heatDelta:9,"npc.colombiano.trust":-2,"npc.ramirez.evidence":2,flags:["col_war_corner","took_it_back"],montage:"Took the corner on 62nd back before dawn. Page seven."}},{text:"Send $5,000 to the kid's family instead",reaction:"The money goes to a house on 58th with no name attached and a note that reads only WALK GOOD. You never take the corner back. Something else happens instead: for a long while, people in Overtown start telling you things they do not tell anybody.",effects:{cashDelta:-5e3,cred:4,flags:["col_war_corner","walk_good"],montage:"Sent $5,000 to the kid's family. Never took the corner back."}}]},col_joint_venture:{speaker:"colombiano",portrait:"pleased",priority:9,conditions:{flag:"col_peace",totalProfitGte:11e4,flagNot:"col_venture",dealsSinceGte:4},lines:[{text:"\u201CPeace is expensive,\u201D El Colombiano says, in a marina office that smells like varnish and money, \u201Cwhich is why so few men can afford it. Fortunately you and I are not men. We are a JOINT VENTURE.\u201D",portrait:"pleased"},{text:"\u201CA go-fast comes into Ocean Reef on Thursday. Twenty units at my cost \u2014 which nobody outside my family has ever been offered, and which you will not mention at parties. Twenty-two thousand dollars, and the two of us stop paying a war tax that we were both pretending was strategy.\u201D",portrait:"neutral"}],choices:[{text:"Buy in \u2014 $22,000",reaction:"The boat comes in at 3 AM with its lights off and its motors trimmed, and twenty units go into your trunk while a man in a polo shirt talks about tarpon fishing the entire time. \u201CYou see?\u201D El Colombiano says. \u201CBusiness. It is so much more restful than the other thing.\u201D",effects:{cashDelta:-22e3,invGift:{idx:5,qty:20},"npc.colombiano.trust":2,flags:["col_venture"],montage:"Bought into the Ocean Reef go-fast. Twenty units at cartel cost."}},{text:"I buy my own product",reaction:"\u201COf course.\u201D He is not offended; he is CATALOGUING. \u201CIndependence. It is the most expensive thing in this city, and every man here buys it retail.\u201D The peace holds. It holds slightly less well than it did an hour ago.",effects:{cred:2,"npc.colombiano.trust":-1,flags:["col_venture","stayed_independent"],montage:"Turned down the cartel's joint venture. Kept your own supply lines."}}]},col_departures:{speaker:"colombiano",portrait:"neutral",priority:12,conditions:{flag:"col_broken",flagNot:"col_after",dealsSinceGte:2},lines:[{text:"You find him in the departures hall at MIA at six in the morning, alone, with one suitcase and a boarding pass for Barranquilla via a connection nobody sane would book. The cream suit is the same suit. It has been the same suit for three weeks.",portrait:"neutral"},{text:"\u201CThey have decided that I am unlucky,\u201D he says, watching the board flip. \u201CIn my organization there is no crime called losing. There is only a condition called unlucky, and it is treated identically. So: home, a farm, and a telephone that does not ring.\u201D",portrait:"cold"},{text:"\u201CYou will have all of it now. The corners, the routes, the men who called me se\xF1or.\u201D He almost smiles. \u201CAnd in four years, or eight, a young man will stand in this hall and watch YOUR board flip. I want you to know that I will not enjoy it. I will simply have expected it.\u201D",portrait:"neutral"}],choices:[{text:"Safe flight, se\xF1or",reaction:"He shakes your hand with both of his \u2014 exactly the way a chemist once did \u2014 and walks to a gate at the far end of the terminal without looking back. The suitcase is very light. Whatever he built in this city, he is not carrying any of it home.",effects:{cred:5,flags:["col_after","col_exile_witnessed"],montage:"Watched El Colombiano leave MIA with one very light suitcase."}},{text:"You should have taken the peace",reaction:"\u201CYes,\u201D he agrees immediately, which robs you of everything. \u201CThat is the correct analysis. I have had eleven days to arrive at it and you have had four seconds.\u201D He picks up the suitcase. \u201CThat is why you win, friend. You are FASTER at being right. It is not the same thing as being right.\u201D",effects:{cred:3,flags:["col_after","col_exile_witnessed"],montage:"Told a beaten man he should have taken the peace. He agreed instantly."}}]},colombiano_intro:{speaker:"colombiano",portrait:"neutral",priority:15,conditions:{"npc.colombiano.met":{eq:!1},orGroup:{totalProfitGte:5e4,credGte:40,turfGte:3}},lines:[{text:"The restaurant clears out. Nobody announces it; it just empties, the way a beach empties before weather. A man in a cream linen suit sits down across from you without asking.",portrait:"neutral"},{text:"\u201CYou\u2019ve been busy. Moving weight, taking corners. Miami notices. I notice.\u201D He orders for both of you, in Spanish, without looking at the menu.",portrait:"pleased"},{text:"\u201CI represent certain interests in Medell\xEDn. We can supply you at volume \u2014 real volume \u2014 or we can consider you competition. I prefer the first option. The second is bad for everyone, but mostly for you.\u201D",portrait:"cold"}],choices:[{text:"Let\u2019s do business",reaction:"He smiles like the deal was never in question. \u201CBueno. Cocaine will cost you less from now on. In exchange, you remember who your friends are.\u201D The food arrives. It\u2019s excellent. Everything about him is excellent. That\u2019s the problem.",effects:{"npc.colombiano.met":!0,"npc.colombiano.trust":3,flags:["cartel_supplier"]}},{text:"I work alone",reaction:"He nods slowly, dabs his mouth, stands. \u201CPride. I respect it.\u201D He buttons his jacket. \u201CI respected it in the last three men who said that too.\u201D He leaves. He pays for your meal anyway. Somehow that\u2019s the threat.",effects:{"npc.colombiano.met":!0,"npc.colombiano.trust":-2,flags:["rejected_cartel"]}}]},colombiano_test:{speaker:"colombiano",portrait:"cold",priority:10,conditions:{flag:"cartel_supplier","npc.colombiano.trust":{gte:2},totalProfitGte:8e4,flagNot:"colombiano_tested",dealsSinceGte:4},lines:[{text:"A car waits outside your place. Tinted glass. Inside: El Colombiano and a briefcase. \u201CA favor,\u201D he says, in a voice that has never once asked a favor.",portrait:"neutral"},{text:"\u201COne of my distributors is skimming. Tomas. You know him \u2014 small man, big watch. I need someone he doesn\u2019t fear to confirm it. Buy from him. Count the weight. Tell me what you find.\u201D",portrait:"cold"}],choices:[{text:"Do it \u2014 report the truth",reaction:"Tomas is skimming. Of course he\u2019s skimming \u2014 the watch alone is two months of skimming. You report it. A week later Tomas\u2019s big watch shows up at a pawn shop, and Tomas doesn\u2019t. El Colombiano sends a case of wine. You don\u2019t drink it.",effects:{"npc.colombiano.trust":2,cred:5,flags:["colombiano_tested"],montage:"Confirmed the skim. Tomas vanished."}},{text:"Warn Tomas instead",reaction:"You tell Tomas to run. He runs. El Colombiano never mentions it \u2014 which is how you know he knows. The wine never arrives. Something colder does: nothing at all.",effects:{"npc.colombiano.trust":-3,flags:["colombiano_tested","warned_tomas"],montage:"Warned Tomas. The cartel noticed."}}]},rep_reveal:{speaker:"maria",portrait:"knowing",priority:11,conditions:{credGte:25,totalDealsGte:10,flagNot:"rep_revealed"},lines:[{text:"Maria slides a newspaper across the bar. There\u2019s no article about you. That\u2019s the point. \u201CPeople are talking,\u201D she says. \u201CThe right people. The corners know your name. The clubs know your face.\u201D",portrait:"knowing"},{text:"\u201CReputation is currency now. Districts where you do business will treat you better. Places you neglect will forget you. Spend it carefully \u2014 it\u2019s harder to earn back than money.\u201D",portrait:"amused"}],choices:[{text:"Good to know",reaction:"\u201CIt wasn\u2019t n a parking lot behind a closed department store, ash from two hundred and six pages is still in a shopping cart, and a man who makes thirty-eight thousand dollars a year is at home, awake, deciding for the rest of his life whether he did the right thing."]},shrimp_boat:{who:"tiburon",mood:"neutral",title:"ELEVEN HUNDRED ISLANDS",color:l.green,lines:["The boat smells like diesel and forty years of ice, and the captain is somebody\u2019s cousin, and Tibur\xF3n stands on the dock in a shirt with parrots on it, waving with a fillet knife like a man seeing off a cruise.","\u201CRemember the geography, amigo!\u201D he shouts across the water. \u201CThere is no smuggler! There is only a fishing guide, and there is THURSDAY!\u201D The gold tooth catches the last of the dock light and then the dock light is gone.","Somewhere south of Marathon the water turns a color that does not exist in Miami. Nobody files a report, because nobody has anything to report: a boat went out, a boat came back, and the manifest said ice."]},second_seat:{who:"maria",mood:"knowing",title:"THE SECOND CHARTER",color:l.flamingo,lines:["The plane is worse this time \u2014 a Cessna with one working landing light and a pilot who apologizes for the seat belt. Maria is already on board, doing inventory on a clipboard at five in the morning, because she is incapable of waiting like a normal person.","\u201CYou bought this seat twice,\u201D she says, without looking up. \u201CThat is either the most expensive lesson in Dade County or the only one that ever took. I have decided not to tell you which.\u201D","At altitude she finally puts the clipboard down and looks out the window at the pink and blue and gold of a city that is no longer a factor in either of your lives. \u201CGod,\u201D she says. \u201CIt really is beautiful from the outside.\u201D"]},medellin:{who:"colombiano",mood:"pleased",title:"THE INVITATION",color:l.orange,lines:["There is no forger, no charter, no numbered account. There is a first-class ticket in your own name and a customs officer in Rionegro who takes your passport, looks at nothing, and says \u201CWelcome home, se\xF1or,\u201D in a country you have never been to.","\u201CYou misunderstand what has happened,\u201D El Colombiano says on the drive up into the valley, where the air gets thin and green. \u201CYou did not escape Miami. Miami was a POSITION, and we have moved you off it. There is a difference, and one day it will matter to you.\u201D","The farm has a telephone that rings only when he decides it should. Some nights the fog comes up the mountain and covers everything, and you stand on the terrace with a drink you did not pour, a wealthy man in exile, listening to a phone that is not ringing yet."]},maria:{who:"maria",mood:"flirty",title:"THE LAST FLIGHT OUT",color:l.flamingo,lines:["The airstrip near Homestead is a scar of cracked tarmac between two tomato fields. The plane is older than you and twice as tired. Maria is leaning against it like it owes her money.","\u201CYou actually came,\u201D she says, and for one second the armor slips \u2014 then it\u2019s back, polished. \u201CMost of them don\u2019t, you know. Most of them love the table too much to leave it.\u201D","Miami shrinks beneath the wing until it\u2019s just light \u2014 pink and blue and gold, all that neon money burning for somebody else now. Maria doesn\u2019t look down. You do. Once."]},route50:{icon:"\u{1F6EB}",title:"THE FORGER'S PACKAGE",color:l.blue,lines:["The forger works out of a bait shop in Islamorada that has never sold bait. Your new passport smells like fresh ink and a clean conscience \u2014 one of those is real.","\u201CYou were never here,\u201D he says, stamping a history you didn\u2019t live. \u201CThat\u2019ll be the hardest part. Not the leaving. The never-having-been.\u201D","The charter lifts off a private strip at dawn with no flight plan and no names on the manifest. Behind you, the city keeps glowing. It doesn\u2019t notice. It never does."]},cass:{who:"cass",mood:"pleased",title:"THE WIRE TRANSFER",color:l.gold,lines:["Cass meets you in the bank's basement vault, which smells like cold steel and other people's secrets. She slides a single page across the table: numbers, a signature line, a future.","\u201CZurich, via Panama, via a funeral home in Hialeah,\u201D she says, almost fondly. \u201CAs of this signature, you are no longer a person. You are a WIRE TRANSFER. Congratulations \u2014 it's the safest thing to be.\u201D","By the time the federal subpoena reaches Biscayne Fidelity, the accounts are folklore. Somewhere over the Atlantic, a number with your fingerprints on it becomes a rumor with a tan."]},kingpin:{icon:"\u{1F451}",title:"THE CITY KNEELS",color:l.gold,lines:["The rooftop in Brickell is yours. The building under it is yours. The skyline past it \u2014 pink, blue, gold, burning \u2014 answers, block by block, corner by corner, to your name.","Somewhere below, a detective drops a four-hundred-page file on a desk and is told, gently, that the case lacks PRIORITY. Somewhere south, a man in a cream suit raises a glass he does not finish.","They will write books about how this ends. Tonight is not about how it ends. Tonight, Miami is a machine of light and appetite \u2014 and every gear of it turns for you."]}},e1=({route:e,onDone:t,sound:n})=>{let o=hf[e]||hf.route50,[i,a]=(0,z.useState)(0),[s,c]=(0,z.useState)(!1),[u,f]=(0,z.useState)(!1),g=i>=o.lines.length-1;return(0,r.jsxs)("div",{onClick:()=>{if(!s){f(!0),c(!0);return}g||(a(i+1),c(!1),f(!1))},style:{position:"fixed",inset:0,zIndex:85,background:l.midnight,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:22,animation:"fadeIn .5s ease",cursor:"pointer"},children:[(0,r.jsx)("div",{style:{position:"absolute",inset:0,background:"repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px)"}}),(0,r.jsx)("div",{style:{fontFamily:M,fontSize:9,letterSpacing:4,color:l.dim,marginBottom:14}
