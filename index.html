\u2019s either good or dangerous. $6,000 cash. You feel like you won something. You\u2019ll find out later what it cost.",effects:{cashDelta:6e3,"npc.maria.trust":1,"npc.maria.met":!0,flags:["brick_deal_done","maria_friendly_intro","maria_negotiated"],montage:"Squeezed Maria for 50/50 on the brick. $6,000."}}]},act2_maria:{speaker:"maria",portrait:"knowing",priority:13,conditions:{totalProfitGte:12e3,"npc.maria.met":{eq:!0},flagNot:"act2_done",dealsSinceGte:2},lines:[{text:"Maria finds you at a window table in a Cuban diner. She doesn\u2019t order. She never orders. \u201CTwelve thousand in profit. The street is starting to say your name without laughing.\u201D",portrait:"amused"},{text:"\u201CEvery man I\u2019ve watched make money in this town believed the money was the game. The money is the ANTE.\u201D She taps the window. Outside, a DEA sedan idles. \u201CThe game is leaving the table while you still can.\u201D",portrait:"knowing"}],choices:[{text:"So how do I get out?",reaction:"\u201CForty thousand, clean or close to it, buys a passport and a charter from a forger I trust.\u201D She finally smiles. \u201CStack it. I\u2019ll be watching. I\u2019m always watching.\u201D",effects:{"npc.maria.trust":1,flags:["act2_done"],montage:"Maria laid out the exit: $50K and a forger."}},{text:"I'm not leaving. I'm winning.",reaction:"Something flickers behind her eyes \u2014 amusement, or a memory. \u201CThat\u2019s what C\xE9sar said. And the one before C\xE9sar.\u201D She drops a hundred on a table with no bill. \u201CThen win BIG, cowboy. Eighty cred, four districts, half a million moved. Miami only kneels to numbers like that.\u201D",effects:{cred:3,flags:["act2_done","kingpin_path"],montage:"Told Maria you're here to win, not run."}}]},act3_maria:{speaker:"maria",portrait:"flirty",priority:13,conditions:{totalProfitGte:45e3,flag:"act2_done",flagNot:"act3_done",dealsSinceGte:1,"npc.maria.trust":{gte:1}},lines:[{text:"A postcard arrives at your motel. No return address. A flamingo on the front. On the back, in expensive handwriting: \u2018Homestead. Tuesday. Bring a toothbrush.\u2019",portrait:"neutral"},{text:"You call her from a payphone. \u201CThere\u2019s an airstrip near Homestead,\u201D Maria says. \u201CA man with a plane owes me a favor the size of a felony. Two seats. I\u2019m offering you one \u2014 twenty thousand covers the fuel and his silence.\u201D",portrait:"flirty"}],choices:[{text:"Hold the seat for me",reaction:"\u201CDone. The offer doesn\u2019t expire, but Miami\u2019s patience does.\u201D A pause, almost soft. \u201CDon\u2019t make me read about you in the Herald.\u201D Click. The dial tone sounds like a countdown.",effects:{"npc.maria.trust":1,flags:["act3_done","maria_exit_plan"],montage:"Maria is holding a seat on a plane out."}},{text:"Sell the seat. I need capital.",reaction:"A long silence. \u201CYou\u2019re either the smartest man I\u2019ve met or the next John Doe in the Dade County cooler.\u201D She wires you eight thousand for the favor returned. The plane leaves Tuesday. Without you.",effects:{cashDelta:8e3,"npc.maria.trust":-1,flags:["act3_done","sold_the_seat"],montage:"Sold your seat on Maria's plane for $8,000."}}]},act3_forger:{speaker:"tiburon",portrait:"neutral",priority:13,conditions:{totalProfitGte:45e3,flag:"act2_done",flagNot:"act3_done","npc.maria.trust":{lte:0}},lines:[{text:"Tibur\xF3n waves you over at the fish market like an old debt come to say hello. \u201CYou look like a man counting backwards from a number. Everybody gets there. Even me, once.\u201D",portrait:"neutral"},{text:"\u201CThere is a man in the Keys who makes paper people. Passports. Histories. He owes me a fish dinner and his life, roughly in that order. Forty thousand, and you become somebody who was never here.\u201D The gold tooth flashes. \u201CConsider it a loyalty program.\u201D",portrait:"neutral"}],choices:[{text:"Tell me where to find him",reaction:"He writes an address on butcher paper that smells like the sea. \u201CWhen you go, go QUIET. The city notices leaving more than arriving. It\u2019s vain like that.\u201D",effects:{"npc.tiburon.met":!0,"npc.tiburon.trust":1,flags:["act3_done","forger_contact"],montage:"Tibur\xF3n pointed the way out: a forger in the Keys."}}]},ramirez_endgame:{speaker:"ramirez",portrait:"wry",priority:14,conditions:{evidenceGte:14,"npc.ramirez.met":{eq:!0},flagNot:"endgame_warned"},lines:[{text:"Your phone rings at 4 AM. You didn\u2019t give anyone this number. \u201CI want you to hear something,\u201D Ramirez says. Paper rustles. \u201CThat\u2019s your file. Four hundred pages. It makes a sound now when I drop it on the State Attorney\u2019s desk.\u201D",portrait:"tired"},{text:"\u201CI\u2019m not calling to gloat. In fifteen years I\u2019ve arrested two hundred of you, and exactly three ever got this warning: it\u2019s days now. Not weeks. Days.\u201D",portrait:"wry"}],choices:[{text:"Then I'd better hurry",reaction:"\u201CYeah,\u201D he says, and you can hear the shrug. \u201CThey always say that too.\u201D The line goes dead. Somewhere across the city, a man with a four-hundred-page file goes back to work.",effects:{flags:["endgame_warned"]}},{text:"What's the deal, detective?",reaction:"\u201CSame as it ever was. Names. Dates. The Colombian\u2019s supply route.\u201D You give him enough to matter. Pages come out of the file \u2014 you can almost hear them. So can the cartel.",effects:{"npc.ramirez.evidence":-6,"npc.colombiano.trust":-3,cred:-10,flags:["endgame_warned","became_informant"]}}]},col_rival:{speaker:"colombiano",portrait:"pleased",priority:12,conditions:{flag:"col_rival_active",flagNot:"col_rival_met",dealsSinceGte:1},lines:[{text:"A table is waiting for you at a restaurant you\u2019ve never been to. So is El Colombiano. Two glasses of rum are already poured, which means he knew you were coming before you did.",portrait:"neutral"},{text:"\u201CYou\u2019ve seen my crews on the corners. Good. I wanted you to see.\u201D He unfolds a map of Miami like a man unfolding a will. \u201CThis city is a pie, friend. I am proposing we cut it like gentlemen \u2014 before someone cuts it like animals.\u201D",portrait:"pleased"}],choices:[{text:"This city isn't big enough for both of us",reaction:"He nods slowly, almost approving, and folds the map with great care. \u201CC\xE9sar said something similar once. From a payphone in Panama, eventually.\u201D He leaves the rum. He leaves the check. \u201CThen we understand each other perfectly.\u201D",effects:{"npc.colombiano.trust":-2,cred:4,flags:["col_rival_met","col_war"],montage:"Declared war on El Colombiano over rum you didn't drink."}},{text:"To gentlemen, then \u2014 split the city",reaction:"\u201CTo gentlemen.\u201D The glasses touch. \u201CMy blocks are my blocks. Yours are yours. My crews will not undercut you, and the pie stays a pie.\u201D The rum is excellent. The peace will last exactly as long as it profits him.",effects:{"npc.colombiano.trust":2,flags:["col_rival_met","col_peace"],montage:"Split the city with El Colombiano. For now."}}]},col_parley:{speaker:"colombiano",portrait:"cold",priority:12,conditions:{flag:"col_war",credGte:50,flagNot:"col_parley_done",dealsSinceGte:3},lines:[{text:"Three of his men walk you \u2014 politely, which is worse \u2014 to a car with diplomatic plates. El Colombiano sits in the back reading the Herald. \u201CThey wrote about you today. Page nine. You\u2019re moving up.\u201D",portrait:"cold"},{text:"\u201CThis war is costing me money. Worse \u2014 it\u2019s costing me QUIET.\u201D He folds the paper. \u201CFifteen thousand, and my crews stand down. Or we keep going, and one of us ends up on page ONE.\u201D",portrait:"neutral"}],choices:[{text:"Take the $15,000 \u2014 peace",reaction:"The envelope is heavy and the handshake is dry. \u201CYou know what separates businessmen from bodies? Knowing which page of the newspaper to aim for.\u201D The car door opens. Miami looks the same. It isn\u2019t.",effects:{cashDelta:15e3,"npc.colombiano.trust":2,flags:["col_parley_done","col_peace"],montage:"Took $15K from El Colombiano to end the war."}},{text:"I'll see you on page one",reaction:"For one long second, nothing in the car moves. Then he laughs \u2014 a short, surgical sound. \u201CC\xE9sar at least took the money first.\u201D The door opens itself, somehow. The war is no longer business. It is personal, which in Miami is the expensive kind.",effects:{"npc.colombiano.trust":-3,cred:5,flags:["col_parley_done"],montage:"Spat on El Colombiano's peace. Page one it is."}}]},maria_truth:{speaker:"maria",portrait:"vulnerable",priority:10,conditions:{"npc.maria.trust":{gte:5},flagNot:"maria_truth",dealsSinceGte:4},lines:[{text:"Maria drinks tonight, which she never does, at a bar with no sign, which is the only kind she trusts. \u201CYou want to know about C\xE9sar.\u201D It isn\u2019t a question. \u201CEveryone eventually wants to know about C\xE9sar.\u201D",portrait:"vulnerable"},{text:"\u201CHe wasn\u2019t my debtor. He was my brother. The brick you carried off that bus was supposed to buy his way out of Panama.\u201D She turns the glass slowly. \u201CIt bought you in instead. Funny city.\u201D",portrait:"vulnerable"}],choices:[{text:"Then let me buy him out",reaction:"She studies you for a long time \u2014 the way she studied the deposit slip, the map, every man who ever promised her something. \u201CFive thousand reaches Panama by Friday.\u201D She doesn\u2019t say thank you. She squeezes your hand once, hard, which is worth more.",effects:{cashDelta:-5e3,"npc.maria.trust":3,flags:["maria_truth","freed_cesar"],montage:"Sent $5K to Panama. C\xE9sar walks."}},{text:"That's his debt, not mine",reaction:"\u201CNo,\u201D she agrees, finishing the drink. \u201CIt isn\u2019t.\u201D She leaves money on the bar and the warmth somewhere else entirely. \u201CYou\u2019re right, of course. Being right is your whole problem.\u201D",effects:{"npc.maria.trust":-1,flags:["maria_truth"]}}]},maria_guardian:{speaker:"maria",portrait:"knowing",priority:11,conditions:{"npc.maria.trust":{gte:4},fedHeatGte:55,flagNot:"maria_guardian",dealsSinceGte:3},lines:[{text:"Your pager buzzes a code you don\u2019t recognize: 5-0-5-0-5-0. You call. Maria answers before the first ring finishes. \u201CDon\u2019t talk. Listen. Vice is running saturation patrols on your usual routes tonight. ALL of them.\u201D",portrait:"knowing"},{text:"\u201CA friend of a friend types up the duty rosters. She types slowly when I pay her to. Take the causeway. Take it tonight. And burn this number.\u201D",portrait:"neutral"}],choices:[{text:"Take the back way (\u221212 heat)",reaction:"You drive the causeway with the windows down while, across the city, blue lights orbit corners you didn\u2019t stand on. The bay smells like salt and a favor you\u2019ll owe forever.",effects:{heatDelta:-12,"npc.maria.trust":1,flags:["maria_guardian"],montage:"Maria's typist saved your night. \u221212 heat."}},{text:"I don't run from patrols",reaction:"A pause long enough to drive a Countach through. \u201COf course you don\u2019t.\u201D The line clicks. Somewhere, a typist types at normal speed again.",effects:{cred:2,flags:["maria_guardian"]}}]},cass_intro:{speaker:"cass",portrait:"pleased",priority:12,conditions:{cashGte:18e3,flagNot:"cass_met",dealsSinceGte:2},lines:[{text:"The branch manager\u2019s office at Biscayne Fidelity smells like new carpet and old money. Cassandra Delgado reads your deposit slip the way a jeweler reads a diamond. \u201CEighteen thousand. Cash. In a gym bag.\u201D",portrait:"neutral"},{text:"\u201CRelax. Half of Brickell banks gym bags. The Federal Reserve says Miami has six billion more in circulation than it should. SOMEBODY\u2019S counting it.\u201D She closes the blinds with a remote. In 1986, that\u2019s practically witchcraft.",portrait:"pleased"},{text:"\u201CMy service: I run your paper through accounts so boring the IRS falls asleep reading them. Ten percent fee. What comes out is CLEAN \u2014 the kind of money that buys passports instead of indictments.\u201D",portrait:"pleased"}],choices:[{text:"Clean a quarter of my roll \u2014 10% fee",reaction:"She works a calculator with the serenity of a monk. Forms appear. You sign a name that is almost yours. \u201CPleasure doing business. Tell no one. Especially anyone named Ramirez.\u201D",effects:{"npc.cass.met":!0,"npc.cass.trust":1,launderPct:{pct:.25,fee:.1},flags:["cass_met"],montage:"Opened an arrangement with Cass Delgado at Biscayne Fidelity."}},{text:"Too rich for me",reaction:"\u201CSuit yourself.\u201D She reopens the blinds. \u201CBut men who keep it all in cash end up explaining the cash. Usually in a small room. Usually to a man with a thick file.\u201D She slides you a card anyway. Gold lettering.",effects:{"npc.cass.met":!0,flags:["cass_met","cass_declined"]}}]},cass_network:{speaker:"cass",portrait:"pleased",priority:10,conditions:{"npc.cass.trust":{gte:1},cashGte:3e4,flagNot:"cass_network",dealsSinceGte:3},lines:[{text:"Cass calls you to a lunch you didn\u2019t agree to at a club you can\u2019t afford. \u201CI\u2019ve been promoted. Regional. Which means I now supervise the people who would audit me. Miami is a beautiful machine.\u201D",portrait:"pleased"},{text:"\u201CNew offer. I put you in the NETWORK \u2014 shell companies, a marina, two funeral homes. Your money flows clean automatically. Plus I wash forty percent of what\u2019s in your pocket right now. Twelve percent fee. Standing arrangement.\u201D",portrait:"neutral"}],choices:[{text:"Put me in the network",reaction:"\u201CWelcome to the laundromat.\u201D She raises a glass of something French. From now on, money moves clean while you sleep. Somewhere in a funeral home ledger, you are listed as a \u2018consultant.\u2019",effects:{"npc.cass.trust":1,launderPct:{pct:.4,fee:.12},flags:["cass_network"],montage:"Joined Cass's laundering network. The funeral homes know your name."}},{text:"I like my money where I can see it",reaction:"\u201CSpoken like a man who\u2019s never met a forfeiture order.\u201D She finishes her drink and yours. \u201CThe offer stands until it doesn\u2019t.\u201D",effects:{flags:["cass_network_declined"]}}]},cass_squeeze:{speaker:"cass",portrait:"nervous",priority:11,conditions:{"npc.cass.met":{eq:!0},fedHeatGte:45,flagNot:"cass_squeeze_done",dealsSinceGte:3},lines:[{text:"Cass is waiting in your car. You didn\u2019t leave it unlocked. \u201CTwo men from Treasury visited the branch today,\u201D she says. Her hands are steady. Her voice is not. \u201CThey asked about gym bags.\u201D",portrait:"nervous"},{text:"\u201CI can make the paper trail evaporate. But evaporation costs eight thousand, and it costs it TONIGHT. Or I can start remembering things wrong about you. Banker\u2019s memory is a negotiable instrument.\u201D",portrait:"nervous"}],choices:[{text:"Pay the $8,000",reaction:"By morning, three accounts have been renamed, two closed, and one transferred to a dead man in Boca with excellent credit. \u201CWe never had this conversation,\u201D Cass says. \u201CWhich, in fairness, is true of all our conversations.\u201D",effects:{cashDelta:-8e3,"npc.cass.trust":1,flags:["cass_squeeze_done"],montage:"Paid Cass $8K to evaporate the paper trail."}},{text:"Remember whatever you want",reaction:"She nods slowly, the way bankers nod at bad loans. \u201CFor the record, I liked you.\u201D The car door closes with terrible gentleness. Somewhere downtown, a memory begins improving itself.",effects:{"npc.cass.trust":-3,flags:["cass_squeeze_done","cass_burned"]}}]},shark_diagnosis:{speaker:"tiburon",portrait:"neutral",priority:10,conditions:{"npc.tiburon.met":{eq:!0},totalProfitGte:55e3,flagNot:"shark_succession",dealsSinceGte:3},lines:[{text:"Tibur\xF3n is not gutting anything. That is the first wrong thing. He is sitting on an overturned crate with a towel pressed to his mouth, and the ice table behind him is still holding yesterday\u2019s fish.",portrait:"neutral"},{text:"\u201CJackson Memorial,\u201D he says, when he can. \u201CThey put a camera down my throat and showed me a photograph of the inside of me. Amigo, it is UGLY in there. Forty years of Marlboros and Presidente and telling people bad news.\u201D",portrait:"neutral"},{text:"He folds the towel so you cannot see the color of it. \u201CMy sister\u2019s boy \u2014 N\xE9stor. Twenty-six. He wears a beeper on his BELT like a doctor, and he has been counting my book at night when he believes I am asleep.\u201D",portrait:"neutral"}],choices:[{text:"Your book is safe with me, viejo",reaction:"\u201CVIEJO.\u201D The laugh turns into something else and he waves it away. \u201CYou say that word like a man who intends to keep saying it. Okay. Okay. Remember that you said it \u2014 my memory is going, amigo, but my BOOK never does.\u201D",effects:{"npc.tiburon.trust":2,flags:["shark_succession"],montage:"Tiburon coughed into a towel and told you about his nephew."}},{text:"Sounds like N\xE9stor already runs it",reaction:"The old man goes still in a way that has ended arguments across four decades. \u201CHe runs the PARTS. There is a difference between running the parts and being the animal.\u201D He spits into the ice. \u201CBut yes. He does. You have a nasty eye, amigo. I like it. Not today.\u201D",effects:{cred:2,"npc.tiburon.trust":-1,flags:["shark_succession","shark_saw_it"],montage:"Told Tiburon his nephew was already running the book."}}]},shark_nestor:{speaker:"tiburon",portrait:"neutral",priority:11,conditions:{flag:"shark_succession",flagNot:"shark_nestor_done",dealsSinceGte:4},lines:[{text:"The fish market has new scales \u2014 electronic, digital, Japanese. Tibur\xF3n stands beside one like it insulted his mother. \u201CN\xE9stor bought these. They are accurate to the GRAM. Tell me: in forty years, has any man ever wanted an accurate number from me?\u201D",portrait:"neutral"},{text:"\u201CHe went to the men in Hialeah who lend me what I lend you. He told them I am sick, which is true, and that I am soft, which is a matter of opinion, and that the book should belong to a man with a future.\u201D",portrait:"neutral"},{text:"\u201CSo now there is a vote, which is a beautiful word for what it is. And you, amigo \u2014 you are ON the book. Big number, good payer, the kind of client men brag about. Your voice is worth something in that room. He will come to you. He drives a red IROC. Subtle, no?\u201D",portrait:"neutral"}],choices:[{text:"What do you want me to say in that room?",reaction:"\u201CSay whatever keeps you breathing. I mean this.\u201D He puts a hand on your shoulder; it weighs less than it used to. \u201CBut if you can say it in a way where I still own my own name at the end, I will remember that longer than I remember most things now.\u201D",effects:{"npc.tiburon.trust":1,flags:["shark_nestor_done"],montage:"Tiburon asked you to speak for him at the vote in Hialeah."}},{text:"I stay out of family business",reaction:"\u201CFAMILY BUSINESS.\u201D He tests the phrase like a bad oyster. \u201CAmigo, you owe money to a family. There is no outside. There is only how far from the table you are sitting when they decide.\u201D",effects:{flags:["shark_nestor_done","shark_neutral"],montage:"Told Tiburon you stay out of family business. He explained the seating."}}]},shark_the_vote:{speaker:"tiburon",portrait:"neutral",priority:12,conditions:{flag:"shark_nestor_done",flagNot:"shark_resolved",dealsSinceGte:3},lines:[{text:"A social club in Hialeah with the windows painted over and a dominoes table nobody is using. Six men who lend money and one man who borrows it \u2014 that is you. Tibur\xF3n sits at the end with the towel in his apron pocket. N\xE9stor stands, because standing is his entire argument.",portrait:"neutral"},{text:"\u201CThe book earns eleven percent,\u201D N\xE9stor says, holding a ledger like a hymnal. \u201CIt should earn nineteen. My uncle grants extensions for FUNERALS. Last year he forgave four thousand dollars because a man\u2019s roof came off in a storm.\u201D Nobody at the table disagrees with the arithmetic.",portrait:"neutral"},{text:"Then all of them look at you, because in a room full of lenders the only honest witness is the debt. \u201CSpeak,\u201D says the oldest man there, not unkindly. \u201CYou are the merchandise. The merchandise gets one word.\u201D",portrait:"neutral"}],choices:[{text:"N\xE9stor's numbers are better. Back the nephew.",reaction:"You say nineteen percent out loud and the room relaxes, the way rooms do when they hear what they already decided. N\xE9stor wipes your book clean on the spot \u2014 a coronation gift, paid with somebody else\u2019s mercy. Tibur\xF3n walks out into the parking lot alone and stands there a while, in the sun, in his apron.",effects:{debtDelta:-1e6,cred:3,"npc.tiburon.trust":-4,flags:["shark_resolved","shark_heir"],montage:"Backed Nestor. The book got wiped. The old man walked out alone."}},{text:"The old man's word is the only collateral here \u2014 $12,000 says so",reaction:"You put twelve thousand dollars on the dominoes table and explain what an extension for a funeral is actually worth in a business where every single person eventually needs one. It is the most expensive sentence of your life. The oldest man nods once. N\xE9stor leaves before the vote finishes, and the IROC does not start on the first try.",effects:{cashDelta:-12e3,cred:5,"npc.tiburon.trust":4,flags:["shark_resolved","shark_loyal_final"],montage:"Paid $12,000 to keep Tiburon's name on Tiburon's book."}},{text:"I abstain. It's your family.",reaction:"\u201CThe merchandise abstains,\u201D the oldest man says, amused, and writes something down. The vote goes to N\xE9stor by one. On the way out Tibur\xF3n does not look at you, which is worse than if he had, and your interest rate goes up on Friday without anybody making a phone call.",effects:{debtDelta:3e3,"npc.tiburon.trust":-2,flags:["shark_resolved","shark_abstained"],montage:"Abstained in Hialeah. Your rate went up on Friday."}}]},shark_epilogue_heir:{speaker:"tiburon",portrait:"neutral",priority:9,conditions:{flag:"shark_heir",flagNot:"shark_epilogue",dealsSinceGte:4},lines:[{text:"You find the old man on a shrimp boat at the end of a dock in Islamorada, with a radio playing a game nobody in Florida cares about. The apron is gone. He looks smaller, and somehow also better.",portrait:"neutral"},{text:"\u201CN\xE9stor sends me an envelope every month. It is exactly correct. Nineteen percent of nothing I care about.\u201D He baits a hook badly, on purpose, because there is no hurry anymore. \u201CYou voted with the arithmetic, amigo. Arithmetic is a good friend to have and a terrible thing to be.\u201D",portrait:"neutral"}],choices:[{text:"You'd have done the same",reaction:"\u201CI would have,\u201D he agrees instantly, which somehow makes it worse. \u201CThat is how I know exactly what you are.\u201D He hands you a beer that is too warm. You drink it. The boat rocks. Neither of you says anything for twenty minutes, and it is almost forgiveness.",effects:{"npc.tiburon.trust":1,flags:["shark_epilogue"],montage:"Warm beer on a shrimp boat in Islamorada. Almost forgiveness."}},{text:"I'm sorry, viejo",reaction:"He waves the hook at you like a conductor. \u201CDon\u2019t be sorry. Sorry is what men say instead of money.\u201D Then, after a while, quieter: \u201CBut if you ever need to be somewhere that is not Miami, this boat still runs. That is not sorry. That is the other thing.\u201D",effects:{"npc.tiburon.trust":2,flags:["shark_epilogue","shark_boat"],montage:"The shrimp boat still runs. Tiburon said so, and he does not lie about boats."}}]},shark_epilogue_loyal:{speaker:"tiburon",portrait:"neutral",priority:9,conditions:{flag:"shark_loyal_final",flagNot:"shark_epilogue",dealsSinceGte:4},lines:[{text:"The fish market at 6 AM, and the ice table is full again. Tibur\xF3n is gutting a snapper one-handed and losing an argument about the price of stone crab. He looks like a photograph of himself from 1978.",portrait:"neutral"},{text:"\u201CN\xE9stor is in Tampa. He has a car wash. It is a very good car wash \u2014 I sent him the money for it, because he is my sister\u2019s boy, and because a man with a car wash does not need a book.\u201D The gold tooth flashes. \u201CAlso the doctors lied to me. Six months, they said. That was seven months ago. I intend to make this joke for YEARS.\u201D",portrait:"neutral"}],choices:[{text:"Then let's keep making money, viejo",reaction:"\u201CAMIGO.\u201D He hits the table hard enough to make the ice jump. \u201CThat is the correct thing to say to a dying man who is not dying yet.\u201D Your rate drops two points that morning, and the name of a boat that runs south out of Islamorada gets written on a napkin in fish-scale handwriting.",effects:{debtDelta:-4e3,"npc.tiburon.trust":2,flags:["shark_epilogue","shark_boat"],montage:"Tiburon wrote a boat's name on a napkin. It runs south."}},{text:"Take the money and rest",reaction:"\u201CREST.\u201D He says it the way other men say a slur. But he takes a snapper off the ice, wraps it in newspaper, and pushes it into your hands. \u201CFor the pot. Rest is for men who did not enjoy the work. Come Thursday \u2014 Thursday I will need a man with a car.\u201D",effects:{"npc.tiburon.trust":1,flags:["shark_epilogue","shark_boat"],montage:"Told the shark to rest. He handed you a snapper instead."}}]},shark_collectors:{speaker:"tiburon",portrait:"neutral",priority:11,conditions:{"npc.tiburon.met":{eq:!0},debtGte:22e3,flagNot:"shark_collector",dealsSinceGte:2},lines:[{text:"Two men are waiting in the stairwell, and one of them apologizes before he starts, which is the most frightening part of the entire evening. Tibur\xF3n watches from the car with the window down, drinking a mamey shake through a straw.",portrait:"neutral"},{text:"\u201CThis is not personal, and I want you to hear that from ME so you do not hear it from a stranger,\u201D he calls up. \u201CTwenty-two thousand dollars is not a debt anymore, amigo. It is an OPINION about me. And opinions travel.\u201D",portrait:"neutral"}],choices:[{text:"Take the beating. Keep the cash.",reaction:"They are professionals, so it is short and nothing important breaks. Afterward Tibur\xF3n passes you the mamey shake through the car window and says, with real warmth, \u201CSee? Now nobody has to TALK about you.\u201D The book is unchanged. Your ribs are not.",effects:{hpDelta:-22,cred:3,"npc.tiburon.trust":1,flags:["shark_collector"],montage:"Took the beating instead of the write-down. Kept the cash."}},{text:"Pay $6,000 right now",reaction:"The envelope ends the evening the way a coin stops a jukebox. \u201CTHERE it is,\u201D Tibur\xF3n says, delighted, and the two men relax back into being guys \u2014 one of them asks if you know a good body shop in Hialeah. \u201CSee how quickly we return to friendship?\u201D",effects:{cashDelta:-6e3,debtDelta:-7e3,"npc.tiburon.trust":1,flags:["shark_collector"],montage:"Paid $6,000 in a stairwell. The evening ended early."}}]},shark_pistol:{speaker:"tiburon",portrait:"neutral",priority:8,conditions:{"npc.tiburon.met":{eq:!0},hasGun:!1,credGte:18,cashGte:3e3,flagNot:"shark_pistol",dealsSinceGte:3},lines:[{text:"There is a cigar box under the ice table, which is a bad place to keep anything you plan to eat. Inside, wrapped in a dish towel: a .38 with the bluing worn off the grip and somebody else\u2019s initials scratched out of the frame.",portrait:"neutral"},{text:"\u201CTwenty-five hundred. I am not selling you courage, amigo \u2014 courage is free and stupid. I am selling you a REASON for men to be polite. In this city that is a utility, like water. You pay for it monthly whether you use it or not.\u201D",portrait:"neutral"}],choices:[{text:"I'll take it \u2014 $2,500",reaction:"He wraps it back in the towel and hands it over like a fish. \u201CRule one: never show it. Rule two: if you show it, you are already using it. Rule three, which everybody forgets \u2014 a gun in Miami is a magnet for the exact evening you bought it to avoid.\u201D",effects:{cashDelta:-2500,gun:!0,cred:2,flags:["shark_pistol"],montage:"Bought a .38 out of a cigar box under the ice table."}},{text:"I'd rather not carry",reaction:"\u201CGood.\u201D He puts the box away without ceremony. \u201CThe ones who say yes too fast are the ones I read about in the Herald. The ones who say no become the ones I do business with for twenty years.\u201D He says this to a man he has known for four months.",effects:{"npc.tiburon.trust":1,flags:["shark_pistol","refused_gun"],montage:"Turned down the .38. The shark approved, loudly."}}]},shark_keys_water:{speaker:"tiburon",portrait:"neutral",priority:6,conditions:{"npc.tiburon.met":{eq:!0},locIn:[5],totalProfitGte:4e4,flagNot:"keys_run",dealsSinceGte:4},lines:[{text:"Tibur\xF3n is on a dock in Islamorada in a shirt with parrots on it, supervising four men loading ice onto a boat that is considerably faster than a boat carrying ice needs to be.",portrait:"neutral"},{text:"\u201CUnderstand the geography, amigo. Between Key Largo and Marathon there are eleven hundred islands and about forty police officers, and all forty of them know each other\u2019s boats by sight. This is not lawlessness. It is a very stable arrangement that everybody respects and nobody writes down.\u201D",portrait:"neutral"},{text:"\u201CThe mistake tourists make is the mistake the DEA makes: they look for the smuggler. In the Keys there is no smuggler. There is a fishing guide who is also somebody\u2019s cousin, and there is Thursday.\u201D",portrait:"neutral"}],choices:[{text:"Teach me the water",reaction:"He teaches you three channels, two names to drop, and one hand signal that means turn around and do not ask. \u201CNow you know as much as a bad guide and less than a good one. Do not be confident. Confidence is how the reef gets fed.\u201D",effects:{cred:3,"npc.tiburon.trust":1,flags:["keys_run","knows_the_water"],montage:"Learned three channels and one hand signal in Islamorada."}},{text:"I'll stick to the highway",reaction:"\u201CUS 1. One road, one lane in each direction, a hundred and thirteen miles of nowhere to turn around.\u201D He shrugs, enormously. \u201CIt is a road designed by God for roadblocks. But you are a grown man and I am only a fishmonger.\u201D",effects:{flags:["keys_run"],montage:"Stuck to US 1. A road designed by God for roadblocks."}}]},tiburon_intro:{speaker:"tiburon",portrait:"neutral",priority:11,conditions:{debtGte:6e3,totalDealsGte:2,flagNot:"shark_intro"},lines:[{text:"The fish market on the river, 6 AM. Tibur\xF3n guts a snapper with one hand and waves you over with the knife. \u201CThe new businessman! Sit. Mind the blood \u2014 it\u2019s the fish\u2019s. Today.\u201D",portrait:"neutral"},{text:"\u201CYou owe my book money. This is not a problem \u2014 DEBT is friendship, amigo. Debt means I think about you every day.\u201D The gold tooth catches the dawn. \u201CThe problem is when I stop thinking about you. Then my associates start.\u201D",portrait:"neutral"}],choices:[{text:"Pay $1,000 tribute now",reaction:"He weighs the envelope without opening it \u2014 a parlor trick that has ended arguments all over Miami. \u201CGood faith! I knock eighteen hundred off the book. See? Friendship.\u201D He hands you a snapper wrapped in newspaper. Your picture is not in the newspaper. Yet.",effects:{cashDelta:-1e3,debtDelta:-1800,"npc.tiburon.met":!0,"npc.tiburon.trust":1,flags:["shark_intro"],montage:"Paid tribute to Tibur\xF3n at the fish market."}},{text:"You'll get paid when you get paid",reaction:"The market goes quiet the way water goes quiet around a fin. Then Tibur\xF3n LAUGHS \u2014 huge, delighted. \u201CBrass ones! I respect it. My associates, however, are paid NOT to respect it.\u201D The knife comes down through the snapper\u2019s spine. Punctuation.",effects:{"npc.tiburon.met":!0,"npc.tiburon.trust":-1,cred:3,flags:["shark_intro","shark_grudge"]}}]},tiburon_job:{speaker:"tiburon",portrait:"neutral",priority:9,conditions:{"npc.tiburon.met":{eq:!0},debtLte:0,flagNot:"shark_job",dealsSinceGte:3},lines:[{text:"Tibur\xF3n finds you eating lunch and sits down without asking, which is how kings sit. \u201CYou paid the book. ALL of it. You know how rare that is? I had a banner made. Then I remembered I don\u2019t do banners.\u201D",portrait:"neutral"},{text:"\u201CSo \u2014 a JOB. A bag rides from the Keys to the Gables in your car. You don\u2019t open it. You don\u2019t smell it. Six thousand for an afternoon of not being curious. The cops may notice the car. That\u2019s the six thousand talking.\u201D",portrait:"neutral"}],choices:[{text:"I can not-be-curious for $6,000",reaction:"The bag is heavier than money and lighter than a body, and you spend the whole drive proud of yourself for not narrowing it down further. The envelope at the end is exactly six thousand. Tibur\xF3n counts respect the way he counts cash: out loud.",effects:{cashDelta:6e3,heatDelta:8,"npc.tiburon.trust":1,flags:["shark_job"],montage:"Ran a no-questions bag for Tibur\xF3n. $6,000."}},{text:"I'm out of the favor business",reaction:"\u201CSmart, maybe. Boring, definitely.\u201D He steals a fry. \u201CThe offer floats away like a body at high tide. Which is to say: it may come back.\u201D",effects:{flags:["shark_job"]}}]},cesar_returns:{speaker:"maria",portrait:"vulnerable",priority:13,conditions:{flag:"freed_cesar",totalProfitGte:6e4,flagNot:"cesar_back",dealsSinceGte:4},lines:[{text:"Maria calls at an hour she never calls, and her voice is doing something it has never done before: hurrying. \u201CHe\u2019s at the gallery. He came off a plane from Panama City four hours ago with a duffel bag and a haircut somebody gave him with kitchen scissors.\u201D",portrait:"vulnerable"},{text:"C\xE9sar Santos is younger than you expected and thinner than the photograph, and he shakes your hand with the specific gratitude of a man who has been told exactly who paid for his freedom. He has also, you notice immediately, already located the bar cart.",portrait:"neutral"},{text:"Maria watches him across the room. \u201CHe was better at this than all of us. That is not a compliment. Here is the honest sentence, cowboy: if you put him to work he will make you money for eleven weeks, and then he will make you a DEFENDANT.\u201D",portrait:"knowing"}],choices:[{text:"Put him to work",reaction:"He is spectacular. He knows three suppliers you could never reach and one buyer you should not have. He also talks \u2014 in bars, to women, to men he assumes are those women\u2019s cousins. Maria stops coming to the gallery on the days he is there.",effects:{cashDelta:4e3,cred:6,"npc.maria.trust":-1,"npc.ramirez.evidence":2,flags:["cesar_back","cesar_working"],montage:"Put Cesar Santos to work. He was spectacular. He was also loud."}},{text:"Buy him a bus ticket somewhere boring \u2014 $3,000",reaction:"Gainesville. Three thousand dollars, an apartment deposit, and a promise you both know is a coin flip. Maria walks him to the station herself and comes back wearing sunglasses at nine o\u2019clock at night. \u201CThank you,\u201D she says, and then immediately, \u201Cwe are not discussing this.\u201D",effects:{cashDelta:-3e3,"npc.maria.trust":3,flags:["cesar_back","cesar_exiled"],montage:"Bought Cesar a bus ticket to Gainesville. Maria wore sunglasses at night."}}]},cesar_eleven_weeks:{speaker:"maria",portrait:"angry",priority:12,conditions:{flag:"cesar_working",evidenceGte:9,flagNot:"cesar_arc_done",dealsSinceGte:4},lines:[{text:"Eleven weeks, almost exactly. Maria puts a payphone number in front of you and does not sit down. \u201CMetro-Dade picked him up on Washington Avenue with four grams and a mouth. He has been in an interview room for nine hours.\u201D",portrait:"angry"},{text:"\u201CNine hours is not nothing, to be fair to him. Most men are finished at ninety minutes.\u201D She lights a cigarette she does not smoke and watches it burn down. \u201CThere is a lawyer named Broche. He costs nine thousand dollars and he gets people out before lunch.\u201D",portrait:"neutral"}],choices:[{text:"Call Broche. Pay the nine.",reaction:"The lawyer arrives at 6 AM in a suit worth more than the charge, and C\xE9sar is on the street by ten having said, it turns out, absolutely nothing for nine hours. \u201CHe HELD,\u201D Maria says, genuinely stunned. \u201CI have never been so happy to be wrong about my own blood.\u201D",effects:{cashDelta:-9e3,"npc.ramirez.evidence":-4,"npc.maria.trust":3,flags:["cesar_arc_done","cesar_held"],montage:"Paid Broche $9,000. Cesar held for nine hours and said nothing."}},{text:"He got himself in there",reaction:"\u201CYes,\u201D Maria agrees, and that is the entire conversation. By Thursday there is a new name in a file downtown and a detective who suddenly knows where you buy. C\xE9sar goes back to Panama, permanently. Maria answers the phone on the fourth ring now instead of the first.",effects:{"npc.ramirez.evidence":4,"npc.maria.trust":-3,flags:["cesar_arc_done","cesar_burned"],montage:"Left Cesar in the room. He talked. Maria answers on the fourth ring now."}}]},maria_empty_seat:{speaker:"maria",portrait:"knowing",priority:10,conditions:{flag:"sold_the_seat",totalProfitGte:7e4,flagNot:"seat_regret",dealsSinceGte:4},lines:[{text:"The gallery is between shows, which means it is a white room with a horse in it. Maria is doing inventory with a clipboard, which is the thing she does instead of feelings.",portrait:"neutral"},{text:"\u201CThe plane went Tuesday, in case you were curious. It landed. The pilot mailed a postcard with nothing written on it, which is how he says everything is fine.\u201D She does not look up. \u201CYour seat went to a woman who owns four dry cleaners. She cried at wheels-up. It was embarrassing for everybody.\u201D",portrait:"knowing"},{text:"\u201CThere is a second charter in six weeks. Same pilot, worse plane, and the price is no longer friendly, because you taught me that our friendship has a RATE. Twenty-five thousand dollars.\u201D",portrait:"amused"}],choices:[{text:"Buy the seat back \u2014 $25,000",reaction:"She writes it on the clipboard, which is somehow more binding than a contract. \u201CDone. And cowboy \u2014 this one I do not resell. Not because I like you. Because I am tired of watching men be clever at exactly the wrong scale.\u201D",effects:{cashDelta:-25e3,"npc.maria.trust":2,flags:["seat_regret","seat_rebought"],montage:"Bought back the seat you sold. Twenty-five thousand. No discount."}},{text:"I made the right call",reaction:"\u201CYou made A call.\u201D She turns a page on the clipboard. \u201CIn eleven years I have watched exactly one man leave Miami with money, and I have watched forty-two men be right about something. Those are the numbers. Do with them whatever you like.\u201D",effects:{cred:2,"npc.maria.trust":-1,flags:["seat_regret"],montage:"Told Maria you were right about the seat. She quoted you the numbers."}}]},maria_prosecutor:{speaker:"maria",portrait:"knowing",priority:10,conditions:{flag:"high_society",credGte:28,flagNot:"prosecutor_met",dealsSinceGte:3},lines:[{text:"Same mansion, different party, and the pool is still shaped like a dollar sign. Maria arrives at your elbow with two drinks and one piece of information. \u201CRed dress, eleven o\u2019clock. Diane Vance. Assistant United States Attorney, narcotics.\u201D",portrait:"amused"},{text:"\u201CShe has been at this party for forty minutes and she has not spoken to a single person who is not under indictment or adjacent to somebody who is. That is not a coincidence, cowboy. That is a WORK EVENT.\u201D",portrait:"knowing"},{text:"Vance crosses the room like the hostess invited her, which the hostess did, because in Coral Gables everybody collects everybody. \u201CI know three things about you,\u201D she says, in place of hello, \u201Cand two of them are boring.\u201D",portrait:"neutral"}],choices:[{text:"Take her card",reaction:"The card is thick and the number handwritten on the back is a direct line, which means it is not a courtesy, it is a fishing line. \u201CCall before it\u2019s the only good idea left,\u201D she says. \u201CEverybody calls me eventually. The successful ones call early.\u201D Maria watches this happen with an expression like weather.",effects:{flags:["prosecutor_met","prosecutor_card"],montage:"Took a federal prosecutor's card. Direct line, handwritten."}},{text:"Compliment the dress. Walk away.",reaction:"You tell her the dress is excellent and that you hope the government reimburses her for parking, and you leave her standing in a room full of criminals holding a plastic cup of chardonnay. She laughs. Twice. That is also on the record now.",effects:{cred:4,"npc.ramirez.evidence":1,flags:["prosecutor_met"],montage:"Walked away from a federal prosecutor at a pool party. She laughed twice."}}]},maria_overtown:{speaker:"maria",portrait:"vulnerable",priority:8,conditions:{flag:"maria_hates_crack",soldCrack:!0,flagNot:"crack_amends",dealsSinceGte:5},lines:[{text:"Maria drives you to Overtown at two in the afternoon, which is a thing she has never done, and parks across the street from an elementary school. She does not say anything for four minutes.",portrait:"neutral"},{text:"\u201CThe woman on the steps in the blue shirt is Yolanda. Two years ago she kept the books for a shipping company on the river. She is thirty-four years old. Look at her hands, then look at me and tell me it is just business again \u2014 I am prepared to hear it. I only want you to say it HERE.\u201D",portrait:"vulnerable"}],choices:[{text:"I'm done selling crack",reaction:"\u201COkay.\u201D She starts the car. She does not thank you, does not soften, does not make it a moment \u2014 which is exactly how you know she believes you. Six blocks later: \u201CThere is more money in Coral Gables anyway. Rich people ruin themselves quietly and pay a premium for the privilege.\u201D",effects:{cred:-2,"npc.maria.trust":3,flags:["crack_amends","no_more_crack"],montage:"Sat outside a school in Overtown with Maria. Stopped selling crack."}},{text:"It's just business, Maria",reaction:"She nods slowly, puts the car in gear, and drives you back without another word. At your corner she says, \u201CThank you for saying it here,\u201D and means it, and you understand that you have just failed a test that was never going to be offered twice.",effects:{cred:2,"npc.maria.trust":-3,flags:["crack_amends","said_it_in_overtown"],montage:"Said it was just business. In Overtown. Across from the school."}}]},maria_causeway:{speaker:"maria",portrait:"flirty",priority:6,conditions:{"npc.maria.met":{eq:!0},nightOnly:!0,locIn:[0],credGte:15,flagNot:"causeway_night",dealsSinceGte:4},lines:[{text:"Maria makes you pull over halfway across the MacArthur Causeway at three in the morning and shut the engine off. The water is flat and black and the skyline is doing the thing it does, which is pretend to be a promise.",portrait:"neutral"},{text:"\u201CEvery person in every one of those windows believes this city is about to give them something,\u201D she says, sitting on the hood. \u201CThe waiters, the models, the Colombians, the CONGRESSMEN. Same disease. Miami is the only place on earth where it counts as a personality.\u201D",portrait:"flirty"},{text:"\u201CI make you stop here because I want you to see it from the outside, once. From out here it is only lights. In there it is a machine, and the machine eats the people who forget the difference.\u201D",portrait:"knowing"}],choices:[{text:"It's beautiful from here",reaction:"\u201CIt is. That is the trap \u2014 it is honestly beautiful, so you stay.\u201D She gets back in the car and puts her sunglasses on top of her head at three in the morning. \u201CEnough. One more sincere thought tonight and I will have to buy something to recover.\u201D",effects:{cred:1,"npc.maria.trust":1,flags:["causeway_night"],montage:"Stopped on the MacArthur at 3 AM. Saw it from the outside, once."}},{text:"It's a market. That's all.",reaction:"\u201CGod, that\u2019s bleak. Correct, but bleak.\u201D She flicks a cigarette into Biscayne Bay, a felony for which nobody in the history of Florida has ever been charged. \u201CFine. Drive. The market opens in four hours and neither of us is a poet.\u201D",effects:{cred:2,flags:["causeway_night"],montage:"Called Miami a market from the middle of the causeway."}}]},maria_wide_part:{speaker:"maria",portrait:"knowing",priority:10,conditions:{"npc.maria.met":{eq:!0},moveGte:55,totalProfitGte:8e4,flagNot:"clock_late",dealsSinceGte:3},lines:[{text:"Maria stopped asking when you are leaving, and you noticed about two weeks after she stopped. Tonight she says it plainly, in the dark gallery with the streetlight doing all the work: \u201CYou are not going to go.\u201D",portrait:"knowing"},{text:"\u201CI have watched this exact month before. The money is good, the routes are quiet, everyone knows your name, and it feels like the beginning of something. It is not the beginning. It is the WIDE PART. Everything after this narrows.\u201D",portrait:"neutral"}],choices:[{text:"One more season",reaction:"\u201COne more season.\u201D She repeats it the way a doctor repeats a symptom back to a patient. \u201CWrite it down somewhere, so that when it happens you at least get to be right about it. That is worth something. Not very much. Something.\u201D",effects:{cred:3,flags:["clock_late","one_more_season"],montage:"Told Maria one more season. She repeated it like a symptom."}},{text:"Then help me pick the day",reaction:"For the first time in months she looks genuinely surprised. Then she takes a pen and a gallery invoice and writes down four dates, a dollar figure, and one name. \u201CThat is the day. That is the number. That is the man. Do not improvise, cowboy \u2014 improvising is how everyone I have ever liked has died.\u201D",effects:{"npc.maria.trust":2,flags:["clock_late","picked_the_day"],montage:"Maria wrote four dates, a number and a name on a gallery invoice."}}]},maria_tip:{speaker:"maria",portrait:"amused",priority:9,conditions:{totalProfitGte:5e3,"npc.maria.trust":{gte:1},flagNot:"maria_gave_tip",dealsSinceGte:2},lines:[{text:"Your pager buzzes at 2 AM. Maria\u2019s code. You call back from a payphone that smells like bad decisions and worse cologne.",portrait:"neutral"},{text:"\u201CI\u2019ve got a man in Overtown who is dry. Crack and cocaine \u2014 he\u2019ll pay anything. And I mean anything. Desperate men are profitable men.\u201D",portrait:"amused"},{text:"\u201CBuy cheap anywhere else, sell there. And hurry \u2014 I gave this number to two people. You\u2019re the one I like slightly more.\u201D",portrait:"flirty"}],choices:[{text:"Thanks, Maria",reaction:"\u201CDon\u2019t thank me. C\xE9sar would\u2019ve charged you for it. You\u2019re already an improvement.\u201D She hangs up. The payphone smells slightly better now.",effects:{"npc.maria.trust":1,flags:["maria_gave_tip"],demandSpike:{loc:2}}}]},maria_party:{speaker:"maria",portrait:"flirty",priority:10,conditions:{credGte:10,"npc.maria.trust":{gte:2},flagNot:"maria_party_done",dealsSinceGte:3},lines:[{text:"Maria takes you to a private party in a Coral Gables mansion. The pool is shaped like a dollar sign. This is not a joke. The host is a \u201Creal estate developer\u201D whose real estate consists primarily of cocaine warehouses.",portrait:"amused"},{text:"\u201CSee the woman in the red dress? Federal prosecutor. See the man she\u2019s talking to? Her biggest defendant. They\u2019ve been sleeping together since April.\u201D",portrait:"knowing"},{text:"\u201CThis city runs on three things: cocaine, hypocrisy, and pool parties. Try the ceviche \u2014 it\u2019s actually good.\u201D",portrait:"flirty"}],choices:[{text:"Mingle with the guests",reaction:"You spend the night learning that everyone in Coral Gables is either a criminal or married to one. Several are both. Maria introduces you to people whose handshakes feel like contracts. Your name means something now.",effects:{"npc.maria.trust":1,cred:5,flags:["maria_party_done","high_society"]}},{text:"This isn\u2019t my scene",reaction:"\u201CSuit yourself.\u201D She vanishes into a crowd whose net worth exceeds the GDP of several Caribbean nations. You eat the ceviche alone. She was right \u2014 it\u2019s actually good.",effects:{"npc.maria.trust":-1,flags:["maria_party_done"]}}]},maria_launder:{speaker:"maria",portrait:"knowing",priority:9,conditions:{totalProfitGte:3e4,"npc.maria.trust":{gte:2},cashGte:8e3,flagNot:"maria_launder_offered"},lines:[{text:"Maria\u2019s gallery. The paintings are aggressively terrible. A canvas splattered with what looks like ketchup has a $28,000 price tag.",portrait:"amused"},{text:"\u201CDon\u2019t look at me like that. Art is subjective. Money laundering is objective. I can clean $5K for you right now.\u201D",portrait:"knowing"},{text:"She gestures at a painting of a sad horse. \u201CRun it through as a sale of this masterpiece. Nobody questions art. Nobody wants to admit they don\u2019t understand it.\u201D",portrait:"amused"}],choices:[{text:"Launder $5,000",reaction:"She writes a receipt. The sad horse gets a red SOLD sticker. \u201CI\u2019ve sold that horse four times this month. He\u2019s my best performer. Better than the Basquiat.\u201D",effects:{cashDelta:-5e3,cleanDelta:4500,"npc.maria.trust":1,flags:["maria_launder_offered"]}},{text:"Not yet",reaction:"\u201CThe offer stands. The horse isn\u2019t going anywhere \u2014 nobody actually wants to own it. That\u2019s the whole point.\u201D",effects:{flags:["maria_launder_offered"]}}]},maria_personal:{speaker:"maria",portrait:"vulnerable",priority:10,conditions:{credGte:20,"npc.maria.trust":{gte:4},"npc.ramirez.met":{eq:!0},flagNot:"maria_personal_done"},lines:[{text:"3 AM. Maria\u2019s gallery. She\u2019s drinking wine from a coffee mug and her shoes are off. This is the most human you\u2019ve seen her.",portrait:"vulnerable"},{text:"\u201CYou want to know why I do this? My mother cleaned hotel rooms for twenty years. TWENTY. Her back is destroyed. She can\u2019t stand for more than ten minutes.\u201D",portrait:"angry"},{text:"\u201CAnd the woman in the penthouse \u2014 the one whose sheets she changed every day \u2014 made her money the same way I make mine. The only difference is the number of zeros and the quality of the attorney.\u201D",portrait:"vulnerable"},{text:"She looks at you. The strategy is gone for a moment. What\u2019s underneath is more dangerous. \u201CStay alive, okay? I\u2019m running out of people I actually like in this city.\u201D",portrait:"vulnerable"}],choices:[{text:"I\u2019m not going anywhere",reaction:"She doesn\u2019t say anything for a long time. Then: \u201CDon\u2019t make me regret saying that.\u201D She puts her shoes back on. The strategy returns. But something behind it has shifted, and you both know it.",effects:{"npc.maria.trust":2,flags:["maria_personal_done","maria_close"]}},{text:"We\u2019re business. That\u2019s all.",reaction:"\u201CRight. Business.\u201D The coffee mug clinks on the desk. \u201COf course.\u201D You\u2019ve never heard two words carry that much weight. The gallery feels colder when you leave.",effects:{"npc.maria.trust":-2,flags:["maria_personal_done","maria_rejected"]}}]},maria_crack:{speaker:"maria",portrait:"angry",priority:7,conditions:{"npc.maria.met":{eq:!0},soldCrack:!0,flagNot:"maria_hates_crack"},lines:[{text:"Maria finds you at the bar. She\u2019s not smiling. \u201CCrack. You\u2019re selling crack now.\u201D",portrait:"angry"},{text:"\u201CI watched what that did to Overtown. Kids on corners. Mothers who can\u2019t remember their own names. You want to get rich? Fine. But not like that. Not around me.\u201D",portrait:"angry"}],choices:[{text:"It\u2019s just business, Maria",reaction:"\u201CMy mother said the same thing about the hotel. \u2018It\u2019s just work, Maria.\u2019 It\u2019s never just anything.\u201D She leaves her drink untouched. That\u2019s how you know it\u2019s serious.",effects:{"npc.maria.trust":-2,flags:["maria_hates_crack"]}}]},elena_contact_sheet:{speaker:"ramirez",portrait:"tired",priority:11,conditions:{"npc.ramirez.met":{eq:!0},evidenceGte:5,flagNot:"elena_met",dealsSinceGte:3},lines:[{text:"Ramirez is sitting on the hood of the brown sedan with a manila envelope on his knee, eating a Cuban sandwich with the concentration of a man who missed lunch on Tuesday and is aware that it is now Thursday.",portrait:"neutral"},{text:"\u201CMy kid takes pictures. Eighteen. Night classes at Miami-Dade, thinks this city is a SUBJECT instead of a place.\u201D He slides a contact sheet across the hood. Thirty-six tiny frames of Overtown at dusk. \u201CFrame nineteen.\u201D",portrait:"tired"},{text:"Frame nineteen is you. Half-turned, hand out, taking money on a corner that has never once been photographed for its architecture. \u201CShe doesn\u2019t know what she got. She thinks it\u2019s a picture about the light.\u201D",portrait:"wry"}],choices:[{text:"She won't see me on that corner again",reaction:"\u201CThat\u2019s the correct answer. It\u2019s also the answer everybody gives me.\u201D He folds the sheet back into the envelope like a man putting a bird back in a cage. \u201CElena. Her name is Elena. Now you know it, which means now it costs you something.\u201D",effects:{"npc.ramirez.trust":1,flags:["elena_met","elena_promise"],montage:"Ramirez showed you frame nineteen. Her name is Elena."}},{text:"Keep your family out of my business",reaction:"\u201CShe walked into YOUR business, kid. With a camera her grandmother paid for.\u201D He gets off the hood, brushing crumbs off a tie that stopped being fashionable during the Carter administration. \u201CFifteen years I\u2019ve done this without hating anybody. Don\u2019t be the one who ruins the record.\u201D",effects:{"npc.ramirez.evidence":1,"npc.ramirez.trust":-1,flags:["elena_met"],montage:"Told Ramirez to keep his family out of it. He remembered that."}}]},elena_exhibition:{speaker:"maria",portrait:"knowing",priority:11,conditions:{flag:"elena_met","npc.maria.met":{eq:!0},evidenceGte:7,flagNot:"elena_project",dealsSinceGte:4},lines:[{text:"Maria has a habit of knowing your business before you have finished having it. Tonight she is holding a gallery mailer and wearing an expression you have learned to be afraid of.",portrait:"knowing"},{text:"\u201CJuried student show at the Center for Fine Arts. Thirty prints. It\u2019s called THE ECONOMY OF LIGHT.\u201D She taps a name on the mailer: E. RAMIREZ. \u201CThe girl is good, by the way. Genuinely good. That\u2019s the inconvenient part.\u201D",portrait:"amused"},{text:"\u201CFrame nineteen goes on a wall four blocks from the State Attorney\u2019s office, blown up to a meter wide. A prosecutor will stand in front of it holding a plastic cup of chardonnay and he WILL recognize you, cowboy, because that is what prosecutors do at parties.\u201D",portrait:"neutral"}],choices:[{text:"Buy the whole series, anonymously \u2014 $6,000",reaction:"Maria buys it through the gallery as an unnamed collector, which is the most Miami sentence ever constructed. The girl gets six thousand dollars and believes she has arrived. In a way she has. \u201CShe\u2019ll shoot boats next,\u201D Maria predicts. \u201CRich people adore boats.\u201D",effects:{cashDelta:-6e3,"npc.maria.trust":1,"npc.ramirez.trust":1,flags:["elena_project","elena_bought"],montage:"Bought Elena Ramirez's entire show. Anonymously. $6,000."}},{text:"Let it hang. Let them look.",reaction:"\u201CBold.\u201D She refolds the mailer with surgical care. \u201CYou understand that this is how legends start AND how sentences do.\u201D The show opens Thursday. Nine hundred people come through in three weeks. Two of them work for the government.",effects:{cred:6,heatDelta:6,"npc.ramirez.evidence":3,flags:["elena_project","elena_published"],montage:"Let your face hang in a museum. Nine hundred people came."}}]},elena_the_ask:{speaker:"ramirez",portrait:"tired",priority:12,conditions:{flag:"elena_project",evidenceGte:11,flagNot:"elena_asked",dealsSinceGte:3},lines:[{text:"Four in the morning at a Denny\u2019s on Biscayne. Ramirez has the corner booth and the look of a man who has been rehearsing in the car. There is no file on the table. That is how you know this is not police work.",portrait:"tired"},{text:"\u201CShe\u2019s going back to Overtown. Nights, now. She says the light is better and the people are honest, and she is RIGHT, which is the entire problem.\u201D He turns his coffee cup a quarter turn. \u201CI\u2019ve told her. Her mother\u2019s told her. She has my stubbornness and her mother\u2019s nerve. God help the both of us.\u201D",portrait:"tired"},{text:"\u201CSo I am going to ask a criminal for a favor, and then I am going to go sit in my car for a while. Scare her off those corners. Not touch her \u2014 SCARE her. Be the thing she currently thinks is just an interesting shadow.\u201D",portrait:"wry"}],choices:[{text:"I'll be the monster. Once.",reaction:"You wait under a dead streetlight and say four sentences you will remember for the rest of your life. She runs. She drops a lens cap and does not come back for it. Three days later a paper bag appears on your car: the lens cap, a page torn out of a file, and no note at all.",effects:{cred:-4,"npc.ramirez.trust":2,"npc.ramirez.evidence":-4,flags:["elena_asked","elena_scared"],montage:"Scared Elena Ramirez off the corners. Four sentences. No note."}},{text:"No. She's got your spine \u2014 respect it.",reaction:"He looks at you for a long moment and something in his face does an unfamiliar thing. \u201CYeah,\u201D he says finally. \u201CShe does.\u201D He pays for both coffees. \u201CI\u2019m still going to put you in prison. But I\u2019m going to feel a way about it now, and I didn\u2019t before.\u201D",effects:{"npc.ramirez.trust":2,"npc.ramirez.evidence":1,flags:["elena_asked","elena_respected"],montage:"Refused to scare Ramirez's daughter. He paid for the coffee."}},{text:"Interesting. A detective with a pressure point.",reaction:"The temperature in the booth drops ten degrees. \u201CI came here as a father,\u201D he says, very quietly, \u201Cand you answered me as a dealer. Fine. Then that\u2019s who I arrest.\u201D He leaves cash on the table \u2014 exact, to the penny, including tax. You have just made an enemy of the only honest man in Dade County.",effects:{cred:4,"npc.ramirez.trust":-4,"npc.ramirez.evidence":3,flags:["elena_asked","elena_used"],montage:"Threatened Ramirez with his own daughter. The booth got cold."}}]},elena_the_debt:{speaker:"ramirez",portrait:"tired",priority:13,conditions:{flagAny:["elena_scared","elena_respected"],evidenceGte:14,flagNot:"elena_resolved",dealsSinceGte:2},lines:[{text:"A shopping-center parking lot in Kendall, which is where men do the things they cannot do downtown. Ramirez has a cardboard box in the trunk and a lighter he borrowed from somebody, because he quit smoking in 1979 and has mentioned it every year since.",portrait:"neutral"},{text:"\u201CTwo hundred and six pages in this box exist only because I wrote them down. Not evidence \u2014 INTELLIGENCE. The difference is a lawyer, but the difference is also me.\u201D He lights the first page off the second. \u201CShe printed a photograph of me last month. I look old in it. I AM old in it.\u201D",portrait:"tired"},{text:"\u201CThis doesn\u2019t make us friends and it doesn\u2019t make you clean. It makes us two men who agreed about one thing, one time.\u201D The box burns in a shopping cart behind a closed Zayre. A security guard looks at it for a while and decides it is not his problem.",portrait:"wry"}],choices:[{text:"Thank you, detective",reaction:"\u201CDon\u2019t.\u201D He watches the last page curl. \u201CThank me by being GONE. Genuinely gone \u2014 not Fort Lauderdale gone. If I see you in this city in six months I will rebuild every page, and I will be faster the second time.\u201D",effects:{"npc.ramirez.evidence":-8,"npc.ramirez.trust":1,flags:["elena_resolved","ramirez_debt"],montage:"Ramirez burned 206 pages in a shopping cart behind a dead Zayre."}},{text:"Rebuild it. I'll still be here.",reaction:"He laughs \u2014 an actual laugh, rusty from lack of use. \u201CThat is the most honest thing anybody has said to me all year.\u201D He burns the pages anyway. \u201CConsider it a head start. I have never given one before and I do not expect to enjoy the experience.\u201D",effects:{cred:5,"npc.ramirez.evidence":-6,flags:["elena_resolved","ramirez_debt"],montage:"Told Ramirez you'd stay. He gave you the head start anyway."}}]},elena_vendetta:{speaker:"ramirez",portrait:"wry",priority:13,conditions:{flag:"elena_used",evidenceGte:13,flagNot:"elena_resolved",dealsSinceGte:2},lines:[{text:"There is no meeting. There is a Tuesday when three people you trust stop returning calls, a Wednesday when your favorite payphone is suddenly out of order, and a Thursday when you understand that the brown sedan has not been behind you in eleven days because it no longer needs to be.",portrait:"neutral"},{text:"He finally calls. No greeting. \u201CI took two weeks of vacation,\u201D Ramirez says. \u201CFirst time since \u201981. I spent all of it on you. Do you have any idea what a man can build in fourteen days when nobody is making him do paperwork?\u201D",portrait:"wry"},{text:"\u201CMy daughter asked why I was working on my vacation. I told her a man had threatened her with a smile. She said, \u2018Dad, that\u2019s awful.\u2019 She\u2019s eighteen. She still thinks awful is RARE.\u201D",portrait:"tired"}],choices:[{text:"You've got nothing that sticks",reaction:"\u201CI have your supplier\u2019s cousin, your banker\u2019s intern, and a wiretap on a payphone you are sentimental about.\u201D A pause you could park a car in. \u201CIt doesn\u2019t have to stick. It has to WEIGH.\u201D",effects:{heatDelta:12,"npc.ramirez.evidence":4,flags:["elena_resolved","ramirez_vendetta"],montage:"Ramirez spent his vacation on you. All fourteen days of it."}},{text:"Name your price, detective",reaction:"The silence goes on long enough that you check the line. \u201CThirty-eight thousand a year,\u201D he says at last. \u201CThat is the number you are fishing for. You should understand that I have known it every single day since 1971, and that it has never once been for sale.\u201D Click.",effects:{cred:-3,heatDelta:8,"npc.ramirez.evidence":3,flags:["elena_resolved","ramirez_vendetta"],montage:"Tried to buy Ramirez. He quoted you his salary and hung up."}}]},ramirez_quiet_week:{speaker:"ramirez",portrait:"wry",priority:7,conditions:{"npc.ramirez.met":{eq:!0},fedHeatLte:10,totalProfitGte:6e4,flagNot:"quiet_week",dealsSinceGte:4},lines:[{text:"Ramirez is in line behind you at a Farm Store on Bird Road buying a lottery ticket and a banana, and he does not pretend to be surprised. \u201CRelax. It\u2019s my day off. I get those. There\u2019s a rumor about them.\u201D",portrait:"wry"},{text:"\u201CYou\u2019ve been quiet. Eleven days of quiet. You know what quiet does to a surveillance file? It makes it look like a MISTAKE. Two weeks of quiet and my captain reassigns me to a boat-theft ring in Hollywood.\u201D",portrait:"tired"},{text:"\u201CSo: congratulations. Sincerely. You are winning, in the specific way this thing is winnable \u2014 which is boringly, and for a while, and then not.\u201D He buys the banana. He leaves the lottery ticket on the counter.",portrait:"wry"}],choices:[{text:"Take the day off, detective",reaction:"\u201CI\u2019m trying. My wife would tell you how that\u2019s going.\u201D He eats the banana in the parking lot next to a car that has not started on the first try since the Ford administration. \u201CStay quiet. Genuinely. It\u2019s the only advice I hand out for free.\u201D",effects:{heatDelta:-4,"npc.ramirez.trust":1,flags:["quiet_week"],montage:"Ramirez said quiet was winning. Then he bought a banana."}},{text:"Enjoy Hollywood",reaction:"\u201CBoat theft,\u201D he says wistfully. \u201CNobody dies in boat theft. My daughter would see me at dinner.\u201D He looks at you a second too long. \u201CAnd then some idiot would get loud in Overtown, and I would come back, and I would not be in a good mood about it.\u201D",effects:{cred:2,"npc.ramirez.evidence":1,flags:["quiet_week"],montage:"Wished Ramirez luck with the boat-theft ring in Hollywood."}}]},ramirez_third_time:{speaker:"ramirez",portrait:"tired",priority:8,conditions:{"npc.ramirez.met":{eq:!0},bustsGte:2,flagNot:"two_busts",dealsSinceGte:3},lines:[{text:"\u201CTwo arrests,\u201D Ramirez says from the passenger seat of his own car, in a parking garage, with the door open and one foot on the ground like a man who has not decided whether he is staying. \u201CNeither of them mine, which annoys me more than you can possibly imagine.\u201D",portrait:"tired"},{text:"\u201CHere is a thing nobody tells you. The first arrest is an accident. The second is a pattern. The third is a SENTENCE. Judges in this county count to three out loud \u2014 it\u2019s practically a ceremony, they enjoy it.\u201D",portrait:"wry"}],choices:[{text:"There won't be a third",reaction:"\u201CThat is what the paperwork always says.\u201D He shuts the door and rolls the window down, because the air conditioning has not worked in years. \u201CFor what it\u2019s worth \u2014 and it is worth nothing \u2014 I hope you\u2019re right. I have enough people in Coleman.\u201D",effects:{"npc.ramirez.trust":1,flags:["two_busts"],montage:"Ramirez explained how judges in Dade County count to three."}},{text:"Third time's a charm, detective",reaction:"He laughs with no joy in it whatsoever. \u201CYou know what I like about this job? Nobody has ever surprised me. Not once in fifteen years.\u201D The window goes up. Somewhere in Vice Intelligence a note is added to a file, and this one is not underlined, which is somehow worse.",effects:{cred:2,"npc.ramirez.evidence":2,flags:["two_busts"],montage:"Told Ramirez third time's a charm. He stopped being surprised in 1971."}}]},ramirez_proffer:{speaker:"ramirez",portrait:"neutral",priority:12,conditions:{flag:"prosecutor_card",evidenceGte:12,flagNot:"proffer_done",dealsSinceGte:3},lines:[{text:"Room 411, federal building, a table with a scratch in it shaped almost exactly like Florida. AUSA Vance lays two documents side by side and does not sit down. Ramirez sits. Ramirez has brought his own thermos, because he does not trust the machine on four.",portrait:"neutral"},{text:"\u201CProffer letter,\u201D he says, tapping the left one. \u201CYou talk, and it can\u2019t be used against you directly. Directly is doing a lot of work in that sentence, and she will tell you it isn\u2019t.\u201D Vance says, evenly, \u201CIt isn\u2019t.\u201D Ramirez drinks his coffee.",portrait:"tired"},{text:"\u201CFive years, of which you serve most of three, at a camp with a running track and a library. Versus what she asks for at trial, which is a number I do not say out loud in front of people who might faint in a federal building.\u201D",portrait:"wry"}],choices:[{text:"Sign the proffer",reaction:"You talk for six hours. It is the least glamorous day of your criminal career and by far the most consequential. Your file stops being a case and becomes a COOPERATION, which is a different building entirely. Somewhere south, men who read the Herald carefully begin reading it about you.",effects:{cred:-14,"npc.ramirez.evidence":-9,"npc.colombiano.trust":-3,flags:["proffer_done","proffer_signed","became_informant"],montage:"Signed the proffer in room 411. Six hours. Talked about everybody."}},{text:"Not today, counselor",reaction:"Vance caps her pen with the finality of a woman who has just been handed a gift. \u201CGood. Honestly. Half my convictions are men who signed that thing badly.\u201D In the elevator Ramirez says, to nobody in particular, \u201CThat\u2019s the one I\u2019d have picked too,\u201D and then does not speak to you for a month.",effects:{cred:6,"npc.ramirez.evidence":2,flags:["proffer_done","refused_proffer"],montage:"Refused the proffer. Vance capped her pen and looked disappointed."}}]},ramirez_intro:{speaker:"ramirez",portrait:"neutral",priority:15,conditions:{fedHeatGte:15,"npc.ramirez.met":{eq:!1}},lines:[{text:"Your barber stops mid-cut. Nods toward the window. Brown sedan. A man in a suit last fashionable during the Carter administration, drinking thermos coffee and reading a very thick file.",portrait:"neutral"},{text:"\u201CThat\u2019s Ramirez. Vice Intelligence. He\u2019s been out there since Tuesday.\u201D You ask if he\u2019s dangerous.",portrait:"neutral"},{text:"\u201CHe\u2019s honest. In this town, that\u2019s the most dangerous thing you can be.\u201D",portrait:"wry"}],choices:[{text:"Noted",reaction:"Your barber finishes the cut in silence. When you leave, Ramirez doesn\u2019t look up from his file. He doesn\u2019t need to. He already has your picture in it.",effects:{"npc.ramirez.met":!0,"npc.ramirez.evidence":2,flags:["ramirez_watching"]}}]},ramirez_coffee:{speaker:"ramirez",portrait:"wry",priority:10,conditions:{"npc.ramirez.met":{eq:!0},evidenceGte:3,flagNot:"ramirez_coffee",dealsSinceGte:3},lines:[{text:"He\u2019s waiting outside the caf\xE9 on Calle Ocho. Doesn\u2019t try to hide. Steps right up like you\u2019re old friends.",portrait:"neutral"},{text:"\u201CNice morning, isn\u2019t it? I love Miami in spring. The weather\u2019s beautiful. The crime rate, less so. Want a coffee? I\u2019m buying. Accepting coffee from an officer is not legally admissible \u2014 I checked.\u201D",portrait:"wry"},{text:"He smiles. It\u2019s the smile of a man who is patient in a way that should terrify you. \u201CI\u2019m not arresting you today. I just wanted you to know that I know. And now you know that I know. Isn\u2019t that nice? Enjoy the coffee.\u201D",portrait:"wry"}],choices:[{text:"Drink the coffee",reaction:"Good coffee. He watches you drink it like a man with all the time in the world. \u201CI make $38,000 a year. The guy I surveilled yesterday tipped a valet more than my mortgage. But sure \u2014 the system works.\u201D",effects:{"npc.ramirez.evidence":1,flags:["ramirez_coffee"]}},{text:"Walk away",reaction:"\u201CThey always walk away.\u201D You hear him sip behind you. \u201CThat\u2019s fine. I\u2019m patient. My captain says I\u2019m turning the tide. I\u2019ve been turning the tide for fifteen years. The tide hasn\u2019t noticed.\u201D",effects:{flags:["ramirez_coffee","ramirez_disrespected"]}}]},ramirez_photos:{speaker:"ramirez",portrait:"neutral",priority:10,conditions:{evidenceGte:6,flag:"ramirez_coffee",flagNot:"ramirez_photos",dealsSinceGte:3},lines:[{text:"An envelope on your windshield. No stamp. Inside: three Polaroids.",portrait:"neutral"},{text:"You, making a deal in Overtown. You, counting cash in Little Havana. You, meeting a lieutenant who works for a man you haven\u2019t met yet.",portrait:"neutral"},{text:"On the back of the third photo, in neat handwriting: \u201CMy daughter wants to be a photographer. I told her I\u2019m already pretty good at it. \u2014 H.R.\u201D The man has a sense of humor. That makes it worse.",portrait:"wry"}],choices:[{text:"Burn the photos",reaction:"You burn them over the stove. The smoke smells like evidence and bad decisions. But you know Ramirez has copies. A man that patient always has copies.",effects:{flags:["ramirez_photos"]}},{text:"He\u2019s bluffing",reaction:"He wasn\u2019t bluffing. Somewhere in Vice Intelligence, Ramirez adds a note to your file: \u201CSubject displays poor judgment under pressure.\u201D He underlines it twice.",effects:{"npc.ramirez.evidence":2,flags:["ramirez_photos"]}}]},ramirez_offer:{speaker:"ramirez",portrait:"tired",priority:12,conditions:{evidenceGte:10,flagNot:"ramirez_deal_offered",dealsSinceGte:3},lines:[{text:"He calls from a payphone. You can hear traffic. He sounds tired.",portrait:"tired"},{text:"\u201CLet\u2019s skip the part where I pretend this is social. I have enough on you for fifteen to twenty. Federal. The Colombians, the laundering, the whole circus. But here\u2019s the thing \u2014 I don\u2019t want you. You\u2019re not the prize. You\u2019re the door.\u201D",portrait:"neutral"},{text:"\u201CGive me the cartel. Real intel \u2014 shipment dates, routes, contacts. In exchange your file goes in a drawer that never opens. You walk away clean. Maybe not morally clean, but legally clean, and in Miami that\u2019s the best anyone gets.\u201D",portrait:"wry"}],choices:[{text:"Become an informant",reaction:"\u201CSmart. Or desperate. Either way, we have a deal.\u201D A pause. Coffee being sipped. \u201CFor what it\u2019s worth? You made the right call. The other option involved a prison in Coleman, Florida. Two hours from Miami. You can almost smell the ocean on humid days.\u201D",effects:{"npc.ramirez.evidence":-6,"npc.colombiano.trust":-3,cred:-10,flags:["ramirez_deal_offered","became_informant"]}},{text:"Go to hell, Ramirez",reaction:"\u201CI figured. They always say that. And six months from now, when the walls are really closing in, you\u2019ll wish you\u2019d taken the deal. My number won\u2019t change.\u201D He hangs up. His car takes three tries to start. Even his car is exhausted.",effects:{"npc.ramirez.evidence":3,flags:["ramirez_deal_offered","refused_ramirez"]}}]},col_chemist:{speaker:"colombiano",portrait:"pleased",priority:11,conditions:{flag:"cartel_supplier",totalProfitGte:7e4,flagNot:"chemist_met",dealsSinceGte:3},lines:[{text:"A warehouse in Doral that smells like ether and orange peel. El Colombiano walks you past forty drums of something entirely legal to one small table with a scale on it, where a thin man in reading glasses is doing something delicate with a beaker.",portrait:"neutral"},{text:"\u201CThis is Aurelio. In Medell\xEDn he is a national resource. He is HERE because a man who is a national resource is also a national liability, and I prefer my resources where I can see them. Aurelio \u2014 tell the man your number.\u201D",portrait:"pleased"},{text:"Aurelio does not look up. \u201CNinety-four,\u201D he says. \u201CNinety-six if the acetone is not from Hialeah.\u201D El Colombiano beams like a father at a recital. \u201CNinety-six. Do you understand what that does to a market, friend? This city has been drinking WATER and calling it rum.\u201D",portrait:"pleased"}],choices:[{text:"Put me on his output",reaction:"\u201CThat is the correct greed.\u201D Your shipments start coming out of Doral, and for a while every corner in Miami tastes the difference and pays for it. Aurelio never looks up. Not once, not in nine weeks. You begin to notice that.",effects:{"npc.colombiano.trust":2,demandBoost:{idx:5,mult:1.45},flags:["chemist_met"],montage:"Got on Aurelio's output. Ninety-six percent, and the city noticed."}},{text:"Why show me this?",reaction:"\u201CBecause a man who is shown a thing becomes responsible for it.\u201D He says it pleasantly, adjusting a cuff. \u201CThat is not a threat, friend, it is a DEFINITION. In my business we do not have contracts. We have people who have been shown things.\u201D",effects:{"npc.colombiano.trust":1,flags:["chemist_met","chemist_wary"],montage:"El Colombiano showed you the chemist. That made you responsible."}}]},chemist_defects:{speaker:"maria",portrait:"knowing",priority:12,conditions:{flag:"chemist_met",fedHeatGte:35,flagNot:"chemist_resolved",dealsSinceGte:4},lines:[{text:"Maria calls you to the gallery at closing and locks the door behind you, which she has never done. A man is sitting on the bench in front of the sad horse painting, holding a briefcase on his knees like a passenger waiting for a bus.",portrait:"neutral"},{text:"\u201CHe walked into MY gallery,\u201D she says, in the voice of a woman itemizing damages. \u201CAurelio. The cook. He has a sister in Costa Rica, eleven thousand dollars, and a suitcase that is mostly notebooks, and he believes that is a plan.\u201D",portrait:"knowing"},{text:"\u201CSo now you have three doors, cowboy, and every one of them locks behind you. Get him out. Sell him to the detective. Or hand him back to the man in the cream suit and then sleep however it is that you sleep.\u201D",portrait:"amused"}],choices:[{text:"Get him out. Costa Rica. \u2014 $12,000",reaction:"It costs twelve thousand, a night boat out of Tavernier, and a driver who does not ask questions. Aurelio shakes your hand with both of his and says a word in a language you do not speak. Maria watches the taillights. \u201CWell,\u201D she says. \u201CThat was expensive AND correct. Enjoy the novelty.\u201D",effects:{cashDelta:-12e3,cred:4,"npc.maria.trust":2,"npc.colombiano.trust":-3,flags:["chemist_resolved","chemist_freed"],montage:"Put the cartel's chemist on a night boat out of Tavernier."}},{text:"Sell him to Ramirez",reaction:"A detective meets a chemist in a federal building at 6 AM, and by noon a warehouse in Doral belongs to the government. Your file gets thinner. So does the list of people who will meet you alone. Maria does not call for nine days, and when she does it is about something else.",effects:{cred:-8,"npc.ramirez.evidence":-6,"npc.maria.trust":-2,"npc.colombiano.trust":-4,flags:["chemist_resolved","chemist_sold","became_informant"],montage:"Sold Aurelio to Vice. The Doral warehouse belongs to the government now."}},{text:"Call the cream suit",reaction:"El Colombiano thanks you personally, which is the part you will think about later. Ten thousand dollars arrives in a shoebox with a bottle of rum on top. Nobody sees Aurelio again. The product stays at ninety-six percent for exactly two more months, and then it doesn\u2019t.",effects:{cashDelta:1e4,"npc.colombiano.trust":3,"npc.maria.trust":-2,flags:["chemist_resolved","chemist_delivered"],montage:"Handed the chemist back. A shoebox, a bottle of rum, no questions."}}]},chemist_postcard:{speaker:"maria",portrait:"amused",priority:7,conditions:{flag:"chemist_freed",flagNot:"chemist_echo",dealsSinceGte:5},lines:[{text:"A postcard reaches the gallery: a pelican, a pier, and eight sentences of extremely careful handwriting that never once says a name. Folded into the envelope it arrived in, four thousand dollars in American twenties.",portrait:"amused"},{text:"\u201CHe teaches chemistry at a secondary school now,\u201D Maria reports, reading it twice. \u201CHe says the students are terrible and the acetone is excellent.\u201D She looks up. \u201CYou understand that this never happens. In eleven years I have never once watched a man get OUT.\u201D",portrait:"knowing"}],choices:[{text:"Frame the money with the postcard",reaction:"She hangs it between two paintings nobody will ever buy \u2014 real money behind glass, priced at forty thousand dollars. \u201CIt\u2019s the only honest object in this gallery,\u201D she says, \u201Cso obviously it is the one thing I will never sell.\u201D",effects:{cred:2,"npc.maria.trust":2,flags:["chemist_echo","postcard_framed"],montage:"A postcard from Puntarenas, framed with four thousand dollars behind glass."}},{text:"Take the four grand",reaction:"\u201COf course you do.\u201D She hands it over without judgment, which from Maria is its own particular kind of judgment. The postcard she keeps. It goes in a drawer with the two other things she has ever kept.",effects:{cashDelta:4e3,flags:["chemist_echo"],montage:"Took the chemist's four thousand dollars. Maria kept the postcard."}}]},chemist_letters:{speaker:"colombiano",portrait:"pleased",priority:7,conditions:{flag:"chemist_delivered",flagNot:"chemist_echo",dealsSinceGte:5},lines:[{text:"El Colombiano takes you to dinner at a place with no menu and orders in Spanish without looking up, exactly as he did the first time. \u201CA toast, friend. To loyalty \u2014 rarer than product, and priced about the same.\u201D",portrait:"pleased"},{text:"Halfway through the fish he says, c
